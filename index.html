<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UnderFy</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b0b0b;color:#fff;font-family:Arial,Helvetica,sans-serif;}
button,input{font:inherit;}
button{cursor:pointer;}
.app{min-height:100vh;padding-bottom:110px;}

header{
    position:sticky;top:0;z-index:20;
    background:rgba(11,11,11,.95);backdrop-filter:blur(15px);
    padding:18px 5%;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid #202020;
}
.logo{font-size:27px;font-weight:900;letter-spacing:-1px;display:flex;align-items:center;gap:12px;}
.logo .fy{color:#1ed760;}
.logo .by-uta{color:#ffffff;}
.header-btn{border:0;background:#1ed760;color:#000;font-weight:bold;padding:10px 16px;border-radius:25px;}

main{width:90%;max-width:1200px;margin:auto;}
.hero{
    margin-top:25px;min-height:260px;border-radius:25px;padding:35px;
    display:flex;flex-direction:column;justify-content:flex-end;
    background:linear-gradient(135deg,#171717,#063d20);overflow:hidden;
}
.hero small{color:#1ed760;font-weight:bold;margin-bottom:10px;}
.hero h1{font-size:42px;margin-bottom:10px;}
.hero p{color:#bbb;max-width:600px;}

.section{margin-top:35px;}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.section-title h2{font-size:22px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px;}
.card{background:#151515;padding:14px;border-radius:15px;position:relative;}
.cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#252525;}
.card h3{margin-top:12px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card p{color:#999;margin-top:5px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-plays{color:#1ed760;font-size:12px;margin-top:4px;font-weight:bold;}
.play{margin-top:12px;width:100%;border:0;background:#1ed760;color:#000;padding:10px;border-radius:20px;font-weight:bold;}

.empty{color:#888;text-align:center;padding:30px 10px;grid-column:1/-1;}
.search{margin-top:25px;}
input{width:100%;padding:13px;margin:7px 0 13px;background:#252525;border:1px solid #333;color:#fff;border-radius:9px;outline:none;}

/* MINI PLAYER E MODAL PLAYER (Mantidos compactos) */
.mini-player{position:fixed;bottom:65px;left:0;right:0;z-index:30;background:#171717;border-top:1px solid #292929;padding:12px 5%;display:none;align-items:center;gap:15px;cursor:pointer;}
.mini-player img{width:50px;height:50px;object-fit:cover;border-radius:7px;}
.mini-player-info{flex:1;min-width:0;}
.mini-player-info strong, .mini-player-info span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.mini-player-info span{color:#999;font-size:13px;margin-top:3px;}

.player-modal{display:none;position:fixed;inset:0;z-index:150;background:rgba(0,0,0,0.85);backdrop-filter:blur(20px);align-items:center;justify-content:center;padding:20px;}
.player-card{background:#141414;border:1px solid #262626;width:100%;max-width:420px;border-radius:35px;padding:30px 25px;display:flex;flex-direction:column;align-items:center;}
.player-cover-container{width:100%;aspect-ratio:1;border-radius:25px;overflow:hidden;margin-bottom:25px;}
.player-cover-container img{width:100%;height:100%;object-fit:cover;}
.player-song-info{text-align:center;margin-bottom:20px;width:100%;}
.player-actions{display:flex;align-items:center;justify-content:center;gap:25px;margin-bottom:20px;}
.main-play-btn{background:#1ed760;color:#000;border:0;width:65px;height:65px;border-radius:50%;font-size:24px;font-weight:bold;display:flex;align-items:center;justify-content:center;}

nav{position:fixed;bottom:0;left:0;right:0;height:65px;background:#101010;border-top:1px solid #252525;z-index:40;display:flex;justify-content:center;gap:40px;}
nav button{border:0;background:none;color:#aaa;font-size:12px;}
</style>
</head>
<body>

<div class="app">
    <header>
        <div class="logo">Under<span class="fy">Fy</span> <span class="by-uta">• UTA</span></div>
        <button class="header-btn" onclick="alert('Painel ADM')">ADM</button>
    </header>

    <main>
        <section class="hero">
            <small>UNDERFY • STUDIO CAMP</small>
            <h1>As guias da sessão.</h1>
            <p>Um espaço para ouvir, descobrir e organizar as músicas criadas.</p>
        </section>

        <input class="search" id="pesquisa" placeholder="🔎 Pesquisar música ou artista..." oninput="pesquisar()">

        <section class="section">
            <div class="section-title"><h2>🎧 Guias recentes</h2></div>
            <div class="grid" id="listaMusicas"><div class="empty">Carregando músicas...</div></div>
        </section>

        <section class="section">
            <div class="section-title"><h2>🎤 Artistas</h2></div>
            <div class="grid" id="listaArtistas"><div class="empty">Carregando artistas...</div></div>
        </section>
    </main>
</div>

<!-- MINI PLAYER -->
<div class="mini-player" id="miniPlayer">
    <img id="miniCapa" src="">
    <div class="mini-player-info">
        <strong id="miniMusica">Música</strong>
        <span id="miniArtista">Artista</span>
    </div>
</div>

<audio id="audio" style="display:none;"></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
console.log("Script carregando...");

const SUPABASE_URL = "https://gnibzbnypirjrcaoibkx.supabase.co";
const SUPABASE_KEY = "sb_publishable_b9yvSbmWOLVJvq4AB4CLmQ_VRuzpG5T";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let musicas = [];
let artistasCache = [];

async function iniciarApp() {
    try {
        console.log("Buscando dados no Supabase...");
        
        // Timeout de segurança de 5 segundos para destravar a tela caso a rede falhe
        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("Tempo de conexão esgotado.")), 5000));

        const fetchDados = async () => {
            const resArtistas = await supabaseClient.from('artistas').select('*');
            artistasCache = resArtistas.data || [];

            const resMusicas = await supabaseClient.from('musicas').select('*');
            const dadosMusicas = resMusicas.data || [];

            const resRel = await supabaseClient.from('musica_artistas').select('*');
            const dadosRelacao = resRel.data || [];

            return { dadosMusicas, dadosRelacao };
        };

        const { dadosMusicas, dadosRelacao } = await Promise.race([fetchDados(), timeout]);

        musicas = dadosMusicas.map(m => {
            const rels = dadosRelacao.filter(r => r.musica_id === m.id);
            const objsArtistas = rels.map(r => artistasCache.find(a => a.id === r.artista_id)).filter(Boolean);
            let artistasNomes = objsArtistas.length > 0 ? objsArtistas.map(a => a.nome) : ['Desconhecido'];
            
            return {
                id: m.id,
                nome: m.nome,
                artistaFormatado: artistasNomes.join(', '),
                capa: m.capa_url || 'https://via.placeholder.com/500',
                audio: m.audio_url || '',
                plays: m.plays || 0
            };
        });

        renderizarTudo();

    } catch (err) {
        console.error("Erro capturado:", err);
        document.getElementById("listaMusicas").innerHTML = `<div class="empty" style="color:#ff5555;">Erro ao carregar: ${err.message}</div>`;
        document.getElementById("listaArtistas").innerHTML = `<div class="empty" style="color:#ff5555;">Falha na conexão.</div>`;
    }
}

function renderizarTudo() {
    const container = document.getElementById("listaMusicas");
    if (musicas.length === 0) {
        container.innerHTML = `<div class="empty">Nenhuma música cadastrada ainda.</div>`;
    } else {
        container.innerHTML = musicas.map((m, index) => `
            <div class="card">
                <img class="cover" src="${m.capa}">
                <h3>${m.nome}</h3>
                <p>${m.artistaFormatado}</p>
                <div class="card-plays">▶ ${m.plays} plays</div>
                <button class="play" onclick="tocar(${index})">Ouvir</button>
            </div>
        `).join('');
    }

    const containerArtistas = document.getElementById("listaArtistas");
    if (artistasCache.length === 0) {
        containerArtistas.innerHTML = `<div class="empty">Nenhum artista cadastrado.</div>`;
    } else {
        containerArtistas.innerHTML = artistasCache.map(a => `
            <div class="card">
                <img class="cover" src="${a.foto_url || 'https://via.placeholder.com/500'}">
                <h3>${a.nome}</h3>
            </div>
        `).join('');
    }
}

function tocar(index) {
    const m = musicas[index];
    const audio = document.getElementById("audio");
    audio.src = m.audio;
    audio.play();
    document.getElementById("miniPlayer").style.display = "flex";
    document.getElementById("miniMusica").textContent = m.nome;
    document.getElementById("miniArtista").textContent = m.artistaFormatado;
    document.getElementById("miniCapa").src = m.capa;
}

function pesquisar() {
    const termo = document.getElementById("pesquisa").value.toLowerCase();
    const filtrado = musicas.filter(m => m.nome.toLowerCase().includes(termo) || m.artistaFormatado.toLowerCase().includes(termo));
    // Renderiza apenas os filtrados de forma rápida
    const container = document.getElementById("listaMusicas");
    if(filtrado.length === 0) {
        container.innerHTML = `<div class="empty">Nenhum resultado encontrado.</div>`;
    } else {
        container.innerHTML = filtrado.map(m => `
            <div class="card">
                <img class="cover" src="${m.capa}">
                <h3>${m.nome}</h3>
                <p>${m.artistaFormatado}</p>
                <div class="card-plays">▶ ${m.plays} plays</div>
            </div>
        `).join('');
    }
}

// Executa direto para evitar travamento de carregamento de DOM
iniciarApp();
</script>
</body>
</html>
