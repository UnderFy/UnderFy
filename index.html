<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UnderFy</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b0b0b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
    padding-bottom:110px;
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(11,11,11,.95);
    backdrop-filter:blur(15px);
    padding:18px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #202020;
}

.logo{
    font-size:27px;
    font-weight:900;
    letter-spacing:-1px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo .fy{
    color:#1ed760;
}

/* Mantém exatamente a mesma fonte, peso e proporção do UnderFy original */
.logo .by-uta {
    color: #ffffff;
    font-size: 27px;
    font-weight: 900;
    letter-spacing: -1px;
}

.header-btn{
    border:0;
    background:#1ed760;
    color:#000;
    font-weight:bold;
    padding:10px 16px;
    border-radius:25px;
}

/* CONTEÚDO */
main{
    width:90%;
    max-width:1200px;
    margin:auto;
}

.hero{
    margin-top:25px;
    min-height:260px;
    border-radius:25px;
    padding:35px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    background:linear-gradient(135deg,#171717,#063d20);
    overflow:hidden;
}

.hero small{
    color:#1ed760;
    font-weight:bold;
    margin-bottom:10px;
}

.hero h1{
    font-size:42px;
    margin-bottom:10px;
}

.hero p{
    color:#bbb;
    max-width:600px;
}

.section{
    margin-top:35px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.section-title h2{
    font-size:22px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:18px;
}

.card{
    background:#151515;
    padding:14px;
    border-radius:15px;
    transition:.2s;
    cursor:pointer;
    position: relative;
}

.card:hover{
    background:#202020;
    transform:translateY(-3px);
}

/* BOTÃO DE EXCLUIR DO ADM */
.btn-excluir {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(220, 38, 38, 0.9);
    color: white;
    border: none;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    transition: 0.2s;
}

.btn-excluir:hover {
    background: rgb(220, 38, 38);
    transform: scale(1.1);
}

.cover{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    border-radius:10px;
    background:#252525;
}

.card h3{
    margin-top:12px;
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card p{
    color:#999;
    margin-top:5px;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.play{
    margin-top:12px;
    width:100%;
    border:0;
    background:#1ed760;
    color:#000;
    padding:10px;
    border-radius:20px;
    font-weight:bold;
}

/* PLAYER */
.player{
    position:fixed;
    bottom:65px;
    left:0;
    right:0;
    z-index:30;
    background:#171717;
    border-top:1px solid #292929;
    padding:12px 5%;
    display:none;
    align-items:center;
    gap:15px;
}

.player img{
    width:50px;
    height:50px;
    object-fit:cover;
    border-radius:7px;
}

.player-info{
    flex:1;
    min-width:0;
}

.player-info strong,
.player-info span{
    display:block;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.player-info span{
    color:#999;
    font-size:13px;
    margin-top:3px;
}

audio{
    max-width:300px;
}

/* NAV */
nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:#101010;
    border-top:1px solid #252525;
    z-index:40;
    display:flex;
    justify-content:center;
    gap:40px;
}

nav button{
    border:0;
    background:none;
    color:#aaa;
    font-size:12px;
}

nav button:hover{
    color:#1ed760;
}

/* MODAIS */
.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.75);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-content{
    background:#181818;
    width:100%;
    max-width:550px;
    max-height:90vh;
    overflow:auto;
    border-radius:20px;
    padding:25px;
}

.modal-content h2{
    margin-bottom:20px;
}

.close{
    float:right;
    border:0;
    background:#292929;
    color:#fff;
    width:35px;
    height:35px;
    border-radius:50%;
}

input{
    width:100%;
    padding:13px;
    margin:7px 0 13px;
    background:#252525;
    border:1px solid #333;
    color:#fff;
    border-radius:9px;
    outline:none;
}

input:focus{
    border-color:#1ed760;
}

.form-btn{
    width:100%;
    padding:13px;
    background:#1ed760;
    color:#000;
    border:0;
    border-radius:25px;
    font-weight:bold;
    margin-top:5px;
}

.empty{
    color:#888;
    text-align:center;
    padding:30px 10px;
    grid-column: 1 / -1;
}

.search{
    margin-top:25px;
}

/* RESPONSIVO */
@media(max-width:700px){
    header{
        padding:15px 5%;
    }
    .logo{
        font-size:23px;
    }
    .logo .by-uta {
        font-size: 23px;
    }
    .hero{
        min-height:230px;
        padding:25px;
    }
    .hero h1{
        font-size:30px;
    }
    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }
    .card{
        padding:10px;
    }
    audio{
        width:130px;
    }
    nav{
        gap:20px;
    }
    .player{
        padding:10px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">
        Under<span class="fy">Fy</span>
        <span class="by-uta">by UTA</span>
    </div>

    <button class="header-btn" onclick="abrirADM()">
        ADM
    </button>
</header>

<main>

<section class="hero">
    <small>UNDERFY • STUDIO CAMP</small>
    <h1>As guias da sessão.</h1>
    <p>
        Um espaço para ouvir, descobrir e organizar
        as músicas criadas durante as sessões.
    </p>
</section>

<input
    class="search"
    id="pesquisa"
    placeholder="🔎 Pesquisar música ou artista..."
    oninput="pesquisar()"
>

<section class="section">
    <div class="section-title">
        <h2>🎧 Guias recentes</h2>
    </div>

    <div class="grid" id="listaMusicas">
        <div class="empty">Carregando músicas...</div>
    </div>
</section>

<section class="section">
    <div class="section-title">
        <h2>🎤 Artistas</h2>
    </div>

    <div class="grid" id="listaArtistas">
        <div class="empty">Carregando artistas...</div>
    </div>
</section>

</main>
</div>


<!-- PLAYER -->

<div class="player" id="player">

    <img id="playerCapa" src="">

    <div class="player-info">
        <strong id="playerMusica">Música</strong>
        <span id="playerArtista">Artista</span>
    </div>

    <audio id="audio" controls></audio>

</div>


<!-- NAV -->

<nav>
    <button onclick="irInicio()">🏠<br>Início</button>
    <button onclick="mostrarMusicas()">🎵<br>Guias</button>
    <button onclick="mostrarArtistas()">🎤<br>Artistas</button>
    <button onclick="abrirADM()">⚙️<br>ADM</button>
</nav>


<!-- LOGIN ADM -->

<div class="modal" id="modalLogin">

<div class="modal-content">

<button class="close" onclick="fecharModal('modalLogin')">×</button>

<h2>🔐 Área administrativa</h2>

<p style="color:#999;margin-bottom:15px;">
    Entre para gerenciar o UnderFy.
</p>

<input type="email" id="emailADM" placeholder="E-mail">

<input type="password" id="senhaADM" placeholder="Senha">

<button class="form-btn" onclick="loginADM()">
    Entrar
</button>

</div>
</div>


<!-- SUPABASE SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =====================================
   CONFIGURAÇÃO DO SUPABASE
===================================== */
const SUPABASE_URL = "https://gnibzbnypirjrcaoibkx.supabase.co";
const SUPABASE_KEY = "sb_publishable_b9yvSbmWOLVJvq4AB4CLmQ_VRuzpG5T";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* =====================================
   ESTADO GLOBAL DOS DADOS
===================================== */
let musicas = [];
let artistasCache = [];
let usuarioLogado = false;

async function verificarSessaoAdmin() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    usuarioLogado = !!session;
}

async function carregarDadosDoSupabase() {
    try {
        await verificarSessaoAdmin();

        // 1. Busca todos os artistas primeiro de forma isolada
        const { data: dadosArtistas, error: erroArtistas } = await supabaseClient
            .from('artistas')
            .select('*')
            .order('nome', { ascending: true });

        if (erroArtistas) throw erroArtistas;
        artistasCache = dadosArtistas || [];

        // 2. Busca todas as músicas de forma isolada
        const { data: dadosMusicas, error: erroMusicas } = await supabaseClient
            .from('musicas')
            .select('*')
            .order('created_at', { ascending: false });

        if (erroMusicas) throw erroMusicas;

        // Mapeia e cruza os dados com segurança pelo ID do artista
        musicas = (dadosMusicas || []).map(m => {
            const artistaObj = artistasCache.find(a => a.id === m.artista_id);
            return {
                id: m.id,
                nome: m.nome,
                artista: artistaObj ? artistaObj.nome : 'Desconhecido',
                capa: m.capa_url || 'https://via.placeholder.com/500',
                audio: m.audio_url || ''
            };
        });

        renderizarMusicas(musicas);
        renderizarArtistasNaTela();

    } catch (error) {
        console.error('Erro ao carregar dados:', error.message);
        document.getElementById("listaMusicas").innerHTML = `<div class="empty">Erro ao carregar músicas do banco.</div>`;
        document.getElementById("listaArtistas").innerHTML = `<div class="empty">Erro ao carregar artistas do banco.</div>`;
    }
}

// Inicializa o carregamento ao abrir a página
document.addEventListener('DOMContentLoaded', carregarDadosDoSupabase);


/* =====================================
   RENDERIZAR MÚSICAS
===================================== */
function renderizarMusicas(lista = musicas) {
    const container = document.getElementById("listaMusicas");
    container.innerHTML = "";

    if (lista.length === 0) {
        container.innerHTML = `<div class="empty">Nenhuma música encontrada.</div>`;
        return;
    }

    lista.forEach(musica => {
        // Se o usuário estiver logado como ADM, cria o botão de excluir no card
        const botaoExcluirHtml = usuarioLogado 
            ? `<button class="btn-excluir" onclick="excluirMusica('${musica.id}', event)" title="Excluir guia">✕</button>` 
            : '';

        container.innerHTML += `
        <div class="card">
            ${botaoExcluirHtml}
            <img class="cover" src="${musica.capa}" onerror="this.src='https://via.placeholder.com/500'">
            <h3>${musica.nome}</h3>
            <p>${musica.artista}</p>
            <button class="play" onclick="tocarMusica('${musica.id}')">
                ▶ Ouvir guia
            </button>
        </div>
        `;
    });
}


/* =====================================
   EXCLUIR MÚSICA
===================================== */
async function excluirMusica(id, event) {
    event.stopPropagation(); // Evita disparar cliques do card

    if (!confirm("Tem certeza que deseja excluir esta guia do banco de dados?")) {
        return;
    }

    try {
        const { error } = await supabaseClient
            .from('musicas')
            .delete()
            .eq('id', id);

        if (error) throw error;

        // Atualiza a lista local removendo a música excluída e re-renderiza
        musicas = musicas.filter(m => m.id != id);
        renderizarMusicas(musicas);
        renderizarArtistasNaTela();

        alert("Guia excluída com sucesso!");
    } catch (err) {
        console.error("Erro ao excluir:", err.message);
        alert("Erro ao excluir a música. Verifique suas permissões no Supabase.");
    }
}


/* =====================================
   ARTISTAS
===================================== */
function renderizarArtistasNaTela() {
    const container = document.getElementById("listaArtistas");
    container.innerHTML = "";

    if (artistasCache.length === 0) {
        container.innerHTML = `<div class="empty">Nenhum artista cadastrado.</div>`;
        return;
    }

    artistasCache.forEach(artista => {
        const qtdMusicas = musicas.filter(m => m.artista === artista.nome).length;

        container.innerHTML += `
        <div class="card" onclick="filtrarArtista('${artista.nome}')">
            <img class="cover" src="${artista.foto_url || 'https://via.placeholder.com/500'}" onerror="this.src='https://via.placeholder.com/500'">
            <h3>${artista.nome}</h3>
            <p>${qtdMusicas} guia(s)</p>
        </div>
        `;
    });
}


/* =====================================
   PLAYER
===================================== */
function tocarMusica(id) {
    const musica = musicas.find(m => m.id == id);
    if (!musica) return;

    document.getElementById("player").style.display = "flex";
    document.getElementById("playerMusica").textContent = musica.nome;
    document.getElementById("playerArtista").textContent = musica.artista;
    document.getElementById("playerCapa").src = musica.capa;

    const audio = document.getElementById("audio");

    if (!musica.audio) {
        alert("Essa guia ainda não possui um arquivo de áudio.");
        return;
    }

    audio.src = musica.audio;
    audio.play();
}


/* =====================================
   PESQUISA
===================================== */
function pesquisar() {
    const termo = document.getElementById("pesquisa").value.toLowerCase();
    const resultado = musicas.filter(m =>
        m.nome.toLowerCase().includes(termo) ||
        m.artista.toLowerCase().includes(termo)
    );
    renderizarMusicas(resultado);
}


/* =====================================
   FILTRAR POR ARTISTA
===================================== */
function filtrarArtista(artista) {
    const resultado = musicas.filter(m => m.artista === artista);
    renderizarMusicas(resultado);
    window.scrollTo({ top: 0, behavior: "smooth" });
}


/* =====================================
   NAVEGAÇÃO
===================================== */
function irInicio() {
    window.scrollTo({ top: 0, behavior: "smooth" });
    renderizarMusicas();
}

function mostrarMusicas() {
    document.getElementById("listaMusicas").scrollIntoView({ behavior: "smooth" });
}

function mostrarArtistas() {
    document.getElementById("listaArtistas").scrollIntoView({ behavior: "smooth" });
}


/* =====================================
   ADM (LOGIN E REDIRECIONAMENTO)
===================================== */
function abrirADM() {
    document.getElementById("modalLogin").style.display = "flex";
}

async function loginADM() {
    const email = document.getElementById("emailADM").value.trim();
    const senha = document.getElementById("senhaADM").value.trim();

    if (!email || !senha) {
        alert("Preencha e-mail e senha.");
        return;
    }

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: senha
    });

    if (error) {
        alert("E-mail ou senha incorretos.");
        return;
    }

    // Redireciona para o painel de upload/admin autenticado
    window.location.href = "upload.html";
}


/* =====================================
   MODAIS GERAIS
===================================== */
function fecharModal(id) {
    document.getElementById(id).style.display = "none";
}

window.onclick = function(event) {
    if (event.target.classList.contains("modal")) {
        event.target.style.display = "none";
    }
};
</script>
    
</body>
</html>
