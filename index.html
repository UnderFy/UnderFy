<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnderFy - Conectando Artistas</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* --- ESTILOS GERAIS & TEMA UNDERFY --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: #181818;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #282828;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #1db954;
            letter-spacing: 1px;
        }

        .main-container {
            flex: 1;
            padding: 20px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding-bottom: 120px; /* Espaço para o mini player */
        }

        /* --- STORIES CONTAINER --- */
        .stories-bar {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 0;
            margin-bottom: 25px;
            scrollbar-width: none;
        }
        .stories-bar::-webkit-scrollbar {
            display: none;
        }

        .story-ring {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            padding: 3px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .story-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0f0f0f;
        }

        /* --- MODAL DE VISUALIZAÇÃO DE STORY --- */
        #storyModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .story-viewer-box {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 80vh;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .story-viewer-box img, .story-viewer-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .close-story {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: #fff;
            font-size: 24px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- NOVOS ELEMENTOS: RODAPÉ DO STORY DO PRÓPRIO USUÁRIO & MODAL DE VIEWS --- */
        .story-owner-footer {
            position: absolute;
            bottom: 24px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10000;
        }

        .story-views-trigger {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .story-delete-btn-sm {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #ff4d4d;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
        }

        .story-delete-btn-sm:hover {
            background: rgba(255, 0, 0, 0.3);
        }

        .story-views-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 10002;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .story-views-content {
            background: #181818;
            width: 100%;
            max-width: 450px;
            max-height: 70vh;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: flex;
            flex-direction: column;
            color: #fff;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
            animation: storySlideUp 0.3s ease-out;
        }

        .story-views-header {
            padding: 16px 20px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .story-views-header h3 {
            font-size: 15px;
            margin: 0;
            font-weight: 600;
        }

        .story-views-header button {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }

        .story-views-list {
            overflow-y: auto;
            padding: 10px 20px;
        }

        .story-view-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
        }

        .story-view-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .story-view-name {
            font-size: 14px;
            font-weight: 500;
            color: #f1f1f1;
        }

        @keyframes storySlideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        /* --- MINI PLAYER FIXO --- */
        .mini-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #181818;
            border-top: 1px solid #282828;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 90;
        }

        .mini-player-info {
            display: flex;
            flex-direction: column;
        }

        .mini-player-info strong {
            font-size: 14px;
            color: #fff;
        }

        .mini-player-info span {
            font-size: 12px;
            color: #b3b3b3;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">UnderFy</div>
        <div id="userProfileIndicator"></div>
    </header>

    <div class="main-container">
        <!-- Barra de Stories -->
        <div class="stories-bar" id="storiesBarContainer">
            <!-- Os stories carregam dinamicamente aqui -->
        </div>

        <div class="content-feed">
            <h2>Feed Principal</h2>
            <p>Bem-vindo ao UnderFy. Seus conteúdos e músicas aparecem aqui.</p>
        </div>
    </div>

    <!-- Modal de Visualização de Story -->
    <div id="storyModal">
        <button class="close-story" onclick="fecharModalStory()">&times;</button>
        <div class="story-viewer-box" id="storyViewerContent">
            <!-- Conteúdo da mídia injetado via JS -->

            <!-- Rodapé exclusivo para o dono do story (Visualizações + Excluir pequeno) -->
            <div class="story-owner-footer" id="storyOwnerFooter" style="display: none;">
                <button class="story-views-trigger" onclick="abrirListaVisualizadores()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <span id="storyViewsCount">0 visualizações</span>
                </button>
                <button class="story-delete-btn-sm" onclick="excluirStoryAtual()" title="Excluir story">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Estilo Instagram para Lista de Visualizadores -->
    <div id="storyViewsModal" class="story-views-modal" style="display: none;">
        <div class="story-views-content">
            <div class="story-views-header">
                <h3>Visualizações</h3>
                <button onclick="fecharListaVisualizadores()">&times;</button>
            </div>
            <div class="story-views-list" id="storyViewsListContainer">
                <!-- Lista de perfis injetada via JS -->
            </div>
        </div>
    </div>

    <!-- Mini Player Fixo -->
    <div class="mini-player">
        <div class="mini-player-info">
            <strong id="miniMusica">Nenhuma música tocando</strong>
            <span id="miniArtista">Selecione uma faixa</span>
        </div>
    </div>

    <script>
        // --- INICIALIZAÇÃO DO SUPABASE ---
        const SUPABASE_URL = 'SUA_URL_SUPABASE'; // Insira sua URL aqui se necessário
        const SUPABASE_KEY = 'SUA_CHAVE_SUPABASE'; // Insira sua Key aqui se necessário
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentStoryId = null;

        // --- FUNÇÃO PARA ABRIR E CONTROLAR O STORY ---
        async function abrirStory(story) {
            currentStoryId = story.id;
            const modal = document.getElementById('storyModal');
            const viewerContent = document.getElementById('storyViewerContent');
            
            // Renderiza imagem ou vídeo
            if (story.media_type === 'video') {
                viewerContent.innerHTML = `<video src="${story.media_url}" autoplay controls></video>`;
            } else {
                viewerContent.innerHTML = `<img src="${story.media_url}" alt="Story">`;
            }

            modal.style.display = 'flex';
            
            // Verifica se o story é do próprio usuário logado para exibir o rodapé de controle
            await verificarEExibirControlesStory(story);

            // Registra visualização (caso não seja o próprio dono)
            registrarVisualizacao(story.id);
        }

        function fecharModalStory() {
            document.getElementById('storyModal').style.display = 'none';
            fecharListaVisualizadores();
        }

        // --- VERIFICAÇÃO DE PROPRIEDADE E VIEWS ---
        async function verificarEExibirControlesStory(story) {
            const footer = document.getElementById('storyOwnerFooter');
            if (!footer) return;

            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) {
                    footer.style.display = 'none';
                    return;
                }

                // Confere se o story pertence ao usuário atual (suporta artist_id ou user_id)
                const isOwner = (story.artist_id === user.id) || (story.user_id === user.id);

                if (isOwner) {
                    footer.style.display = 'flex';
                    carregarContadorViewsStory(story.id);
                } else {
                    footer.style.display = 'none';
                }
            } catch (err) {
                console.error("Erro ao verificar dono do story:", err);
                footer.style.display = 'none';
            }
        }

        async function carregarContadorViewsStory(storyId) {
            try {
                const { count, error } = await supabase
                    .from('story_views')
                    .select('*', { count: 'exact', head: true })
                    .eq('story_id', storyId);

                if (!error) {
                    const counterEl = document.getElementById('storyViewsCount');
                    if (counterEl) counterEl.innerText = `${count || 0} visualizações`;
                }
            } catch (e) {
                console.error("Erro ao buscar contagem de views:", e);
            }
        }

        // --- REGISTRAR VISUALIZAÇÃO NO BANCO ---
        async function registrarVisualizacao(storyId) {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) return;

                // Insere view (pode ignorar duplicadas se houver constraint UNIQUE no Supabase)
                await supabase.from('story_views').insert([
                    { story_id: storyId, user_id: user.id }
                ]);
            } catch (e) {
                // Silencia erro caso já tenha visualizado antes
            }
        }

        // --- ABRIR LISTA DE QUEM VISUALIZOU (ESTILO INSTAGRAM) ---
        async function abrirListaVisualizadores() {
            const modal = document.getElementById('storyViewsModal');
            const container = document.getElementById('storyViewsListContainer');
            if (!modal || !container) return;

            container.innerHTML = '<p style="text-align:center; color:#888; padding:20px;">Carregando...</p>';
            modal.style.display = 'flex';

            try {
                const { data, error } = await supabase
                    .from('story_views')
                    .select(`
                        *,
                        profiles:user_id (name, avatar_url)
                    `)
                    .eq('story_id', currentStoryId);

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#888; padding:20px;">Nenhuma visualização ainda.</p>';
                    return;
                }

                container.innerHTML = '';
                data.forEach(view => {
                    const perfil = view.profiles || { name: 'Usuário', avatar_url: 'https://via.placeholder.com/40' };
                    const item = document.createElement('div');
                    item.className = 'story-view-item';
                    item.innerHTML = `
                        <img src="${perfil.avatar_url || 'https://via.placeholder.com/40'}" class="story-view-avatar" alt="Avatar">
                        <span class="story-view-name">${perfil.name || 'Usuário'}</span>
                    `;
                    container.appendChild(item);
                });

            } catch (e) {
                console.error("Erro ao buscar lista de visualizadores:", e);
                container.innerHTML = '<p style="text-align:center; color:#ff4d4d; padding:20px;">Erro ao carregar visualizações.</p>';
            }
        }

        function fecharListaVisualizadores() {
            const modal = document.getElementById('storyViewsModal');
            if (modal) modal.style.display = 'none';
        }

        // --- EXCLUIR O PRÓPRIO STORY ---
        async function excluirStoryAtual() {
            if (!currentStoryId) return;
            
            if (!confirm("Tem certeza que deseja excluir este story?")) return;

            try {
                const { error } = await supabase
                    .from('stories')
                    .delete()
                    .eq('id', currentStoryId);

                if (error) throw error;

                fecharListaVisualizadores();
                fecharModalStory();
                
                alert("Story excluído com sucesso!");
                location.reload(); 
            } catch (e) {
                console.error("Erro ao excluir story:", e);
                alert("Não foi possível excluir o story.");
            }
        }
    </script>
</body>
</html>
