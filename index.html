<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UnderFy</title>
<!-- Ícone padrão do navegador -->
<link rel="icon" type="image/png" href="https://gnibzbnypirjrcaoibkx.supabase.co/storage/v1/object/public/capas-musicas/Picsart_26-08-25_13-30-56-332.jpg">
<!-- Ícone para quando o usuário adicionar à tela inicial do celular -->
<link rel="apple-touch-icon" href="https://gnibzbnypirjrcaoibkx.supabase.co/storage/v1/object/public/capas-musicas/Picsart_26-08-25_13-30-56-332.jpg">
<!-- Manifesto do App -->
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
button,input{font:inherit;}
button{cursor:pointer;}
.app{min-height:100vh;padding-bottom:120px;}

header{
    position:sticky;top:0;z-index:20;
    background:rgba(0,0,0,.92);backdrop-filter:blur(15px);
    padding:20px 20px 10px 20px;display:flex;align-items:center;justify-content:space-between;
}
.logo{font-size:28px;font-weight:700;letter-spacing:-0.5px;display:flex;align-items:center;gap:8px;cursor:pointer;color:#fff;}
.header-btn{border:0;background:#1ed760;color:#000;font-weight:600;padding:8px 16px;border-radius:20px;font-size:13px;}
.header-btn.logout{background:#ff4444;color:#fff;}

main{width:100%;max-width:1200px;margin:auto;padding:0 20px;}

.section{margin-top:24px;}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.section-title h2{font-size:22px;font-weight:700;letter-spacing:-0.3px;color:#fff;}

/* STORIES BAR (IGUAL AO MOSTRADO NA IMAGEM) */
.stories-container {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    padding: 10px 0 20px 0;
    scrollbar-width: none;
}
.stories-container::-webkit-scrollbar { display: none; }

.story-item-wrapper {
    display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; position: relative; flex-shrink: 0;
}
.story-item-wrapper span {
    font-size: 12px; color: #d0d0d0; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500;
}

.story-ring-box {
    width: 74px; height: 74px; border-radius: 50%;
    padding: 2.5px; position: relative;
    display: flex; align-items: center; justify-content: center;
}
.story-ring-box.unseen {
    background: linear-gradient(45deg, #00f2fe, #4facfe, #00c6ff);
}
.story-ring-box.seen {
    background: #333333;
}
.story-avatar {
    width: 100%; height: 100%; border-radius: 50%;
    object-fit: cover; border: 3px solid #000;
}

/* CARROSSEL E GRID DE DESTAQUES (NOVO VISUAL DE CARDS) */
.carousel{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
    padding-bottom:10px;
}
@media (max-width: 480px) {
    .carousel {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
    }
}

.card{
    background:#161618;
    padding:12px;
    border-radius:18px;
    position:relative;
    transition:.2s ease;
    cursor:pointer;
    display:flex;
    flex-direction:column;
}
.card:hover{background:#222225;transform:translateY(-2px);}
.cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#252525;}
.card h3{margin-top:10px;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;}
.card p{color:#8e8e93;margin-top:3px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;}
.card-plays{color:#1ed760;font-size:11px;margin-top:4px;font-weight:600;}

.play{
    margin-top:10px;width:100%;border:0;background:#1ed760;color:#000;padding:8px;
    border-radius:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:12px;
}
.btn-delete{
    margin-top:6px;width:100%;border:0;background:rgba(255,68,68,0.15);color:#ff4444;padding:6px;
    border-radius:10px;font-weight:600;font-size:11px;display:flex;align-items:center;justify-content:center;gap:4px;
}
.btn-delete:hover{background:rgba(255,68,68,0.3);}

.empty{color:#666;text-align:center;padding:30px 10px;width:100%;grid-column: 1 / -1;font-size:14px;}

.search-box{margin-top:15px;}
input{width:100%;padding:12px 16px;background:#161618;border:1px solid #26262a;color:#fff;border-radius:14px;outline:none;font-size:14px;}
input:focus{border-color:#1ed760;}
.input-padrao{width:100%;padding:12px 16px;margin:0 0 12px;background:#161618;border:1px solid #26262a;color:#fff;border-radius:14px;outline:none;font-size:14px;}
.input-padrao:focus{border-color:#1ed760;}

/* MODAL DE STORIES INSTAGRAM */
.story-viewer-modal {
    display: none; position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.96); align-items: center; justify-content: center;
}
.story-card-box {
    width: 100%; max-width: 420px; height: 90vh; max-height: 780px;
    background: #000; border-radius: 20px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}
.story-progress-bars {
    position: absolute; top: 12px; left: 12px; right: 12px; z-index: 20;
    display: flex; gap: 4px;
}
.story-prog-track {
    flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden;
}
.story-prog-fill { width: 0%; height: 100%; background: #fff; }
.story-header-info {
    position: absolute; top: 22px; left: 15px; right: 15px; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
}
.story-user-meta { display: flex; align-items: center; gap: 10px; }
.story-user-meta img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,0.2); }
.story-user-meta span { font-size: 14px; font-weight: bold; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
.story-media-content { width: 100%; height: 100%; object-fit: cover; background: #000; }
.story-close-btn { background: none; border: 0; color: #fff; font-size: 26px; font-weight: bold; cursor: pointer; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

.story-delete-btn {
    position: absolute; top: 28px; right: 55px; z-index: 20;
    background: rgba(0,0,0,0.4); color: #ff4444; border: 1px solid rgba(255,68,68,0.4); 
    width: 32px; height: 32px; border-radius: 50%; font-size: 14px; cursor: pointer; 
    display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
    transition: 0.2s;
}
.story-delete-btn:hover { background: rgba(255,68,68,0.2); }

.story-footer-actions {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
    padding: 15px 20px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    display: flex; align-items: center; justify-content: space-between;
}
.story-viewers-pill {
    background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
    padding: 8px 14px; border-radius: 20px; display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: #fff; cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
}
.story-viewers-pill img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }

.viewers-modal {
    display: none; position: fixed; inset: 0; z-index: 350;
    background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); align-items: flex-end; justify-content: center;
}
.viewers-card {
    width: 100%; max-width: 420px; background: #161616; border-top-left-radius: 20px; border-top-right-radius: 20px;
    padding: 20px; max-height: 60vh; overflow-y: auto; border-top: 1px solid #282828;
}
.viewers-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
.viewers-header h3 { font-size: 16px; font-weight: bold; }
.viewer-item { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.viewer-item img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
.viewer-item span { font-size: 14px; font-weight: bold; color: #ddd; }

.camera-modal {
    display: none; position: fixed; inset: 0; z-index: 350;
    background: #000; align-items: center; justify-content: center; flex-direction: column; overflow: hidden;
}
.camera-preview {
    width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; z-index: 1;
}
.camera-controls {
    position: absolute; bottom: 40px; z-index: 10; display: flex; align-items: center; gap: 40px; width: 100%; justify-content: center;
}
.capture-btn {
    width: 75px; height: 75px; border-radius: 50%; background: #fff; border: 4px solid rgba(255,255,255,0.5);
    cursor: pointer; transition: transform 0.1s;
}
.capture-btn:active { transform: scale(0.9); }
.capture-btn.recording { background: #ff4444; animation: pulse 1.2s infinite; }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
.switch-cam-btn {
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); color: #fff;
    width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer;
}

.preview-action-modal {
    display: none; position: fixed; inset: 0; z-index: 360;
    background: #000; align-items: center; justify-content: center; flex-direction: column;
}
.preview-media-element { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; z-index: 1; }
.preview-action-buttons {
    position: absolute; bottom: 40px; z-index: 10; display: flex; gap: 20px; width: 90%; max-width: 400px; justify-content: center;
}
.preview-btn {
    flex: 1; padding: 14px; border-radius: 25px; border: 0; font-weight: bold; font-size: 15px; cursor: pointer;
}
.preview-btn.publish { background: #1ed760; color: #000; }
.preview-btn.discard { background: rgba(255,68,68,0.85); color: #fff; }

/* MINI PLAYER FIXO */
.mini-player{
    position:fixed;bottom:65px;left:0;right:0;z-index:30;
    background:#161618;border-top:1px solid #222225;
    padding:10px 5%;display:none;align-items:center;gap:15px;cursor:pointer;
}
.mini-player img{width:45px;height:45px;object-fit:cover;border-radius:8px;}
.mini-player-info{flex:1;min-width:0;}
.mini-player-info strong, .mini-player-info span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.mini-player-info span{color:#8e8e93;font-size:13px;margin-top:3px;}
.mini-player button{background:none;border:0;color:#1ed760;font-size:20px;margin-right:10px;}

/* PLAYER MODAL */
.player-modal{
    display:none;position:fixed;inset:0;z-index:150;
    background:rgba(0,0,0,0.92);backdrop-filter:blur(20px);
    align-items:center;justify-content:center;padding:20px;
}
.player-card{
    background:#161618;border:1px solid #26262a;width:100%;max-width:420px;
    border-radius:32px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;
    box-shadow:0 25px 50px rgba(0,0,0,0.8);
}
.player-header{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.player-header button{background:none;border:0;color:#fff;font-size:16px;font-weight:bold;}
.player-header span{font-size:14px;font-weight:700;letter-spacing:1px;color:#8e8e93;}

.player-cover-container{width:100%;aspect-ratio:1;border-radius:20px;overflow:hidden;margin-bottom:22px;}
.player-cover-container img{width:100%;height:100%;object-fit:cover;}
.player-song-info{text-align:center;margin-bottom:22px;width:100%;}
.player-song-info h2{font-size:22px;font-weight:700;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-song-info p{color:#8e8e93;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.progress-container{width:100%;margin-bottom:20px;}
.progress-bar-bg{width:100%;height:5px;background:#2a2a2e;border-radius:3px;cursor:pointer;position:relative;}
.progress-bar-fill{height:100%;background:#1ed760;width:0%;border-radius:3px;}
.time-stamps{display:flex;justify-content:space-between;font-size:12px;color:#8e8e93;margin-top:8px;}

.player-actions{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:10px;width:100%;}
.action-btn{background:none;border:0;color:#8e8e93;font-size:18px;}
.action-btn.active{color:#1ed760;}
.main-play-btn{
    background:#1ed760;color:#000;border:0;width:60px;height:60px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:22px;
}

/* NAV INFERIOR (IGUAL AO MOSTRADO NA IMAGEM DA TELA) */
nav{
    position:fixed;bottom:0;left:0;right:0;height:65px;
    background:#0a0a0a;border-top:1px solid #1c1c1e;z-index:40;
    display:flex;justify-space-around:align-items:center;padding:0 10px;
}
nav button{
    border:0;background:none;color:#8e8e93;font-size:11px;text-align:center;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:500;
}
nav button.active, nav button:hover{color:#1ed760;}
nav button svg{width:22px;height:22px;fill:currentColor;}

/* MODAL / AUTENTICAÇÃO */
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.8);align-items:center;justify-content:center;padding:20px;}
.modal-content{background:#161618;border:1px solid #26262a;width:100%;max-width:450px;border-radius:24px;padding:25px;position:relative;max-height:90vh;overflow-y:auto;}
.close{position:absolute;top:15px;right:15px;border:0;background:#26262a;color:#fff;width:30px;height:30px;border-radius:50%;font-weight:bold;}
.form-btn{width:100%;padding:13px;background:#1ed760;color:#000;border:0;border-radius:25px;font-weight:700;margin-top:10px;}
.toggle-auth{text-align:center;margin-top:15px;font-size:14px;color:#8e8e93;cursor:pointer;}
.toggle-auth span{color:#1ed760;font-weight:bold;}
.file-upload-label{display:block;background:#202024;border:1px dashed #3a3a40;padding:12px;border-radius:12px;text-align:center;cursor:pointer;color:#8e8e93;margin-bottom:13px;font-size:14px;}
.file-upload-label:hover{border-color:#1ed760;color:#fff;}

.chip-group{
    display:flex;flex-wrap:wrap;gap:8px;max-height:130px;overflow-y:auto;
    background:#111113;border:1px solid #26262a;border-radius:12px;padding:10px;margin-bottom:13px;
    scrollbar-width:thin;scrollbar-color:#333 transparent;
}
.chip-item{
    background:#202024;color:#8e8e93;border:1px solid #2e2e34;padding:6px 12px;
    border-radius:15px;font-size:13px;cursor:pointer;transition:.2s;user-select:none;
}
.chip-item:hover{border-color:#1ed760;color:#fff;}
.chip-item.selected{background:#1ed760;color:#000;border-color:#1ed760;font-weight:bold;}
</style>
</head>
<body>

<div class="app">
    <header>
        <div class="logo" onclick="irInicio()">UnderFy</div>
        <div id="areaHeaderBtn">
            <button class="header-btn" onclick="tratarAcaoArtista()">Área do Artista</button>
        </div>
    </header>

    <main id="conteudoDinamico">
        <!-- Conteúdo Injetado Dinamicamente -->
    </main>
</div>

<!-- MINI PLAYER FIXO -->
<div class="mini-player" id="miniPlayer" onclick="abrirInterfacePlayer()">
    <img id="miniCapa" src="">
    <div class="mini-player-info">
        <strong id="miniMusica">Música</strong>
        <span id="miniArtista">Artista</span>
    </div>
    <button id="miniPlayBtn" onclick="event.stopPropagation(); pausarRetomar();">&#10074;&#10074;</button>
</div>

<!-- PLAYER FULLSCREEN -->
<div class="player-modal" id="playerModal">
    <div class="player-card">
        <div class="player-header">
            <button onclick="fecharInterfacePlayer()">&#709;</button>
            <span>SESSÃO</span>
            <button onclick="console.log('Player UnderFy')">&#8230;</button>
        </div>

        <div class="player-cover-container">
            <img id="modalCapa" src="" alt="Capa">
        </div>

        <div class="player-song-info">
            <h2 id="modalMusica">Nome</h2>
            <p id="modalArtista">Artista</p>
        </div>

        <div class="progress-container">
            <div class="progress-bar-bg" id="progressBarBg" onclick="mudarProgresso(event)">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="time-stamps">
                <span id="currentTime">0:00</span>
                <span id="durationTime">0:00</span>
            </div>
        </div>

        <div class="player-actions">
            <button class="action-btn" id="btnShuffle" onclick="toggleShuffle()" title="Shuffle">&#8644;</button>
            <button class="action-btn" onclick="tocarAnterior()" title="Anterior">&#9664;&#9664;</button>
            <button class="main-play-btn" id="btnPlayPauseModal" onclick="pausarRetomar()" title="Play/Pause">&#10074;&#10074;</button>
            <button class="action-btn" onclick="tocarProxima()" title="Próximo">&#9654;&#9654;</button>
            <button class="action-btn" id="btnRepeat" onclick="toggleRepeat()" title="Repeat">&#8635;</button>
        </div>
    </div>
</div>

<!-- MODAL VISUALIZADOR DE STORIES -->
<div class="story-viewer-modal" id="storyViewerModal">
    <div class="story-card-box">
        <div class="story-progress-bars" id="storyProgressBars"></div>
        <div class="story-header-info">
            <div class="story-user-meta">
                <img id="storyUserAvatar" src="">
                <span id="storyUserName">Artista</span>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
                <button class="story-delete-btn" id="storyDeleteBtn" onclick="apagarStoryAtual()" title="Apagar Story">&#128465;</button>
                <button class="story-close-btn" onclick="fecharStoryViewer()">&times;</button>
            </div>
        </div>
        <div style="flex:1; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;" id="storyMediaContainer"></div>

        <div class="story-footer-actions" id="storyFooterActions" style="display:none;">
            <div class="story-viewers-pill" onclick="abrirListaVisualizadores()">
                <img src="https://via.placeholder.com/500" id="viewerPillIcon">
                <span id="viewerCountText">0 visualizações</span>
            </div>
        </div>
    </div>
</div>

<!-- MODAL DA LISTA DE VISUALIZADORES -->
<div class="viewers-modal" id="viewersModal" onclick="fecharListaVisualizadores(event)">
    <div class="viewers-card" onclick="event.stopPropagation()">
        <div class="viewers-header">
            <h3>Visualizadores</h3>
            <button class="story-close-btn" onclick="document.getElementById('viewersModal').style.display='none'">&times;</button>
        </div>
        <div id="listaVisualizadoresConteudo">
            <div class="empty">Nenhuma visualização ainda.</div>
        </div>
    </div>
</div>

<!-- MODAL CÂMERA EM TEMPO REAL -->
<div class="camera-modal" id="cameraModal">
    <video id="cameraPreview" class="camera-preview" autoplay playsinline muted></video>
    <div style="position:absolute; top:20px; right:20px; z-index:10;">
        <button class="story-close-btn" onclick="fecharCameraModal()">&times;</button>
    </div>
    <div class="camera-controls">
        <button class="switch-cam-btn" onclick="alternarCamera()" title="Trocar Câmera">&#8634;</button>
        <button class="capture-btn" id="captureBtn" ontouchstart="iniciarGravacaoStory()" ontouchend="pararGravacaoStory()" onmousedown="iniciarGravacaoStory()" onmouseup="pararGravacaoStory()" title="Toque para foto, segure para vídeo"></button>
        <div style="width: 45px;"></div>
    </div>
</div>

<!-- MODAL PREVIEW MÍDIA CAPTURADA -->
<div class="preview-action-modal" id="previewActionModal">
    <div id="previewContainerWrapper" style="width:100%; height:100%; position:relative; display:flex; align-items:center; justify-content:center;"></div>
    <div class="preview-action-buttons">
        <button class="preview-btn discard" onclick="descartarMidiaPreview()">Excluir</button>
        <button class="preview-btn publish" onclick="publicarMidiaPreview()">Publicar</button>
    </div>
</div>

<audio id="audio" style="display:none;"></audio>

<!-- NAV INFERIOR ESTILIZADA -->
<nav>
    <button class="active" onclick="irInicio()">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Início
    </button>
    <button onclick="mostrarMusicas()">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        Guias
    </button>
    <button onclick="mostrarArtistas()">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        Artistas
    </button>
    <button onclick="tratarAcaoArtista()">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Publicar
    </button>
</nav>

<!-- MODAL AUTENTICAÇÃO -->
<div class="modal" id="modalAuth">
    <div class="modal-content">
        <button class="close" onclick="fecharModal('modalAuth')">&#10005;</button>
        <h2 id="tituloAuth">Entrar como Artista</h2>
        <input type="email" id="emailArtista" placeholder="E-mail">
        <input type="password" id="senhaArtista" placeholder="Senha">
        <button class="form-btn" id="botaoAcaoAuth" onclick="autenticarArtista()">Entrar</button>
        <div class="toggle-auth" onclick="alternarModoAuth()">
            Não tem uma conta? <span id="textoAlternar">Cadastre-se grátis</span>
        </div>
    </div>

async function abrirCameraModal() {

}

async function iniciarStreamCamera() {
    if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
    }
    try {
        const constraints = {
            video: { facingMode: usarCameraFrontal ? "user" : "environment" },
            audio: true
        };
        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
        const videoElement = document.getElementById("cameraPreview");
        videoElement.srcObject = mediaStream;
    } catch (err) {
        console.error("Erro ao acessar a câmera:", err);
        alert("Não foi possível acessar a câmera do dispositivo.");
        fecharCameraModal();
    }
}

async function alternarCamera() {
    usarCameraFrontal = !usarCameraFrontal;
    await iniciarStreamCamera();
}

function fecharCameraModal() {
    const modal = document.getElementById("cameraModal");
    modal.style.display = "none";
    if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
    }
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
    }
}

function iniciarGravacaoStory() {
    recordedChunks = [];
    isRecordingVideo = false;
    const captureBtn = document.getElementById("captureBtn");

    pressTimer = setTimeout(() => {
        isRecordingVideo = true;
        captureBtn.classList.add("recording");
        try {
            mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm;codecs=vp8,opus' });
        } catch(e) {
            try { mediaRecorder = new MediaRecorder(mediaStream); } catch(err) { console.error(err); }
        }

        if (mediaRecorder) {
            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) recordedChunks.push(event.data);
            };
            mediaRecorder.onstop = () => prepararPreviewMidia('video');
            mediaRecorder.start();
        }
    }, 400); 
}

function pararGravacaoStory() {
    clearTimeout(pressTimer);
    const captureBtn = document.getElementById("captureBtn");
    captureBtn.classList.remove("recording");

    if (isRecordingVideo) {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
        }
    } else {
        tirarFotoStory();
    }
}

async function tirarFotoStory() {
    const videoElement = document.getElementById("cameraPreview");
    const canvas = document.createElement("canvas");
    canvas.width = videoElement.videoWidth || 720;
    canvas.height = videoElement.videoHeight || 1280;
    const ctx = canvas.getContext("2d");
    
    if (usarCameraFrontal) {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
    }
    
    ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

    canvas.toBlob((blob) => {
        blobCapturadoPendente = blob;
        tipoMidiaPendente = 'image';
        abrirPreviewMidiaModal();
    }, 'image/jpeg', 0.85);
}

function prepararPreviewMidia(tipo) {
    if (tipo === 'video') {
        blobCapturadoPendente = new Blob(recordedChunks, { type: 'video/webm' });
        tipoMidiaPendente = 'video';
        abrirPreviewMidiaModal();
    }
}

function abrirPreviewMidiaModal() {
    fecharCameraModal();
    const previewModal = document.getElementById("previewActionModal");
    const wrapper = document.getElementById("previewContainerWrapper");
    const urlMidia = URL.createObjectURL(blobCapturadoPendente);

    if (tipoMidiaPendente === 'image') {
        wrapper.innerHTML = `<img class="preview-media-element" src="${urlMidia}">`;
    } else {
        wrapper.innerHTML = `<video class="preview-media-element" src="${urlMidia}" autoplay playsinline controls></video>`;
    }

    previewModal.style.display = "flex";
}

function descartarMidiaPreview() {
    document.getElementById("previewActionModal").style.display = "none";
    blobCapturadoPendente = null;
    tipoMidiaPendente = null;
    abrirCameraModal();
}

async function publicarMidiaPreview() {
    if (!blobCapturadoPendente || !tipoMidiaPendente) return;

    const previewModal = document.getElementById("previewActionModal");
    const btnPublicar = previewModal.querySelector('.preview-btn.publish');
    btnPublicar.disabled = true;
    btnPublicar.textContent = "Publicando...";

    const artistaId = sessaoAtual.user.id;
    const extensao = tipoMidiaPendente === 'image' ? 'jpg' : 'webm';
    const nomeArquivo = `story_${Date.now()}_${Math.random().toString(36).substring(7)}.${extensao}`;

    try {
        await supabaseClient.storage.from('capas-musicas').upload(nomeArquivo, blobCapturadoPendente);
        const { data: publicUrlData } = supabaseClient.storage.from('capas-musicas').getPublicUrl(nomeArquivo);

        await supabaseClient.from('stories').insert([{
            artist_id: artistaId,
            media_url: publicUrlData.publicUrl,
            media_type: tipoMidiaPendente
        }]);

        previewModal.style.display = "none";
        btnPublicar.disabled = false;
        btnPublicar.textContent = "Publicar";
        blobCapturadoPendente = null;
        tipoMidiaPendente = null;

        await carregarDadosGlobais();
        renderizarStoriesBar();
    } catch (err) {
        console.error("Erro ao publicar story:", err);
        btnPublicar.disabled = false;
        btnPublicar.textContent = "Publicar";
    }
}

async function registrarVisualizacaoStory(storyId) {
    if (!sessaoAtual) return;
    const viewerId = sessaoAtual.user.id;
    const story = storiesCache.find(s => s.id === storyId);
    if (!story || story.artist_id === viewerId) return;

    try {
        const jaViu = visualizacoesCache.some(v => v.story_id === storyId && v.viewer_id === viewerId);
        if (!jaViu) {

    currentStoriesList = storiesCache.filter(s => s.artist_id === artistaId);
    if (currentStoriesList.length === 0) return;
    currentStoryIndex = 0;
    
    document.getElementById("storyViewerModal").style.display = "flex";

}

function renderizarStoryAtual() {
    if (currentStoryIndex >= currentStoriesList.length || currentStoryIndex < 0) {
        fecharStoryViewer();
        return;
    }

    const story = currentStoriesList[currentStoryIndex];
    
    if (story && story.id) {
        storiesVistos[story.id] = true;
        localStorage.setItem('underfy_stories_vistos', JSON.stringify(storiesVistos));
        registrarVisualizacaoStory(story.id);
    }

    const artista = artistasCache.find(a => a.id === story.artist_id) || { nome: 'Artista', foto_url: '' };

    document.getElementById("storyUserName").textContent = artista.nome;
    document.getElementById("storyUserAvatar").src = artista.foto_url || 'https://via.placeholder.com/500';

    const usuarioLogadoId = sessaoAtual ? sessaoAtual.user.id : null;
    const btnDelete = document.getElementById("storyDeleteBtn");
    const footerActions = document.getElementById("storyFooterActions");

    if (usuarioLogadoId && story.artist_id === usuarioLogadoId) {
        btnDelete.style.display = "flex";
        footerActions.style.display = "flex";
        
        const viewsDoStory = visualizacoesCache.filter(v => v.story_id === story.id);
        const qtdViews = viewsDoStory.length;
        document.getElementById("viewerCountText").textContent = `${qtdViews} ${qtdViews === 1 ? 'visualização' : 'visualizações'}`;
        
        if (qtdViews > 0) {
            const ultimoViewerId = viewsDoStory[viewsDoStory.length - 1].viewer_id;
            const objViewer = artistasCache.find(a => a.id === ultimoViewerId);
            if (objViewer && objViewer.foto_url) {
                document.getElementById("viewerPillIcon").src = objViewer.foto_url;
            } else {
                document.getElementById("viewerPillIcon").src = "https://via.placeholder.com/500";
            }
        } else {
            document.getElementById("viewerPillIcon").src = "https://via.placeholder.com/500";
        }
    } else {
        btnDelete.style.display = "none";
        footerActions.style.display = "none";
    }

    const barsContainer = document.getElementById("storyProgressBars");
    barsContainer.innerHTML = currentStoriesList.map((_, i) => `
        <div class="story-prog-track"><div class="story-prog-fill" id="progFill_${i}" style="width: ${i < currentStoryIndex ? '100%' : '0%'}"></div></div>
    `).join('');

    const mediaContainer = document.getElementById("storyMediaContainer");
    if (story.media_type === 'video') {
        mediaContainer.innerHTML = `<video class="story-media-content" src="${story.media_url}" autoplay playsinline onended="proximoStory()"></video>`;
    } else {
        mediaContainer.innerHTML = `<img class="story-media-content" src="${story.media_url}">`;
        
        clearTimeout(storyTimer);
        const fillElement = document.getElementById(`progFill_${currentStoryIndex}`);
        if(fillElement) {
            fillElement.style.transition = "width 5s linear";
            setTimeout(() => fillElement.style.width = "100%", 50);
        }
        storyTimer = setTimeout(() => {
            currentStoryIndex++;
            renderizarStoryAtual();
        }, 5000);
    }
}

    } else {
        containerMusicasProj.innerHTML = musicasDoProjeto.map(m => {
            const indexGlobal = musicas.findIndex(x => x.id === m.id);
            return `
                <div style="background:#161618; padding:12px; border-radius:14px; display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer;" onclick="tocarMusicaPorIndex(${indexGlobal})">
                    <div style="display:flex; align-items:center; gap:12px; min-width:0;">
                        <img src="${m.capa}" style="width:48px; height:48px; object-fit:cover; border-radius:10px;">
                        <div style="min-width:0;">
                            <strong style="display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:15px;">${m.nome}</strong>
                            <span style="color:#8e8e93; font-size:13px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${m.artistaFormatado}</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }
}

async function abrirArtista(nomeArtistaEncoded) {
    window.scrollTo({ top: 0, behavior: "smooth" });
    const nomeArtista = decodeURIComponent(nomeArtistaEncoded);
    const artista = artistasCache.find(a => a.nome === nomeArtista);
    if(!artista) return;

    const { data: relsArt } = await supabaseClient.from('musica_artistas').select('*').eq('artista_id', artista.id);
    const idsMusicasArtista = relsArt ? relsArt.map(r => r.musica_id) : [];
    const musicasDoArtista = musicas.filter(m => idsMusicasArtista.includes(m.id));

    const containerMain = document.getElementById("conteudoDinamico");
    containerMain.innerHTML = `
        <div style="margin-top:15px; display:flex; gap:20px; align-items:center; flex-wrap:wrap;">
            <img src="${artista.foto_url || 'https://via.placeholder.com/500'}" style="width:140px; height:140px; object-fit:cover; border-radius:50%;">
            <div>
                <small style="color:#1ed760; font-weight:bold;">ARTISTA</small>
                <h1 style="font-size:32px; margin:4px 0;">${artista.nome}</h1>
                <p style="color:#8e8e93; font-size:14px;">${musicasDoArtista.length} lançamento(s)</p>
            </div>
        </div>
        <div class="section" style="margin-top:30px;">
            <div class="section-title"><h2>Lançamentos</h2></div>
            <div id="listaMusicasArtista" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>
        <button class="header-btn" style="margin-top:20px;" onclick="irInicio()">&#8592; Voltar</button>

    const containerMusicasArt = document.getElementById("listaMusicasArtista");
    if(musicasDoArtista.length === 0) {
        containerMusicasArt.innerHTML = `<div class="empty">Nenhuma música cadastrada por este artista.</div>`;
    } else {
        containerMusicasArt.innerHTML = musicasDoArtista.map(m => {
            const indexGlobal = musicas.findIndex(x => x.id === m.id);
            return `
                <div style="background:#161618; padding:12px; border-radius:14px; display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer;" onclick="tocarMusicaPorIndex(${indexGlobal})">
                    <div style="display:flex; align-items:center; gap:12px; min-width:0;">
                        <img src="${m.capa}" style="width:48px; height:48px; object-fit:cover; border-radius:10px;">
                        <div style="min-width:0;">
                            <strong style="display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:15px;">${m.nome}</strong>
                            <span style="color:#8e8e93; font-size:13px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${m.artistaFormatado}</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }
}

async function abrirPainelUpload() {

    const containerMain = document.getElementById("conteudoDinamico");

            <h2 style="margin-bottom:6px; font-size:20px;">Painel do Artista</h2>
            <p style="color:#8e8e93; font-size:13px; margin-bottom:20px;">Publicar novas faixas, álbuns e lançamentos.</p>
            
            <div style="display:flex; gap:10px; margin-bottom:20px; border-bottom:1px solid #26262a; padding-bottom:12px;">
                <button class="header-btn" id="abaGuiaBtn" onclick="mudarAbaPainel('guia')" style="background:#1ed760;">Nova Guia</button>
                <button class="header-btn" id="abaProjetoBtn" onclick="mudarAbaPainel('projeto')" style="background:#202024; color:#fff;">Novo Projeto</button>
            </div>

            <div id="formGuiaContainer">
                <input type="text" id="upNomeGuia" class="input-padrao" placeholder="Nome da Faixa / Guia">

                <div id="checkboxArtistasContainer" class="chip-group">Carregando artistas...</div>

                <label style="font-size:12px; color:#8e8e93; display:block; margin-bottom:6px;">Projeto / Álbum (Opcional)</label>
                <div id="checkboxProjetosContainer" class="chip-group">Carregando projetos...</div>

                <label class="file-upload-label" for="upCapaArquivo">
                    <span id="labelCapaTexto">Capa da Faixa (Imagem)</span>
                </label>
                <input type="file" id="upCapaArquivo" accept="image/*" style="display:none;" onchange="document.getElementById('labelCapaTexto').textContent = this.files[0].name">

                <label class="file-upload-label" for="upAudioArquivo">
                    <span id="labelAudioTexto">Arquivo de Áudio (.mp3 / .wav)</span>

                <input type="file" id="upAudioArquivo" accept="audio/*" style="display:none;" onchange="document.getElementById('labelAudioTexto').textContent = this.files[0].name">

            <!-- FORMULÁRIO PROJETO -->

                <input type="text" id="upNomeProjeto" class="input-padrao" placeholder="Nome do Projeto / Álbum">
                
                <label class="file-upload-label" for="upCapaProjArquivo">
                    <span id="labelCapaProjTexto">Capa do Projeto (Imagem)</span>

                <input type="file" id="upCapaProjArquivo" accept="image/*" style="display:none;" onchange="document.getElementById('labelCapaProjTexto').textContent = this.files[0].name">

                <button class="form-btn" id="btnCriarProjeto" onclick="salvarNovoProjeto()">Criar Projeto</button>
            </div>
        </div>

function mudarAbaPainel(tipo) {
    const btnGuia = document.getElementById("abaGuiaBtn");
    const btnProj = document.getElementById("abaProjetoBtn");
    const formGuia = document.getElementById("formGuiaContainer");
    const formProj = document.getElementById("formProjetoContainer");

    if (tipo === 'guia') {
        btnGuia.style.background = "#1ed760"; btnGuia.style.color = "#000";
        btnProj.style.background = "#202024"; btnProj.style.color = "#fff";
        formGuia.style.display = "block";
        formProj.style.display = "none";
    } else {
        btnProj.style.background = "#1ed760"; btnProj.style.color = "#000";
        btnGuia.style.background = "#202024"; btnGuia.style.color = "#fff";
        formProj.style.display = "block";
        formGuia.style.display = "none";
    }
}

function carregarCheckboxesPainel() {
    const contArtistas = document.getElementById("checkboxArtistasContainer");
    const contProjetos = document.getElementById("checkboxProjetosContainer");
    const usuarioLogadoId = sessaoAtual ? sessaoAtual.user.id : null;

    if (contArtistas) {
        contArtistas.innerHTML = artistasCache.map(a => `
            <div class="chip-item ${a.id === usuarioLogadoId ? 'selected' : ''}" data-type="artista" data-id="${a.id}" onclick="toggleChip(this)">
                ${a.nome}
            </div>
        `).join('') || '<span style="color:#777;">Nenhum artista cadastrado</span>';
    }

    if (contProjetos) {
        contProjetos.innerHTML = projetosCache.map(p => `
            <div class="chip-item" data-type="projeto" data-id="${p.id}" onclick="toggleChip(this)">
                ${p.nome}
            </div>
        `).join('') || '<span style="color:#777;">Nenhum projeto cadastrado</span>';
    }
}

function toggleChip(element) {
    element.classList.toggle('selected');
}

async function salvarNovaGuia() {
    const nome = document.getElementById("upNomeGuia").value.trim();
    const fileCapa = document.getElementById("upCapaArquivo").files[0];
    const fileAudio = document.getElementById("upAudioArquivo").files[0];
    const btnPublicar = document.getElementById("btnPublicarGuia");

    const artistasSelecionados = Array.from(document.querySelectorAll('.chip-item[data-type="artista"].selected')).map(el => el.getAttribute('data-id'));
    const projetosSelecionados = Array.from(document.querySelectorAll('.chip-item[data-type="projeto"].selected')).map(el => el.getAttribute('data-id'));

    if (!nome || !fileCapa || !fileAudio || artistasSelecionados.length === 0) {
        alert("Preencha o nome, escolha pelo menos um artista, capa e arquivo de áudio.");
        return;
    }

    btnPublicar.disabled = true;
    btnPublicar.textContent = "Enviando arquivos...";

    try {
        const nomeCapaFile = `capa_${Date.now()}_${Math.random().toString(36).substring(7)}`;
        await supabaseClient.storage.from('capas-musicas').upload(nomeCapaFile, fileCapa);
        const { data: pubCapa } = supabaseClient.storage.from('capas-musicas').getPublicUrl(nomeCapaFile);

        const nomeAudioFile = `audio_${Date.now()}_${Math.random().toString(36).substring(7)}`;
        await supabaseClient.storage.from('capas-musicas').upload(nomeAudioFile, fileAudio);
        const { data: pubAudio } = supabaseClient.storage.from('capas-musicas').getPublicUrl(nomeAudioFile);

        const { data: resMusica, error: errMusica } = await supabaseClient.from('musicas').insert([
            { nome: nome, capa_url: pubCapa.publicUrl, audio_url: pubAudio.publicUrl, plays: 0 }
        ]).select().single();

        if (errMusica) { 
            console.error("Erro ao salvar música: " + errMusica.message); 
            btnPublicar.disabled = false;
            btnPublicar.textContent = "Publicar";
            return; 
        }
        const musicaId = resMusica.id;

        const relArtistasData = artistasSelecionados.map(artId => ({ musica_id: musicaId, artista_id: artId }));
        await supabaseClient.from('musica_artistas').insert(relArtistasData);

        if (projetosSelecionados.length > 0) {
            const relProjetosData = projetosSelecionados.map(projId => ({ projeto_id: projId, musica_id: musicaId }));
            await supabaseClient.from('projeto_musicas').insert(relProjetosData);
        }

        await carregarDadosGlobais();
        irInicio();
    } catch(err) {
        console.error("Erro no processo: " + err.message);
        btnPublicar.disabled = false;
        btnPublicar.textContent = "Publicar";
    }
}

async function salvarNovoProjeto() {
    const nome = document.getElementById("upNomeProjeto").value.trim();
    const fileCapa = document.getElementById("upCapaProjArquivo").files[0];
    const btnCriarProj = document.getElementById("btnCriarProjeto");

    if (!nome || !fileCapa) {
        alert("Preencha o nome do projeto e selecione uma capa.");
        return;
    }

    btnCriarProj.disabled = true;
    btnCriarProj.textContent = "Criando projeto...";

    try {
        const nomeCapaFile = `proj_${Date.now()}_${Math.random().toString(36).substring(7)}`;
        await supabaseClient.storage.from('capas-musicas').upload(nomeCapaFile, fileCapa);
        const { data: pubCapa } = supabaseClient.storage.from('capas-musicas').getPublicUrl(nomeCapaFile);

        const { error } = await supabaseClient.from('projetos').insert([
            { nome: nome, capa_url: pubCapa.publicUrl }
        ]);

        if (error) { 
            console.error("Erro ao criar projeto: " + error.message); 
            btnCriarProj.disabled = false;
            btnCriarProj.textContent = "Criar Projeto";
            return; 
        }

        await carregarDadosGlobais();
        irInicio();
    } catch(err) {
        console.error("Erro: " + err.message);
        btnCriarProj.disabled = false;
        btnCriarProj.textContent = "Criar Projeto";
    }
}

async function removerMusica(idMusica) {
    if (!confirm("Tem certeza que deseja apagar esta guia?")) return;

    try {
        await supabaseClient.from('musica_artistas').delete().eq('musica_id', idMusica);
        await supabaseClient.from('projeto_musicas').delete().eq('musica_id', idMusica);
        await supabaseClient.from('musicas').delete().eq('id', idMusica);

        await carregarDadosGlobais();
        irInicio();
    } catch (err) {
        console.error("Erro:", err);
    }
}

async function tocarMusicaPorIndex(index) {
    if (index < 0 || index >= musicas.length) return;
    musicaAtualIndex = index;
    const m = musicas[index];

    playContabilizadoNessaMusica = false;

    document.getElementById("miniPlayer").style.display = "flex";
    document.getElementById("miniMusica").textContent = m.nome;
    document.getElementById("miniArtista").textContent = m.artistaFormatado;
    document.getElementById("miniCapa").src = m.capa;

    document.getElementById("modalMusica").textContent = m.nome;
    document.getElementById("modalArtista").textContent = m.artistaFormatado;
    document.getElementById("modalCapa").src = m.capa;

    const audio = document.getElementById("audio");
    if (!m.audio) { console.warn("Áudio indisponível."); return; }
    audio.src = m.audio;
    audio.play();
    atualizarIconePlayPause(false);
}

async function verificarTempoPlay() {
    const audio = document.getElementById("audio");
    if (isNaN(audio.duration)) return;

    atualizarBarraProgresso();

    if (audio.currentTime >= 30 && !playContabilizadoNessaMusica && musicaAtualIndex !== -1) {
        playContabilizadoNessaMusica = true;
        const m = musicas[musicaAtualIndex];
        m.plays += 1;
        
        if(document.getElementById("listaMusicas")) {
            renderizarListasHome();
        }

        try { 
            await supabaseClient.from('musicas').update({ plays: m.plays }).eq('id', m.id); 
        } catch(e){}
    }
}

function abrirInterfacePlayer() { if (musicaAtualIndex !== -1) document.getElementById("playerModal").style.display = "flex"; }
function fecharInterfacePlayer() { document.getElementById("playerModal").style.display = "none"; }

function pausarRetomar() {
    const audio = document.getElementById("audio");
    if (audio.paused) { 
        audio.play(); 
        atualizarIconePlayPause(false);
    } else { 
        audio.pause(); 
        atualizarIconePlayPause(true);
    }
}

function atualizarIconePlayPause(pausado) {
    const modalBtn = document.getElementById("btnPlayPauseModal");
    const miniBtn = document.getElementById("miniPlayBtn");
    
    if (pausado) {
        if(modalBtn) modalBtn.innerHTML = "&#9654;";
        if(miniBtn) miniBtn.innerHTML = "&#9654;";
    } else {
        if(modalBtn) modalBtn.innerHTML = "&#10074;&#10074;";
        if(miniBtn) miniBtn.innerHTML = "&#10074;&#10074;";
    }
}

function atualizarBarraProgresso() {
    const audio = document.getElementById("audio");
    if (isNaN(audio.duration)) return;
    const fill = document.getElementById("progressBarFill");
    const cur = document.getElementById("currentTime");
    const dur = document.getElementById("durationTime");

    if (fill) fill.style.width = (audio.currentTime / audio.duration) * 100 + "%";
    if (cur) cur.textContent = formatarTempo(audio.currentTime);
    if (dur) dur.textContent = formatarTempo(audio.duration);
}

function mudarProgresso(event) {
    const audio = document.getElementById("audio");
    const bg = document.getElementById("progressBarBg");
    if (!audio.duration) return;
    audio.currentTime = (event.offsetX / bg.clientWidth) * audio.duration;
}

function formatarTempo(sec) {
    const min = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${min}:${s < 10 ? '0' : ''}${s}`;
}

function tocarProxima() {
    if (musicas.length === 0) return;
    let next = modoShuffle ? Math.floor(Math.random() * musicas.length) : (musicaAtualIndex + 1) % musicas.length;
    tocarMusicaPorIndex(next);
}

function tocarAnterior() {
    if (musicas.length === 0) return;
    let prev = (musicaAtualIndex - 1 + musicas.length) % musicas.length;
    tocarMusicaPorIndex(prev);
}

function lidarFimDaMusica() {
    if (modoRepeat) { document.getElementById("audio").currentTime = 0; document.getElementById("audio").play(); } 
    else { tocarProxima(); }
}

function toggleShuffle() { 
    modoShuffle = !modoShuffle; 
    const btn = document.getElementById("btnShuffle");
    if(btn) btn.classList.toggle("active", modoShuffle); 
}

function toggleRepeat() { 
    modoRepeat = !modoRepeat; 
    const btn = document.getElementById("btnRepeat");
    if(btn) btn.classList.toggle("active", modoRepeat); 
}

function abrirModalArtista() { document.getElementById("modalAuth").style.display = "flex"; }
function fecharModal(id) { document.getElementById(id).style.display = "none"; }

function alternarModoAuth() {
    modoCadastro = !modoCadastro;
    document.getElementById("tituloAuth").textContent = modoCadastro ? "Criar Conta de Artista" : "Entrar como Artista";
    document.getElementById("botaoAcaoAuth").textContent = modoCadastro ? "Cadastrar" : "Entrar";
    document.getElementById("textoAlternar").textContent = modoCadastro ? "Já tem uma conta? Entre aqui" : "Cadastre-se grátis";
}

function atualizarNomeArquivo(input) {
    if (input.files && input.files[0]) {
        document.getElementById("textoLabelFoto").textContent = input.files[0].name;
    }
}

async function autenticarArtista() {
    const email = document.getElementById("emailArtista").value.trim();
    const senha = document.getElementById("senhaArtista").value.trim();

    if(!email || !senha) return;

    if (modoCadastro) {
        const { data, error } = await supabaseClient.auth.signUp({ email, password: senha });
        if (error) { alert("Erro ao cadastrar: " + error.message); return; }

        if (data.user) {
            usuarioPendenteId = data.user.id;
            fecharModal('modalAuth');
            document.getElementById("modalPerfil").style.display = "flex";
        }
    } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
        if (error) { alert("E-mail ou senha incorretos."); return; }
        
        await verificarSessaoAtiva();
        fecharModal('modalAuth');
        abrirPainelUpload();
    }
}

async function salvarPerfilArtista() {
    const vulgo = document.getElementById("inputVulgo").value.trim();
    const fileInput = document.getElementById("inputFotoArquivo");

    if (!vulgo) return;

    let fotoUrl = 'https://via.placeholder.com/500';

    if (fileInput.files && fileInput.files[0]) {
        const arquivo = fileInput.files[0];
        const nomeArquivo = `perfil_${Date.now()}_${Math.random().toString(36).substring(7)}`;
        
        await supabaseClient.storage.from('capas-musicas').upload(nomeArquivo, arquivo);
        const { data: publicUrlData } = supabaseClient.storage.from('capas-musicas').getPublicUrl(nomeArquivo);

        fotoUrl = publicUrlData.publicUrl;
    }

    await supabaseClient.from('artistas').insert([{ id: usuarioPendenteId, nome: vulgo, foto_url: fotoUrl }]);

    fecharModal('modalPerfil');
    await verificarSessaoAtiva();
    await carregarDadosGlobais();
    abrirPainelUpload();
}
</script>
