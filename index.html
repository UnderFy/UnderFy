<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UnderFy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b0b0b;color:#fff;font-family:Arial,Helvetica,sans-serif;}
button,input{font:inherit;}
button{cursor:pointer;}
.app{min-height:100vh;padding-bottom:130px;}

header{
    position:sticky;top:0;z-index:20;
    background:rgba(11,11,11,.95);backdrop-filter:blur(15px);
    padding:18px 5%;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid #202020;
}
.logo{font-size:27px;font-weight:900;letter-spacing:-1px;display:flex;align-items:center;gap:12px;}
.logo .fy{color:#1ed760;}
.logo .by-uta{color:#ffffff;}
.header-btn{border:0;background:#1ed760;color:#000;font-weight:bold;padding:10px 16px;border-radius:25px;}

main{width:90%;max-width:1200px;margin:auto;}
.hero{
    margin-top:25px;min-height:260px;border-radius:25px;padding:35px;
    display:flex;flex-direction:column;justify-content:flex-end;
    background:linear-gradient(135deg,#171717,#063d20);overflow:hidden;
}
.hero small{color:#1ed760;font-weight:bold;margin-bottom:10px;letter-spacing:1px;}
.hero h1{font-size:42px;margin-bottom:10px;}
.hero p{color:#bbb;max-width:600px;}

.section{margin-top:35px;}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.section-title h2{font-size:22px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px;}
.card{background:#151515;padding:14px;border-radius:15px;position:relative;transition:.2s;}
.card:hover{background:#202020;transform:translateY(-3px);}
.cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#252525;}
.card h3{margin-top:12px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card p{color:#999;margin-top:5px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-plays{color:#1ed760;font-size:12px;margin-top:4px;font-weight:bold;}

/* BOTÃO DE REMOVER GUIA NO CARD */
.delete-card-btn{
    position:absolute;top:14px;right:14px;background:rgba(0,0,0,0.7);
    color:#ff5555;border:1px solid #ff5555;width:28px;height:28px;border-radius:50%;
    font-size:12px;display:none;align-items:center;justify-content:center;z-index:5;
}
.delete-card-btn:hover{background:#ff5555;color:#000;}

.play{
    margin-top:12px;width:100%;border:0;background:#1ed760;color:#000;padding:10px;
    border-radius:20px;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:6px;
}

.empty{color:#888;text-align:center;padding:30px 10px;grid-column:1/-1;}
.search-box{position:relative;margin-top:25px;}
.search-box span{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#777;font-size:14px;font-weight:bold;}
input{width:100%;padding:13px 13px 13px 40px;margin:0 0 13px;background:#252525;border:1px solid #333;color:#fff;border-radius:9px;outline:none;}
input:focus{border-color:#1ed760;}

/* MINI PLAYER FIXO */
.mini-player{
    position:fixed;bottom:65px;left:0;right:0;z-index:30;
    background:#171717;border-top:1px solid #292929;
    padding:10px 5%;display:none;align-items:center;gap:15px;cursor:pointer;
}
.mini-player img{width:45px;height:45px;object-fit:cover;border-radius:7px;}
.mini-player-info{flex:1;min-width:0;}
.mini-player-info strong, .mini-player-info span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.mini-player-info span{color:#999;font-size:13px;margin-top:3px;}
.mini-player button{background:none;border:0;color:#1ed760;font-size:20px;margin-right:10px;}

/* TELA / MODAL DO PLAYER COMPLETO */
.player-modal{
    display:none;position:fixed;inset:0;z-index:150;
    background:rgba(0,0,0,0.85);backdrop-filter:blur(20px);
    align-items:center;justify-content:center;padding:20px;
}
.player-card{
    background:#141414;border:1px solid #262626;width:100%;max-width:420px;
    border-radius:35px;padding:30px 25px;display:flex;flex-direction:column;align-items:center;
    box-shadow:0 25px 50px rgba(0,0,0,0.8);
}
.player-header{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.player-header button{background:none;border:0;color:#fff;font-size:16px;font-weight:bold;}
.player-header span{font-size:15px;font-weight:bold;letter-spacing:1px;color:#ccc;}

.player-cover-container{width:100%;aspect-ratio:1;border-radius:25px;overflow:hidden;margin-bottom:25px;}
.player-cover-container img{width:100%;height:100%;object-fit:cover;}
.player-song-info{text-align:center;margin-bottom:25px;width:100%;}
.player-song-info h2{font-size:24px;font-weight:bold;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-song-info p{color:#888;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.progress-container{width:100%;margin-bottom:20px;}
.progress-bar-bg{width:100%;height:6px;background:#252525;border-radius:3px;cursor:pointer;position:relative;}
.progress-bar-fill{height:100%;background:#1ed760;width:0%;border-radius:3px;}
.time-stamps{display:flex;justify-content:space-between;font-size:12px;color:#777;margin-top:8px;}

.player-actions{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:25px;width:100%;}
.action-btn{background:none;border:0;color:#aaa;font-size:18px;}
.action-btn.active{color:#1ed760;}
.main-play-btn{
    background:#1ed760;color:#000;border:0;width:65px;height:65px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:24px;
}

/* NAV INFERIOR */
nav{
    position:fixed;bottom:0;left:0;right:0;height:65px;
    background:#101010;border-top:1px solid #252525;z-index:40;
    display:flex;justify-content:space-around;align-items:center;padding:0 10px;
}
nav button{border:0;background:none;color:#aaa;font-size:11px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:bold;}
nav button:hover, nav button:active{color:#1ed760;}

/* MODAL LOGIN ADM */
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);align-items:center;justify-content:center;padding:20px;}
.modal-content{background:#181818;width:100%;max-width:450px;border-radius:20px;padding:25px;position:relative;}
.close{position:absolute;top:15px;right:15px;border:0;background:#292929;color:#fff;width:30px;height:30px;border-radius:50%;font-weight:bold;}
.form-btn{width:100%;padding:13px;background:#1ed760;color:#000;border:0;border-radius:25px;font-weight:bold;margin-top:10px;}

@media(max-width:700px){
    .grid{grid-template-columns:repeat(2,1fr);gap:12px;}
}
</style>
</head>
<body>

<div class="app">
    <header>
        <div class="logo">Under<span class="fy">Fy</span> <span class="by-uta">• UTA</span></div>
        <button class="header-btn" onclick="abrirADM()">ADM</button>
    </header>

    <main>
        <section class="hero">
            <small>UNDERFY • STUDIO CAMP</small>
            <h1>As guias da sessão.</h1>
            <p>Um espaço para ouvir, descobrir e organizar as músicas criadas durante as sessões.</p>
        </section>

        <div class="search-box">
            <span>BUSCA</span>
            <input id="pesquisa" placeholder="Pesquisar música ou artista..." oninput="pesquisar()">
        </div>

        <section class="section">
            <div class="section-title">
                <h2>Guias recentes</h2>
            </div>
            <div class="grid" id="listaMusicas"><div class="empty">Carregando músicas...</div></div>
        </section>

        <section class="section">
            <div class="section-title">
                <h2>Artistas</h2>
            </div>
            <div class="grid" id="listaArtistas"><div class="empty">Carregando artistas...</div></div>
        </section>
    </main>
</div>

<!-- MINI PLAYER FIXO -->
<div class="mini-player" id="miniPlayer" onclick="abrirInterfacePlayer()">
    <img id="miniCapa" src="">
    <div class="mini-player-info">
        <strong id="miniMusica">Música</strong>
        <span id="miniArtista">Artista</span>
    </div>
    <button id="miniPlayBtn" onclick="event.stopPropagation(); pausarRetomar();">&#10074;&#10074;</button>
</div>

<!-- TELA / MODAL DO PLAYER COMPLETO -->
<div class="player-modal" id="playerModal">
    <div class="player-card">
        <div class="player-header">
            <button onclick="fecharInterfacePlayer()">&#709;</button>
            <span>SESSÃO</span>
            <button onclick="alert('Player v2.0')">&#8230;</button>
        </div>

        <div class="player-cover-container">
            <img id="modalCapa" src="" alt="Capa">
        </div>

        <div class="player-song-info">
            <h2 id="modalMusica">Nome</h2>
            <p id="modalArtista">Artista</p>
        </div>

        <div class="progress-container">
            <div class="progress-bar-bg" id="progressBarBg" onclick="mudarProgresso(event)">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="time-stamps">
                <span id="currentTime">0:00</span>
                <span id="durationTime">0:00</span>
            </div>
        </div>

        <div class="player-actions">
            <button class="action-btn" id="btnShuffle" onclick="toggleShuffle()" title="Shuffle">&#8644;</button>
            <button class="action-btn" onclick="tocarAnterior()" title="Anterior">&#9664;&#9664;</button>
            <button class="main-play-btn" id="btnPlayPauseModal" onclick="pausarRetomar()" title="Play/Pause">&#10074;&#10074;</button>
            <button class="action-btn" onclick="tocarProxima()" title="Próximo">&#9654;&#9654;</button>
            <button class="action-btn" id="btnRepeat" onclick="toggleRepeat()" title="Repeat">&#8635;</button>
        </div>
    </div>
</div>

<audio id="audio" style="display:none;"></audio>

<!-- NAV INFERIOR -->
<nav>
    <button onclick="irInicio()">INICIO</button>
    <button onclick="mostrarMusicas()">GUIAS</button>
    <button onclick="mostrarArtistas()">ARTISTAS</button>
    <button onclick="abrirADM()">ADM</button>
</nav>

<!-- MODAL LOGIN ADM -->
<div class="modal" id="modalLogin">
    <div class="modal-content">
        <button class="close" onclick="fecharModal('modalLogin')">&#10005;</button>
        <h2>Área administrativa</h2>
        <input type="email" id="emailADM" placeholder="E-mail">
        <input type="password" id="senhaADM" placeholder="Senha">
        <button class="form-btn" onclick="loginADM()">Entrar</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://gnibzbnypirjrcaoibkx.supabase.co";
const SUPABASE_KEY = "sb_publishable_b9yvSbmWOLVJvq4AB4CLmQ_VRuzpG5T";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let musicas = [];
let artistasCache = [];
let musicaAtualIndex = -1;
let modoShuffle = false;
let modoRepeat = false;
let usuarioLogado = false;

document.addEventListener("DOMContentLoaded", () => {
    iniciarApp();
});

async function iniciarApp() {
    try {
        // Timeout rígido de 3 segundos para evitar qualquer carregamento infinito
        const fetchComTimeout = (promise) => {
            return Promise.race([
                promise,
                new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 3000))
            ]);
        };

        // Verifica sessão em segundo plano sem travar o carregamento
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            usuarioLogado = !!session;
            if (usuarioLogado && musicas.length > 0) renderizarTudo();
        }).catch(() => {});

        const resArtistas = await fetchComTimeout(supabaseClient.from('artistas').select('*').order('nome', { ascending: true }));
        artistasCache = resArtistas.data || [];

        const resMusicas = await fetchComTimeout(supabaseClient.from('musicas').select('*').order('created_at', { ascending: false }));
        const dadosMusicas = resMusicas.data || [];

        const resRel = await fetchComTimeout(supabaseClient.from('musica_artistas').select('*'));
        const dadosRelacao = resRel.data || [];

        musicas = dadosMusicas.map(m => {
            const rels = dadosRelacao.filter(r => r.musica_id === m.id);
            const objsArtistas = rels.map(r => artistasCache.find(a => a.id === r.artista_id)).filter(Boolean);
            let artistasNomes = objsArtistas.length > 0 ? objsArtistas.map(a => a.nome) : ['Desconhecido'];
            let textoArtista = artistasNomes[0];
            if (artistasNomes.length > 1) textoArtista += ` feat. ${artistasNomes.slice(1).join(', ')}`;

            return {
                id: m.id,
                nome: m.nome,
                artistaFormatado: textoArtista,
                capa: m.capa_url || 'https://via.placeholder.com/500',
                audio: m.audio_url || '',
                plays: m.plays || 0
            };
        });

        renderizarTudo();

        const audio = document.getElementById("audio");
        audio.addEventListener('ended', lidarFimDaMusica);
        audio.addEventListener('timeupdate', atualizarBarraProgresso);

    } catch (err) {
        console.error("Erro ao carregar:", err);
        document.getElementById("listaMusicas").innerHTML = `<div class="empty" style="color:#ff5555;">Falha ao carregar guias. Verifique a conexão.</div>`;
        document.getElementById("listaArtistas").innerHTML = `<div class="empty" style="color:#ff5555;">Falha ao carregar artistas.</div>`;
    }
}

function renderizarTudo() {
    const container = document.getElementById("listaMusicas");
    if (musicas.length === 0) {
        container.innerHTML = `<div class="empty">Nenhuma música cadastrada ainda.</div>`;
    } else {
        container.innerHTML = musicas.map((m, index) => `
            <div class="card">
                ${usuarioLogado ? `<button class="delete-card-btn" style="display:flex;" onclick="event.stopPropagation(); removerGuia('${m.id}')" title="Remover Guia">&#10005;</button>` : ''}
                <img class="cover" src="${m.capa}" onerror="this.src='https://via.placeholder.com/500'">
                <h3>${m.nome}</h3>
                <p>${m.artistaFormatado}</p>
                <div class="card-plays">${m.plays} reproduções</div>
                <button class="play" onclick="tocarMusicaPorIndex(${index})">
                    &#9654; OUVIR GUIA
                </button>
            </div>
        `).join('');
    }

    const containerArtistas = document.getElementById("listaArtistas");
    if (artistasCache.length === 0) {
        containerArtistas.innerHTML = `<div class="empty">Nenhum artista cadastrado.</div>`;
    } else {
        containerArtistas.innerHTML = artistasCache.map(a => `
            <div class="card" onclick="window.location.href='artista.html?nome=${encodeURIComponent(a.nome)}'">
                <img class="cover" src="${a.foto_url || 'https://via.placeholder.com/500'}" onerror="this.src='https://via.placeholder.com/500'">
                <h3>${a.nome}</h3>
            </div>
        `).join('');
    }
}

async function removerGuia(id) {
    if (!confirm("Deseja realmente remover esta guia do UnderFy?")) return;
    
    try {
        await supabaseClient.from('musica_artistas').delete().eq('musica_id', id);
        const { error } = await supabaseClient.from('musicas').delete().eq('id', id);
        if (error) throw error;

        musicas = musicas.filter(m => m.id !== id);
        renderizarTudo();
    } catch (err) {
        console.error("Erro ao remover:", err);
        alert("Erro ao excluir a música.");
    }
}

async function tocarMusicaPorIndex(index) {
    if (index < 0 || index >= musicas.length) return;
    musicaAtualIndex = index;
    const m = musicas[index];

    document.getElementById("miniPlayer").style.display = "flex";
    document.getElementById("miniMusica").textContent = m.nome;
    document.getElementById("miniArtista").textContent = m.artistaFormatado;
    document.getElementById("miniCapa").src = m.capa;

    document.getElementById("modalMusica").textContent = m.nome;
    document.getElementById("modalArtista").textContent = m.artistaFormatado;
    document.getElementById("modalCapa").src = m.capa;

    const audio = document.getElementById("audio");
    if (!m.audio) { alert("Áudio indisponível."); return; }
    audio.src = m.audio;
    audio.play();
    atualizarIconePlayPause(false);

    abrirInterfacePlayer();

    m.plays += 1;
    renderizarTudo();
    try { await supabaseClient.from('musicas').update({ plays: m.plays }).eq('id', m.id); } catch(e){}
}

function abrirInterfacePlayer() { if (musicaAtualIndex !== -1) document.getElementById("playerModal").style.display = "flex"; }
function fecharInterfacePlayer() { document.getElementById("playerModal").style.display = "none"; }

function pausarRetomar() {
    const audio = document.getElementById("audio");
    if (audio.paused) { 
        audio.play(); 
        atualizarIconePlayPause(false);
    } else { 
        audio.pause(); 
        atualizarIconePlayPause(true);
    }
}

function atualizarIconePlayPause(pausado) {
    const modalBtn = document.getElementById("btnPlayPauseModal");
    const miniBtn = document.getElementById("miniPlayBtn");
    
    if (pausado) {
        modalBtn.innerHTML = "&#9654;";
        if(miniBtn) miniBtn.innerHTML = "&#9654;";
    } else {
        modalBtn.innerHTML = "&#10074;&#10074;";
        if(miniBtn) miniBtn.innerHTML = "&#10074;&#10074;";
    }
}

function atualizarBarraProgresso() {
    const audio = document.getElementById("audio");
    if (isNaN(audio.duration)) return;
    document.getElementById("progressBarFill").style.width = (audio.currentTime / audio.duration) * 100 + "%";
    document.getElementById("currentTime").textContent = formatarTempo(audio.currentTime);
    document.getElementById("durationTime").textContent = formatarTempo(audio.duration);
}

function mudarProgresso(event) {
    const audio = document.getElementById("audio");
    const bg = document.getElementById("progressBarBg");
    if (!audio.duration) return;
    audio.currentTime = (event.offsetX / bg.clientWidth) * audio.duration;
}

function formatarTempo(sec) {
    const min = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${min}:${s < 10 ? '0' : ''}${s}`;
}

function tocarProxima() {
    if (musicas.length === 0) return;
    let next = modoShuffle ? Math.floor(Math.random() * musicas.length) : (musicaAtualIndex + 1) % musicas.length;
    tocarMusicaPorIndex(next);
}

function tocarAnterior() {
    if (musicas.length === 0) return;
    let prev = (musicaAtualIndex - 1 + musicas.length) % musicas.length;
    tocarMusicaPorIndex(prev);
}

function lidarFimDaMusica() {
    if (modoRepeat) { document.getElementById("audio").currentTime = 0; document.getElementById("audio").play(); } 
    else { tocarProxima(); }
}

function toggleShuffle() { 
    modoShuffle = !modoShuffle; 
    document.getElementById("btnShuffle").classList.toggle("active", modoShuffle); 
}

function toggleRepeat() { 
    modoRepeat = !modoRepeat; 
    document.getElementById("btnRepeat").classList.toggle("active", modoRepeat); 
}

function pesquisar() {
    const termo = document.getElementById("pesquisa").value.toLowerCase();
    const filtrado = musicas.filter(m => m.nome.toLowerCase().includes(termo) || m.artistaFormatado.toLowerCase().includes(termo));
    const container = document.getElementById("listaMusicas");
    if(filtrado.length === 0) {
        container.innerHTML = `<div class="empty">Nenhuma música encontrada.</div>`;
    } else {
        container.innerHTML = filtrado.map(m => `
            <div class="card">
                ${usuarioLogado ? `<button class="delete-card-btn" style="display:flex;" o
