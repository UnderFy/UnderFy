<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnderFy - Player & Stories</title>
    <style>
        /* RESET E VARIÁVEIS BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: #fff;
            padding-bottom: 80px;
            user-select: none;
            overflow-x: hidden;
        }

        /* HEADER */
        header {
            padding: 20px 16px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }

        /* BANNER STORIES */
        .stories-container {
            display: flex;
            gap: 12px;
            padding: 10px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .stories-container::-webkit-scrollbar {
            display: none;
        }

        .story-ring {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .story-avatar-wrapper {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            padding: 2.5px;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .story-ring.unseen .story-avatar-wrapper {
            background: linear-gradient(45deg, #1ed760, #00b0ff);
        }

        .story-ring.add-story .story-avatar-wrapper {
            background: #222;
            border: 1px stroke #333;
        }

        .story-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #000;
            background: #111;
        }

        .story-username {
            font-size: 11px;
            color: #ccc;
            max-width: 68px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
        }

        /* SEÇÃO DE CONTEÚDO */
        .content-section {
            padding: 16px;
        }

        .content-section h2 {
            font-size: 18px;
            margin-bottom: 12px;
        }

        .card-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .card {
            background: #121212;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .card:hover {
            background: #282828;
        }

        .card img {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 6px;
            object-fit: cover;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-subtitle {
            font-size: 12px;
            color: #aaa;
            margin-top: 2px;
        }

        /* MODAL PLAYER DE STORY */
        .story-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 100;
            display: none;
            flex-direction: column;
        }

        .story-modal.active {
            display: flex;
        }

        .story-progress-bar {
            position: absolute;
            top: 12px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 4px;
            z-index: 102;
        }

        .progress-segment {
            flex: 1;
            height: 2.5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            transition: width 0.1s linear;
        }

        .story-header-info {
            position: absolute;
            top: 24px;
            left: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 102;
        }

        .story-user-details {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .story-user-details img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .story-user-details span {
            font-size: 13px;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .close-story-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .story-content-view {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
        }

        .story-content-view img,
        .story-content-view video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .story-touch-left, .story-touch-right {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 35%;
            z-index: 101;
        }

        .story-touch-left { left: 0; }
        .story-touch-right { right: 0; }

        .story-views-pill {
            position: absolute;
            bottom: 20px;
            left: 16px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #fff;
            z-index: 102;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* MODAL CRIAR STORY */
        .create-story-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #121212;
            z-index: 110;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 20px;
        }

        .create-story-modal.active {
            display: flex;
        }

        .upload-box {
            border: 2px dashed #333;
            border-radius: 12px;
            width: 100%;
            max-width: 320px;
            height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            color: #aaa;
        }

        .upload-box:hover {
            border-color: #1ed760;
            color: #fff;
        }

        .preview-media {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            object-fit: contain;
        }

        .btn-primary {
            background: #1ed760;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 20px;
            border-radius: 24px;
            cursor: pointer;
        }

        /* NAV INFERIOR - PADRÃO ORIGINAL UNDERFY */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: rgba(16, 16, 16, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid #222;
            z-index: 40;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
        }

        nav button {
            border: 0;
            background: none;
            color: #888;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: color 0.2s ease, transform 0.1s ease;
            width: 25%;
        }

        nav button svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        nav button:hover, 
        nav button.active {
            color: #1ed760;
        }

        nav button:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <header>
        <h1>UnderFy</h1>
    </header>

    <!-- TRILHO DE STORIES -->
    <div class="stories-container" id="storiesContainer">
        <!-- O JS preencherá dinamicamente o botão de adicionar e os stories -->
    </div>

    <!-- ÁREA DE CONTEÚDO PRINCIPAL -->
    <main class="content-section" id="mainContent">
        <h2>Destaques</h2>
        <div class="card-list">
            <div class="card">
                <img src="https://picsum.photos/200?random=1" alt="Capa">
                <div class="card-title">Sessão Urbana</div>
                <div class="card-subtitle">Álbum • Artista A</div>
            </div>
            <div class="card">
                <img src="https://picsum.photos/200?random=2" alt="Capa">
                <div class="card-title">Acústico Ao Vivo</div>
                <div class="card-subtitle">Guia • Artista B</div>
            </div>
        </div>
    </main>

    <!-- RODAPÉ DE NAVEGAÇÃO COM ÍCONES CONSERVADOS -->
    <nav id="appNav">
        <button class="active" onclick="navegarAba(this, irInicio)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Início</span>
        </button>
        <button onclick="navegarAba(this, mostrarMusicas)">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            <span>Guias</span>
        </button>
        <button onclick="navegarAba(this, mostrarArtistas)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Artistas</span>
        </button>
        <button onclick="navegarAba(this, tratarAcaoArtista)">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <span>Publicar</span>
        </button>
    </nav>

    <!-- MODAL DO PLAYER DE STORY -->
    <div class="story-modal" id="storyPlayerModal">
        <div class="story-progress-bar" id="storyProgressBar"></div>
        <div class="story-header-info">
            <div class="story-user-details">
                <img id="storyUserAvatar" src="" alt="User">
                <span id="storyUsername"></span>
            </div>
            <button class="close-story-btn" onclick="fecharStoryPlayer()">&times;</button>
        </div>
        <div class="story-content-view" id="storyContentView">
            <!-- Mídia (img/video) será inserida via JS -->
            <div class="story-touch-left" onclick="storyAnterior()"></div>
            <div class="story-touch-right" onclick="proximoStory()"></div>
        </div>
        <div class="story-views-pill" id="storyViewsPill">
            👁️ <span id="storyViewsCount">0</span> visualizações
        </div>
    </div>

    <!-- MODAL DE CRIAR STORY -->
    <div class="create-story-modal" id="createStoryModal">
        <h2 style="font-size: 18px;">Criar novo Story</h2>
        <div class="upload-box" onclick="document.getElementById('storyFileInput').click()">
            <div id="uploadPlaceholder">
                <p style="font-size: 28px; text-align: center;">📷</p>
                <p style="font-size: 14px; margin-top: 8px;">Toque para selecionar foto ou vídeo</p>
            </div>
            <div id="uploadPreviewContainer" style="display: none; width: 100%; height: 100%; align-items: center; justify-content: center;"></div>
        </div>
        <input type="file" id="storyFileInput" accept="image/*,video/*" style="display: none;" onchange="handleFileSelect(event)">
        <div style="display: flex; gap: 10px;">
            <button class="btn-secondary" onclick="fecharCriarStory()">Cancelar</button>
            <button class="btn-primary" id="btnPublicarStory" onclick="publicarStory()" disabled style="opacity: 0.5;">Publicar</button>
        </div>
    </div>

    <script>
        // DADOS LOCAIS DE MOCK PARA STORIES
        let storiesData = [
            {
                id: 'user_1',
                username: 'MC Silva',
                avatar: 'https://picsum.photos/100?random=10',
                seen: false,
                items: [
                    { type: 'image', url: 'https://picsum.photos/1080/1920?random=101', views: 42, duration: 5000 },
                    { type: 'image', url: 'https://picsum.photos/1080/1920?random=102', views: 18, duration: 5000 }
                ]
            },
            {
                id: 'user_2',
                username: 'Banda Echo',
                avatar: 'https://picsum.photos/100?random=20',
                seen: false,
                items: [
                    { type: 'image', url: 'https://picsum.photos/1080/1920?random=201', views: 89, duration: 5000 }
                ]
            }
        ];

        let currentUserStory = {
            id: 'my_story',
            username: 'Seu Story',
            avatar: 'https://picsum.photos/100?random=99',
            seen: false,
            items: []
        };

        // ESTADOS DO PLAYER DE STORY
        let activeUserIndex = 0;
        let activeItemIndex = 0;
        let storyTimer = null;
        let selectedFileForStory = null;

        // INICIALIZAÇÃO
        window.addEventListener('DOMContentLoaded', () => {
            renderStories();
        });

        // RENDERIZAR TRILHO DE STORIES
        function renderStories() {
            const container = document.getElementById('storiesContainer');
            container.innerHTML = '';

            // BOTÃO SEU STORY / ADICIONAR
            const myStoryRing = document.createElement('div');
            myStoryRing.className = `story-ring add-story`;
            myStoryRing.onclick = () => {
                if (currentUserStory.items.length > 0) {
                    abrirStoryPlayer('my_story');
                } else {
                    abrirModalCriarStory();
                }
            };

            myStoryRing.innerHTML = `
                <div class="story-avatar-wrapper" style="${currentUserStory.items.length > 0 ? 'background: #1ed760;' : ''}">
                    <img class="story-avatar" src="${currentUserStory.avatar}" alt="Seu Story">
                </div>
                <span class="story-username">${currentUserStory.items.length > 0 ? 'Seu Story' : '+ Story'}</span>
            `;
            container.appendChild(myStoryRing);

            // OUTROS USERS
            storiesData.forEach((u, index) => {
                const ring = document.createElement('div');
                ring.className = `story-ring ${u.seen ? 'seen' : 'unseen'}`;
                ring.onclick = () => abrirStoryPlayer(u.id);

                ring.innerHTML = `
                    <div class="story-avatar-wrapper">
                        <img class="story-avatar" src="${u.avatar}" alt="${u.username}">
                    </div>
                    <span class="story-username">${u.username}</span>
                `;
                container.appendChild(ring);
            });
        }

        // CONTROLAR ABRIR E TOCAR STORIES
        function abrirStoryPlayer(userId) {
            let list = currentUserStory.items.length > 0 ? [currentUserStory, ...storiesData] : storiesData;
            activeUserIndex = list.findIndex(u => u.id === userId);
            if (activeUserIndex === -1) activeUserIndex = 0;
            activeItemIndex = 0;

            const modal = document.getElementById('storyPlayerModal');
            modal.classList.add('active');

            exibirStoryAtual();
        }

        function fecharStoryPlayer() {
            clearTimeout(storyTimer);
            const modal = document.getElementById('storyPlayerModal');
            modal.classList.remove('active');
            
            const view = document.getElementById('storyContentView');
            const video = view.querySelector('video');
            if (video) video.pause();
        }

        function exibirStoryAtual() {
            clearTimeout(storyTimer);

            let list = currentUserStory.items.length > 0 ? [currentUserStory, ...storiesData] : storiesData;
            const user = list[activeUserIndex];
            
            if (!user || !user.items[activeItemIndex]) {
                fecharStoryPlayer();
                return;
            }

            user.seen = true;
            renderStories();

            const item = user.items[activeItemIndex];

            // Atualiza Header
            document.getElementById('storyUserAvatar').src = user.avatar;
            document.getElementById('storyUsername').innerText = user.username;
            document.getElementById('storyViewsCount').innerText = item.views || 0;

            // Atualiza Barras de Progresso
            const progressBarContainer = document.getElementById('storyProgressBar');
            progressBarContainer.innerHTML = '';
            user.items.forEach((_, idx) => {
                const seg = document.createElement('div');
                seg.className = 'progress-segment';
                const fill = document.createElement('div');
                fill.className = 'progress-fill';
                if (idx < activeItemIndex) fill.style.width = '100%';
                if (idx === activeItemIndex) fill.id = 'currentProgressFill';
                seg.appendChild(fill);
                progressBarContainer.appendChild(seg);
            });

            // Atualiza Mídia
            const view = document.getElementById('storyContentView');
            // Remove mídia antiga, mantendo apenas as divs de touch
            const oldMedia = view.querySelector('img, video');
            if (oldMedia) oldMedia.remove();

            if (item.type === 'image') {
                const img = document.createElement('img');
                img.src = item.url;
                view.appendChild(img);

                iniciarBarraProgresso(item.duration || 5000);
            } else if (item.type === 'video') {
                const video = document.createElement('video');
                video.src = item.url;
                video.autoplay = true;
                video.playsInline = true;
                view.appendChild(video);

                video.onloadedmetadata = () => {
                    const dur = video.duration * 1000;
                    iniciarBarraProgresso(dur);
                };
            }
        }

        function iniciarBarraProgresso(duracao) {
            const fill = document.getElementById('currentProgressFill');
            if (!fill) return;

            let start = null;
            function step(timestamp) {
                if (!start) start = timestamp;
                let progress = timestamp - start;
                let pct = Math.min((progress / duracao) * 100, 100);
                fill.style.width = pct + '%';

                if (progress < duracao) {
                    storyTimer = requestAnimationFrame(step);
                } else {
                    proximoStory();
                }
            }
            storyTimer = requestAnimationFrame(step);
        }

        function proximoStory() {
            cancelAnimationFrame(storyTimer);
            let list = currentUserStory.items.length > 0 ? [currentUserStory, ...storiesData] : storiesData;
            const user = list[activeUserIndex];

            if (activeItemIndex < user.items.length - 1) {
                activeItemIndex++;
                exibirStoryAtual();
            } else if (activeUserIndex < list.length - 1) {
                activeUserIndex++;
                activeItemIndex = 0;
                exibirStoryAtual();
            } else {
                fecharStoryPlayer();
            }
        }

        function storyAnterior() {
            cancelAnimationFrame(storyTimer);
            if (activeItemIndex > 0) {
                activeItemIndex--;
                exibirStoryAtual();
            } else if (activeUserIndex > 0) {
                activeUserIndex--;
                let list = currentUserStory.items.length > 0 ? [currentUserStory, ...storiesData] : storiesData;
                activeItemIndex = list[activeUserIndex].items.length - 1;
                exibirStoryAtual();
            } else {
                exibirStoryAtual();
            }
        }

        // MODAL CRIAR STORY
        function abrirModalCriarStory() {
            document.getElementById('createStoryModal').classList.add('active');
        }

        function fecharCriarStory() {
            document.getElementById('createStoryModal').classList.remove('active');
            selectedFileForStory = null;
            document.getElementById('uploadPlaceholder').style.display = 'block';
            const container = document.getElementById('uploadPreviewContainer');
            container.style.display = 'none';
            container.innerHTML = '';
            const btn = document.getElementById('btnPublicarStory');
            btn.disabled = true;
            btn.style.opacity = '0.5';
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            selectedFileForStory = file;
            const url = URL.createObjectURL(file);
            const isVideo = file.type.startsWith('video/');

            const placeholder = document.getElementById('uploadPlaceholder');
            const container = document.getElementById('uploadPreviewContainer');

            placeholder.style.display = 'none';
            container.style.display = 'flex';
            container.innerHTML = '';

            if (isVideo) {
                const vid = document.createElement('video');
                vid.src = url;
                vid.className = 'preview-media';
                vid.controls = true;
                container.appendChild(vid);
            } else {
                const img = document.createElement('img');
                img.src = url;
                img.className = 'preview-media';
                container.appendChild(img);
            }

            const btn = document.getElementById('btnPublicarStory');
            btn.disabled = false;
            btn.style.opacity = '1';
        }

        function publicarStory() {
            if (!selectedFileForStory) return;

            const isVideo = selectedFileForStory.type.startsWith('video/');
            const url = URL.createObjectURL(selectedFileForStory);

            currentUserStory.items.push({
                type: isVideo ? 'video' : 'image',
                url: url,
                views: 1,
                duration: 5000
            });

            fecharCriarStory();
            renderStories();
            abrirStoryPlayer('my_story');
        }

        // NAVEGAÇÃO ENTRE ABAS DO NAV INFERIOR
        function navegarAba(btnElement, acaoFuncao) {
            const botoes = document.querySelectorAll("#appNav button");
            botoes.forEach(b => b.classList.remove("active"));

            if (btnElement) {
                btnElement.classList.add("active");
            }

            if (typeof acaoFuncao === "function") {
                acaoFuncao();
            }
        }

        function irInicio() {
            document.getElementById('mainContent').innerHTML = `
                <h2>Destaques</h2>
                <div class="card-list">
                    <div class="card">
                        <img src="https://picsum.photos/200?random=1" alt="Capa">
                        <div class="card-title">Sessão Urbana</div>
                        <div class="card-subtitle">Álbum • Artista A</div>
                    </div>
                    <div class="card">
                        <img src="https://picsum.photos/200?random=2" alt="Capa">
                        <div class="card-title">Acústico Ao Vivo</div>
                        <div class="card-subtitle">Guia • Artista B</div>
                    </div>
                </div>
            `;
        }

        function mostrarMusicas() {
            document.getElementById('mainContent').innerHTML = `
                <h2>Guias & Músicas</h2>
                <p style="color: #aaa; font-size: 14px;">Lista de faixas disponíveis para audição...</p>
            `;
        }

        function mostrarArtistas() {
            document.getElementById('mainContent').innerHTML = `
                <h2>Artistas</h2>
                <p style="color: #aaa; font-size: 14px;">Perfis de artistas independentes cadastrados...</p>
            `;
        }

        function tratarAcaoArtista() {
            abrirModalCriarStory();
        }
    </script>
</body>
</html>
