<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UnderFy</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b0b0b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
    padding-bottom:130px;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(11,11,11,.95);
    backdrop-filter:blur(15px);
    padding:18px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #202020;
}

.logo{
    font-size:27px;
    font-weight:900;
    letter-spacing:-1px;
    display:flex;
    align-items:center;
    gap:12px;
}

.logo .fy{
    color:#1ed760;
}

.logo .by-uta{
    color:#fff;
}

.header-btn{
    border:0;
    background:#1ed760;
    color:#000;
    font-weight:bold;
    padding:10px 16px;
    border-radius:25px;
}

/* MAIN */

main{
    width:90%;
    max-width:1200px;
    margin:auto;
}

/* HERO */

.hero{
    margin-top:25px;
    min-height:260px;
    border-radius:25px;
    padding:35px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    background:linear-gradient(135deg,#171717,#063d20);
    overflow:hidden;
}

.hero small{
    color:#1ed760;
    font-weight:bold;
    margin-bottom:10px;
    letter-spacing:1px;
}

.hero h1{
    font-size:42px;
    margin-bottom:10px;
}

.hero p{
    color:#bbb;
    max-width:600px;
}

/* SEÇÕES */

.section{
    margin-top:35px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.section-title h2{
    font-size:22px;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(180px,1fr));
    gap:18px;
}

/* CARD */

.card{
    background:#151515;
    padding:14px;
    border-radius:15px;
    position:relative;
    transition:.2s;
}

.card:hover{
    background:#202020;
    transform:translateY(-3px);
}

.cover{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    border-radius:10px;
    background:#252525;
}

.card h3{
    margin-top:12px;
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card p{
    color:#999;
    margin-top:5px;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card-plays{
    color:#1ed760;
    font-size:12px;
    margin-top:4px;
    font-weight:bold;
}

.play{
    margin-top:12px;
    width:100%;
    border:0;
    background:#1ed760;
    color:#000;
    padding:10px;
    border-radius:20px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
}

.empty{
    color:#888;
    text-align:center;
    padding:30px 10px;
    grid-column:1/-1;
}

/* BUSCA */

.search-box{
    position:relative;
    margin-top:25px;
}

.search-box span{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#777;
    font-size:14px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px 13px 13px 40px;
    margin:0 0 13px;
    background:#252525;
    border:1px solid #333;
    color:#fff;
    border-radius:9px;
    outline:none;
}

input:focus{
    border-color:#1ed760;
}

/* MINI PLAYER */

.mini-player{
    position:fixed;
    bottom:65px;
    left:0;
    right:0;
    z-index:30;
    background:#171717;
    border-top:1px solid #292929;
    padding:10px 5%;
    display:none;
    align-items:center;
    gap:15px;
    cursor:pointer;
}

.mini-player img{
    width:45px;
    height:45px;
    object-fit:cover;
    border-radius:7px;
}

.mini-player-info{
    flex:1;
    min-width:0;
}

.mini-player-info strong,
.mini-player-info span{
    display:block;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.mini-player-info span{
    color:#999;
    font-size:13px;
    margin-top:3px;
}

.mini-player button{
    background:none;
    border:0;
    color:#1ed760;
    font-size:20px;
    margin-right:10px;
}

/* PLAYER COMPLETO */

.player-modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:150;
    background:rgba(0,0,0,.85);
    backdrop-filter:blur(20px);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.player-card{
    background:#141414;
    border:1px solid #262626;
    width:100%;
    max-width:420px;
    border-radius:35px;
    padding:30px 25px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:0 25px 50px rgba(0,0,0,.8);
}

.player-header{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.player-header button{
    background:none;
    border:0;
    color:#fff;
    font-size:16px;
    font-weight:bold;
}

.player-header span{
    font-size:15px;
    font-weight:bold;
    letter-spacing:1px;
    color:#ccc;
}

.player-cover-container{
    width:100%;
    aspect-ratio:1;
    border-radius:25px;
    overflow:hidden;
    margin-bottom:25px;
}

.player-cover-container img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.player-song-info{
    text-align:center;
    margin-bottom:25px;
    width:100%;
}

.player-song-info h2{
    font-size:24px;
    font-weight:bold;
    margin-bottom:8px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-song-info p{
    color:#888;
    font-size:15px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* PROGRESSO */

.progress-container{
    width:100%;
    margin-bottom:20px;
}

.progress-bar-bg{
    width:100%;
    height:6px;
    background:#252525;
    border-radius:3px;
    cursor:pointer;
    position:relative;
}

.progress-bar-fill{
    height:100%;
    background:#1ed760;
    width:0%;
    border-radius:3px;
}

.time-stamps{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#777;
    margin-top:8px;
}

/* PLAYER CONTROLES */

.player-actions{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    margin-bottom:25px;
    width:100%;
}

.action-btn{
    background:none;
    border:0;
    color:#aaa;
    font-size:18px;
}

.action-btn.active{
    color:#1ed760;
}

.main-play-btn{
    background:#1ed760;
    color:#000;
    border:0;
    width:65px;
    height:65px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

/* NAV */

nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:#101010;
    border-top:1px solid #252525;
    z-index:40;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:0 10px;
}

nav button{
    border:0;
    background:none;
    color:#aaa;
    font-size:11px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-weight:bold;
}

nav button:hover{
    color:#1ed760;
}

/* MODAL LOGIN */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:200;
    background:rgba(0,0,0,.75);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-content{
    background:#181818;
    width:100%;
    max-width:450px;
    border-radius:20px;
    padding:25px;
    position:relative;
}

.close{
    position:absolute;
    top:15px;
    right:15px;
    border:0;
    background:#292929;
    color:#fff;
    width:30px;
    height:30px;
    border-radius:50%;
    font-weight:bold;
}

.form-btn{
    width:100%;
    padding:13px;
    background:#1ed760;
    color:#000;
    border:0;
    border-radius:25px;
    font-weight:bold;
    margin-top:10px;
}

/* MOBILE */

@media(max-width:700px){

    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .hero h1{
        font-size:32px;
    }

}
</style>
</head>

<body>

<div class="app">

<header>

<!--
    A PARTE 2 COMEÇA AQUI.
    NÃO APAGUE NADA ACIMA.
-->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://gnibzbnypirjrcaoibkx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_b9yvSbmWOLVJvq4AB4CLmQ_VRuzpG5T";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ================================
   VARIÁVEIS
================================ */

let musicas = [];
let artistasCache = [];

let musicaAtualIndex = -1;

let modoShuffle = false;
let modoRepeat = false;

let tempoOuvido = 0;
let ultimoTempo = 0;
let reproducaoContabilizada = false;


/* ================================
   INICIAR
================================ */

document.addEventListener(
    "DOMContentLoaded",
    iniciarApp
);


function iniciarApp(){

    const audio =
        document.getElementById("audio");

    audio.addEventListener(
        "timeupdate",
        atualizarBarraProgresso
    );

    audio.addEventListener(
        "timeupdate",
        contarTempoOuvido
    );

    audio.addEventListener(
        "ended",
        lidarFimDaMusica
    );

    carregarDados();
}


/* ================================
   TIMEOUT
================================ */

function timeoutPromise(ms){

    return new Promise(function(resolve,reject){

        setTimeout(function(){

            reject(
                new Error(
                    "Tempo limite excedido."
                )
            );

        },ms);

    });

}


/* ================================
   CARREGAR DADOS
================================ */

async function carregarDados(){

    const listaMusicas =
        document.getElementById(
            "listaMusicas"
        );

    const listaArtistas =
        document.getElementById(
            "listaArtistas"
        );

    try{

        /*
        Carregamos músicas e artistas
        ao mesmo tempo.
        */

        const resultado =
            await Promise.race([

                Promise.all([

                    supabaseClient
                    .from("artistas")
                    .select("*")
                    .order(
                        "nome",
                        {
                            ascending:true
                        }
                    ),

                    supabaseClient
                    .from("musicas")
                    .select("*")
                    .order(
                        "created_at",
                        {
                            ascending:false
                        }
                    )

                ]),

                timeoutPromise(7000)

            ]);


        const resultadoArtistas =
            resultado[0];

        const resultadoMusicas =
            resultado[1];


        /*
        ARTISTAS
        */

        if(
            resultadoArtistas.error
        ){

            console.error(
                resultadoArtistas.error
            );

            artistasCache = [];

        }else{

            artistasCache =
                resultadoArtistas.data || [];

        }


        /*
        MÚSICAS
        */

        if(
            resultadoMusicas.error
        ){

            console.error(
                resultadoMusicas.error
            );

            musicas = [];

        }else{

            musicas =
                resultadoMusicas.data || [];

        }


        /*
        RELACIONAMENTO
        */

        let dadosRelacao = [];


        try{

            const relacao =
                await Promise.race([

                    supabaseClient
                    .from("musica_artistas")
                    .select("*"),

                    timeoutPromise(5000)

                ]);


            if(
                relacao &&
                !relacao.error
            ){

                dadosRelacao =
                    relacao.data || [];

            }

        }catch(error){

            console.warn(
                "Relação artista/música indisponível.",
                error
            );

        }


        /*
        ORGANIZAR MÚSICAS
        */

        musicas =
            musicas.map(function(m){

                const relacoes =
                    dadosRelacao.filter(
                        function(r){

                            return (
                                r.musica_id ===
                                m.id
                            );

                        }
                    );


                const nomes =
                    relacoes
                    .map(function(r){

                        const artista =
                            artistasCache.find(
                                function(a){

                                    return (
                                        a.id ===
                                        r.artista_id
                                    );

                                }
                            );


                        return artista
                            ? artista.nome
                            : null;

                    })
                    .filter(Boolean);


                let artistaFormatado =
                    nomes.length > 0
                    ? nomes[0]
                    : "Desconhecido";


                if(nomes.length > 1){

                    artistaFormatado +=
                        " feat. " +
                        nomes
                        .slice(1)
                        .join(", ");

                }


                return {

                    id:m.id,

                    nome:m.nome || "Sem nome",

                    artistaFormatado:
                        artistaFormatado,

                    capa:
                        m.capa_url ||
                        "https://via.placeholder.com/500",

                    audio:
                        m.audio_url || "",

                    plays:
                        Number(m.plays) || 0

                };

            });


        renderizarTudo();

    }catch(error){

        console.error(
            "Erro ao carregar dados:",
            error
        );


        listaMusicas.innerHTML = `

            <div class="empty">

                Não foi possível carregar
                as guias.

                <br><br>

                <button
                    onclick="carregarDados()"
                    style="
                        background:#1ed760;
                        border:0;
                        padding:10px 18px;
                        border-radius:20px;
                        font-weight:bold;
      "
                >
                    TENTAR NOVAMENTE
                </button>

            </div>

        `;


        listaArtistas.innerHTML = `

            <div class="empty">

                Não foi possível carregar
                os artistas.

            </div>

        `;

    }

}


/* ================================
   RENDERIZAR TUDO
================================ */

function renderizarTudo(){

    renderizarMusicas(
        musicas
    );

    renderizarArtistas(
        artistasCache
    );

}


/* ================================
   RENDERIZAR MÚSICAS
================================ */

function renderizarMusicas(lista){

    const container =
        document.getElementById(
            "listaMusicas"
        );


    if(!lista.length){

        container.innerHTML = `

            <div class="empty">
                Nenhuma música cadastrada ainda.
            </div>

        `;

        return;

    }


    container.innerHTML =
        lista.map(function(m){

            const index =
                musicas.findIndex(
                    function(item){

                        return (
                            item.id ===
                            m.id
                        );

                    }
                );


            return `

                <div class="card">

                    <img
                        class="cover"
                        src="${escaparHTML(m.capa)}"
                        onerror="
                            this.src='https://via.placeholder.com/500'
                        "
                    >

                    <h3>
                        ${escaparHTML(m.nome)}
                    </h3>

                    <p>
                        ${escaparHTML(
                            m.artistaFormatado
                        )}
                    </p>

                    <div class="card-plays">
                        ${m.plays} reproduções
                    </div>

                    <button
                        class="play"
                        onclick="
                            tocarMusicaPorIndex(${index})
                        "
                    >
                        &#9654; OUVIR GUIA
                    </button>

                </div>

            `;

        }).join("");

}


/* ================================
   RENDERIZAR ARTISTAS
================================ */

function renderizarArtistas(lista){

    const container =
        document.getElementById(
            "listaArtistas"
        );


    if(!lista.length){

        container.innerHTML = `

            <div class="empty">
                Nenhum artista cadastrado.
            </div>

        `;

        return;

    }


    container.innerHTML =
        lista.map(function(a){

            return `

                <div
                    class="card"
                    onclick="
                        abrirArtista(
                            '${encodeURIComponent(a.nome)}'
                        )
                    "
                >

                    <img
                        class="cover"
                        src="${
                            a.foto_url ||
                            'https://via.placeholder.com/500'
                        }"
                        onerror="
                            this.src='https://via.placeholder.com/500'
                        "
                    >

                    <h3>
                        ${escaparHTML(a.nome)}
                    </h3>

                </div>

            `;

        }).join("");

}


/* ================================
   ABRIR ARTISTA
================================ */

function abrirArtista(nome){

    window.location.href =
        "artista.html?nome=" +
        nome;

}


/* ================================
   TOCAR MÚSICA
================================ */

async function tocarMusicaPorIndex(index){

    if(
        index < 0 ||
        index >= musicas.length
    ){

        return;

    }


    musicaAtualIndex =
        index;


    const musica =
        musicas[index];


    /*
    NOVA REPRODUÇÃO
    */

    tempoOuvido = 0;

    ultimoTempo = 0;

    reproducaoContabilizada =
        false;


    /*
    MINI PLAYER
    */

    document.getElementById(
        "miniPlayer"
    ).style.display =
        "flex";


    document.getElementById(
        "miniMusica"
    ).textContent =
        musica.nome;


    document.getElementById(
        "miniArtista"
    ).textContent =
        musica.artistaFormatado;


    document.getElementById(
        "miniCapa"
    ).src =
        musica.capa;


    /*
    PLAYER COMPLETO
    */

    document.getElementById(
        "modalMusica"
    ).textContent =
        musica.nome;


    document.getElementById(
        "modalArtista"
    ).textContent =
        musica.artistaFormatado;


    document.getElementById(
        "modalCapa"
    ).src =
        musica.capa;


    if(!musica.audio){

        alert(
            "Áudio indisponível."
        );

        return;

    }


    const audio =
        document.getElementById(
            "audio"
        );


    audio.pause();

    audio.src =
        musica.audio;

    audio.currentTime =
        0;


    document.getElementById(
        "progressBarFill"
    ).style.width =
        "0%";


    document.getElementById(
        "currentTime"
    ).textContent =
        "0:00";


    document.getElementById(
        "durationTime"
    ).textContent =
        "0:00";


    try{

        await audio.play();

        atualizarIconePlayPause(
            false
        );

    }catch(error){

        console.error(
            "Erro ao reproduzir áudio:",
            error
        );

        atualizarIconePlayPause(
            true
        );

    }


    abrirInterfacePlayer();

}


/* ================================
   PLAYER
================================ */

function abrirInterfacePlayer(){

    if(
        musicaAtualIndex !== -1
    ){

        document.getElementById(
            "playerModal"
        ).style.display =
            "flex";

    }

}


function fecharInterfacePlayer(){

    document.getElementById(
        "playerModal"
    ).style.display =
        "none";

}


/* ================================
   PLAY / PAUSE
================================ */

function pausarRetomar(){

    const audio =
        document.getElementById(
            "audio"
        );


    if(!audio.src){

        return;

    }


    if(audio.paused){

        audio.play();

        atualizarIconePlayPause(
            false
        );

    }else{

        audio.pause();

        atualizarIconePlayPause(
            true
        );

    }

}


/* ================================
   ÍCONE PLAY / PAUSE
================================ */

function atualizarIconePlayPause(
    pausado
){

    const modal =
        document.getElementById(
            "btnPlayPauseModal"
        );

    const mini =
        document.getElementById(
            "miniPlayBtn"
        );


    if(pausado){

        modal.innerHTML =
            "&#9654;";

        mini.innerHTML =
            "&#9654;";

    }else{

        modal.innerHTML =
            "&#10074;&#10074;";

        mini.innerHTML =
            "&#10074;&#10074;";

    }

}


/* ================================
   BARRA DE PROGRESSO
================================ */

function atualizarBarraProgresso(){

    const audio =
        document.getElementById(
            "audio"
        );


    if(
        !audio.duration ||
        isNaN(audio.duration)
    ){

        return;

    }


    const porcentagem =
        (
            audio.currentTime /
            audio.duration
        ) * 100;


    document.getElementById(
        "progressBarFill"
    ).style.width =
        porcentagem + "%";


    document.getElementById(
        "currentTime"
    ).textContent =
        formatarTempo(
            audio.currentTime
        );


    document.getElementById(
        "durationTime"
    ).textContent =
        formatarTempo(
            audio.duration
        );

}


/* ================================
   ALTERAR PROGRESSO
================================ */

function mudarProgresso(event){

    const audio =
        document.getElementById(
            "audio"
        );

    const barra =
        document.getElementById(
            "progressBarBg"
        );


    if(!audio.duration){

        return;

    }


    const porcentagem =
        event.offsetX /
        barra.clientWidth;


    audio.currentTime =
        porcentagem *
        audio.duration;


    /*
    Pulo na música não conta
    como tempo ouvido.
    */

    ultimoTempo =
        audio.currentTime;

}


/* ================================
   FORMATAR TEMPO
================================ */

function formatarTempo(segundos){

    const minutos =
        Math.floor(
            segundos / 60
        );


    const segundosRestantes =
        Math.floor(
            segundos % 60
        );


    return (
        minutos +
        ":" +
        (
            segundosRestantes < 10
            ? "0"
            : ""
        ) +
        segundosRestantes
    );

}


/* ================================
   CONTADOR DE 30 SEGUNDOS
================================ */

function contarTempoOuvido(){

    if(
        reproducaoContabilizada
    ){

        return;

    }


    const audio =
        document.getElementById(
            "audio"
        );


    if(audio.paused){

        ultimoTempo =
            audio.currentTime;

        return;

    }


    const atual =
        audio.currentTime;


    const diferenca =
        atual -
        ultimoTempo;


    /*
    Só contamos tempo normal de reprodução.

    Se a pessoa arrastar a música,
    o salto não é contabilizado.
    */

    if(
        diferenca > 0 &&
        diferenca <= 1.5
    ){

        tempoOuvido +=
            diferenca;

    }


    ultimoTempo =
        atual;


    if(
        tempoOuvido >= 30
    ){

        registrarReproducao();

    }

}


/* ================================
   REGISTRAR REPRODUÇÃO
================================ */

async function registrarReproducao(){

    if(
        reproducaoContabilizada
    ){

        return;

    }


    reproducaoContabilizada =
        true;


    const musica =
        musicas[musicaAtualIndex];


    if(!musica){

        return;

    }


    musica.plays =
        Number(musica.plays) + 1;


    /*
    Atualiza imediatamente
    na interface.
    */

    renderizarMusicas(
        musicas
    );


    /*
    Salva no Supabase.
    */

    try{

        const resultado =
            await supabaseClient
            .from("musicas")
            .update({
                plays:musica.plays
            })
            .eq(
                "id",
                musica.id
            );


        if(resultado.error){

            console.error(
                "Erro ao salvar reprodução:",
                resultado.error
            );

        }

    }catch(error){

        console.error(
            "Erro ao registrar reprodução:",
            error
        );

    }

}


/* ================================
   PRÓXIMA MÚSICA
================================ */

function tocarProxima(){

    if(!musicas.length){

        return;

    }


    let proximo;


    if(modoShuffle){

        proximo =
            Math.floor(
                Math.random() *
                musicas.length
            );

    }else{

        proximo =
            (
                musicaAtualIndex + 1
            ) %
            musicas.length;

    }


    tocarMusicaPorIndex(
        proximo
    );

}


/* ================================
   MÚSICA ANTERIOR
================================ */

function tocarAnterior(){

    if(!musicas.length){

        return;

    }


    const anterior =
        (
            musicaAtualIndex -
            1 +
            musicas.length
        ) %
        musicas.length;


    tocarMusicaPorIndex(
        anterior
    );

}


/* ================================
   FIM DA MÚSICA
================================ */

function lidarFimDaMusica(){

    if(modoRepeat){

        tempoOuvido = 0;

        ultimoTempo = 0;

        reproducaoContabilizada =
            false;


        const audio =
            document.getElementById(
                "audio"
            );


        audio.currentTime =
            0;

        audio.play();

    }else{

        tocarProxima();

    }

}


/* ================================
   SHUFFLE
================================ */

function toggleShuffle(){

    modoShuffle =
        !modoShuffle;


    document.getElementById(
        "btnShuffle"
    ).classList.toggle(
        "active",
        modoShuffle
    );

}


/* ================================
   REPEAT
================================ */

function toggleRepeat(){

    modoRepeat =
        !modoRepeat;


    document.getElementById(
        "btnRepeat"
    ).classList.toggle(
        "active",
        modoRepeat
    );

}


/* ================================
   PESQUISA
================================ */

function pesquisar(){

    const termo =
        document.getElementById(
            "pesquisa"
        )
        .value
        .toLowerCase()
        .trim();


    if(!termo){

        renderizarMusicas(
            musicas
        );

        return;

    }


    const filtradas =
          musicas.filter(
            function(m){

                return (
                    m.nome
                        .toLowerCase()
                        .includes(termo)

                    ||

                    m.artistaFormatado
                        .toLowerCase()
                        .includes(termo)
                );

            }
        );


    if(!filtradas.length){

        document.getElementById(
            "listaMusicas"
        ).innerHTML = `

            <div class="empty">
                Nenhuma música encontrada.
            </div>

        `;

        return;

    }


    renderizarMusicas(
        filtradas
    );

}

/* ================================
   LOGIN ADM
================================ */

async function loginADM(){

    const email =
        document.getElementById(
            "emailADM"
        ).value.trim();

    const senha =
        document.getElementById(
            "senhaADM"
        ).value.trim();


    if(!email || !senha){

        alert(
            "Digite o e-mail e a senha."
        );

        return;
    }


    try{

        const resultado =
            await supabaseClient
            .auth
            .signInWithPassword({

                email: email,
                password: senha

            });


        if(resultado.error){

            alert(
                "Dados incorretos."
            );

            return;
        }


        window.location.href =
            "upload.html";


    }catch(error){

        console.error(error);

        alert(
            "Não foi possível fazer login."
        );

    }

}


/* ================================
   ESCAPAR HTML
================================ */

function escaparHTML(texto){

    return String(texto || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
