<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UnderFy - Streaming</title>
<style>
*{box-sizing:border-box; margin:0; padding:0; font-family:sans-serif;}
body{background:#0b0b0b; color:#fff; padding-bottom:120px;}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 30px;
    background:#121212;
    border-bottom:1px solid #222;
}

header h1{font-size:22px; color:#1ed760; letter-spacing:1px;}
.btn-adm{
    background:#222;
    color:#fff;
    padding:8px 16px;
    border-radius:8px;
    text-decoration:none;
    font-size:13px;
    font-weight:bold;
    border:1px solid #333;
}
.btn-adm:hover{background:#333;}

.container{padding:30px;}

h2.section-title{
    font-size:18px;
    margin-bottom:15px;
    color:#fff;
    font-weight:bold;
}

.carousel{
    display:flex;
    gap:20px;
    overflow-x:auto;
    padding-bottom:15px;
    scroll-behavior: smooth;
}

.carousel::-webkit-scrollbar{height:6px;}
.carousel::-webkit-scrollbar-thumb{background:#333; border-radius:3px;}

.card{
    min-width:160px;
    max-width:160px;
    background:#161616;
    padding:12px;
    border-radius:12px;
    border:1px solid #222;
    cursor:pointer;
    transition:.2s;
    flex-shrink:0;
}
.card:hover{background:#202020; border-color:#333;}

.card img{
    width:100%;
    height:135px;
    object-fit:cover;
    border-radius:8px;
    margin-bottom:10px;
}

.card.artista img{
    height:135px;
    border-radius:50%;
}

.card-title{
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:4px;
}

.card-sub{
    font-size:12px;
    color:#888;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* Player fixo embaixo */
.player{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#181818;
    border-top:1px solid #282828;
    padding:15px 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:900;
}

.player-info{display:flex; align-items:center; gap:15px; width:30%;}
.player-info img{width:50px; height:50px; border-radius:6px; object-fit:cover;}
.player-meta .p-title{font-size:14px; font-weight:bold;}
.player-meta .p-artist{font-size:12px; color:#888;}

.player-controls{display:flex; flex-direction:column; align-items:center; width:40%; gap:8px;}
audio{width:100%; outline:none;}
</style>
</head>
<body>

<header>
    <h1>UnderFy</h1>
    <a href="upload.html" class="btn-adm">Painel ADM</a>
</header>

<div class="container">
    <!-- Secao Projetos / Albuns -->
    <h2 class="section-title">Projetos e Albuns</h2>
    <div id="carrosselProjetos" class="carousel">
        <p style="color:#777; font-size:14px;">Carregando projetos...</p>
    </div>

    <!-- Secao Artistas -->
    <h2 class="section-title" style="margin-top:35px;">Artistas</h2>
    <div id="carrosselArtistas" class="carousel">
        <p style="color:#777; font-size:14px;">Carregando artistas...</p>
    </div>

    <!-- Secao Guias / Musicas -->
    <h2 class="section-title" style="margin-top:35px;">Guias Recentes</h2>
    <div id="carrosselMusicas" class="carousel">
        <p style="color:#777; font-size:14px;">Carregando musicas...</p>
    </div>
</div>

<div class="player">
    <div class="player-info">
        <img id="playerCapa" src="https://via.placeholder.com/50" alt="">
        <div class="player-meta">
            <div class="p-title" id="playerTitulo">Selecione uma guia</div>
            <div class="p-artist" id="playerArtista">-</div>
        </div>
    </div>
    <div class="player-controls">
        <audio id="audioElement" controls></audio>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://gnibzbnypirjrcaoibkx.supabase.co";
const SUPABASE_KEY = "sb_publishable_b9yvSbmWOLVJvq4AB4CLmQ_VRuzpG5T";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.addEventListener("DOMContentLoaded", () => {
    carregarHome();
});

async function carregarHome(){
    await carregarProjetos();
    await carregarArtistas();
    await carregarMusicas();
}

async function carregarProjetos(){
    const container = document.getElementById("carrosselProjetos");
    const { data, error } = await supabaseClient.from("projetos").select("*").order("id", { ascending: false });

    if(error || !data || data.length === 0){
        container.innerHTML = '<p style="color:#777; font-size:14px;">Nenhum projeto cadastrado.</p>';
        return;
    }

    container.innerHTML = data.map(p => `
        <div class="card">
            <img src="${p.capa_url || 'https://via.placeholder.com/150'}" alt="">
            <div class="card-title">${p.nome}</div>
            <div class="card-sub">${p.descricao || 'Album'}</div>
        </div>
    `).join("");
}

async function carregarArtistas(){
    const container = document.getElementById("carrosselArtistas");
    const { data, error } = await supabaseClient.from("artistas").select("*").order("nome");

    if(error || !data || data.length === 0){
        container.innerHTML = '<p style="color:#777; font-size:14px;">Nenhum artista cadastrado.</p>';
        return;
    }

    container.innerHTML = data.map(a => `
        <div class="card artista" style="text-align:center;">
            <img src="${a.foto_url || 'https://via.placeholder.com/150'}" alt="">
            <div class="card-title" style="margin-top:8px;">${a.nome}</div>
            <div class="card-sub">Artista</div>
        </div>
    `).join("");
}

async function carregarMusicas(){
    const container = document.getElementById("carrosselMusicas");
    const { data, error } = await supabaseClient.from("musicas").select("*, musica_artistas(artistas(nome))").order("id", { ascending: false });

    if(error || !data || data.length === 0){
        container.innerHTML = '<p style="color:#777; font-size:14px;">Nenhuma guia cadastrada.</p>';
        return;
    }

    container.innerHTML = data.map(m => {
        let nomeArtista = "Desconhecido";
        if(m.musica_artistas && m.musica_artistas.length > 0 && m.musica_artistas[0].artistas){
            nomeArtista = m.musica_artistas[0].artistas.nome;
        }

        return `
            <div class="card" onclick="tocarMusica('${m.audio_url}', '${m.nome}', '${nomeArtista}', '${m.capa_url}')">
                <img src="${m.capa_url || 'https://via.placeholder.com/150'}" alt="">
                <div class="card-title">${m.nome}</div>
                <div class="card-sub">${nomeArtista}</div>
            </div>
        `;
    }).join("");
}

function tocarMusica(url, titulo, artista, capa){
    const audio = document.getElementById("audioElement");
    document.getElementById("playerTitulo").textContent = titulo;
    document.getElementById("playerArtista").textContent = artista;
    document.getElementById("playerCapa").src = capa;
    audio.src = url;
    audio.play();
}
</script>

</body>
</html>
