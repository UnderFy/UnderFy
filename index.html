<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnderFy - Plataforma & Player</title>
    <!-- Supabase JS Client library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: #fff;
            padding-bottom: 80px;
            user-select: none;
            overflow-x: hidden;
        }

        header {
            padding: 20px 16px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .stories-container {
            display: flex;
            gap: 12px;
            padding: 10px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .stories-container::-webkit-scrollbar {
            display: none;
        }

        .story-ring {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .story-avatar-wrapper {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            padding: 2.5px;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .story-ring.unseen .story-avatar-wrapper {
            background: linear-gradient(45deg, #1ed760, #00b0ff);
        }

        .story-ring.add-story .story-avatar-wrapper {
            background: #222;
            border: 1px solid #333;
        }

        .story-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #000;
            background: #111;
        }

        .story-username {
            font-size: 11px;
            color: #ccc;
            max-width: 68px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
        }

        .content-section {
            padding: 16px;
        }

        .content-section h2 {
            font-size: 18px;
            margin-bottom: 12px;
        }

        .card-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .card {
            background: #121212;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .card:hover {
            background: #282828;
        }

        .card img {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 6px;
            object-fit: cover;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-subtitle {
            font-size: 12px;
            color: #aaa;
            margin-top: 2px;
        }

        /* MODAIS E NAVEGAÇÃO */
        .story-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 100;
            display: none;
            flex-direction: column;
        }

        .story-modal.active { display: flex; }

        .story-progress-bar {
            position: absolute;
            top: 12px; left: 10px; right: 10px;
            display: flex; gap: 4px; z-index: 102;
        }

        .progress-segment {
            flex: 1; height: 2.5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px; overflow: hidden;
        }

        .progress-fill { height: 100%; width: 0%; background: #fff; }

        .story-header-info {
            position: absolute;
            top: 24px; left: 12px; right: 12px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 102;
        }

        .story-user-details { display: flex; align-items: center; gap: 8px; }
        .story-user-details img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .story-user-details span { font-size: 13px; font-weight: 600; }

        .close-story-btn {
            background: none; border: none; color: #fff;
            font-size: 24px; cursor: pointer; padding: 4px 8px;
        }

        .story-content-view {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: #000; position: relative;
        }

        .story-content-view img, .story-content-view video {
            max-width: 100%; max-height: 100%; object-fit: contain;
        }

        .story-touch-left, .story-touch-right {
            position: absolute; top: 0; bottom: 0; width: 35%; z-index: 101;
        }
        .story-touch-left { left: 0; }
        .story-touch-right { right: 0; }

        .create-story-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #121212; z-index: 110;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 20px; gap: 20px;
        }

        .create-story-modal.active { display: flex; }

        .upload-box {
            border: 2px dashed #333; border-radius: 12px;
            width: 100%; max-width: 320px; height: 300px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 12px; cursor: pointer; color: #aaa;
        }

        .btn-primary {
            background: #1ed760; color: #000; border: none;
            padding: 12px 24px; border-radius: 24px; font-weight: 700; cursor: pointer;
        }

        .btn-secondary {
            background: transparent; color: #fff; border: 1px solid #444;
            padding: 10px 20px; border-radius: 24px; cursor: pointer;
        }

        nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 65px;
            background: rgba(16, 16, 16, 0.95); backdrop-filter: blur(15px);
            border-top: 1px solid #222; z-index: 40;
            display: flex; justify-content: space-around; align-items: center;
        }

        nav button {
            border: 0; background: none; color: #888; font-size: 11px;
            font-weight: 600; cursor: pointer; display: flex;
            flex-direction: column; align-items: center; gap: 4px; width: 25%;
        }

        nav button svg { width: 22px; height: 22px; fill: currentColor; }
        nav button.active { color: #1ed760; }
    </style>
</head>
<body>

    <header>
        <h1>UnderFy</h1>
    </header>

    <div class="stories-container" id="storiesContainer"></div>

    <main class="content-section" id="mainContent">
        <h2 id="sectionTitle">Carregando...</h2>
        <div class="card-list" id="cardList"></div>
    </main>

    <nav id="appNav">
        <button class="active" onclick="navegarAba(this, carregarProjetos)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Projetos</span>
        </button>
        <button onclick="navegarAba(this, carregarMusicas)">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            <span>Músicas</span>
        </button>
        <button onclick="navegarAba(this, carregarArtistas)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Artistas</span>
        </button>
        <button onclick="navegarAba(this, abrirModalCriarStory)">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <span>Publicar</span>
        </button>
    </nav>

    <!-- MODAL PLAYER STORY -->
    <div class="story-modal" id="storyPlayerModal">
        <div class="story-progress-bar" id="storyProgressBar"></div>
        <div class="story-header-info">
            <div class="story-user-details">
                <img id="storyUserAvatar" src="" alt="Avatar">
                <span id="storyUsername"></span>
            </div>
            <button class="close-story-btn" onclick="fecharStoryPlayer()">&times;</button>
        </div>
        <div class="story-content-view" id="storyContentView">
            <div class="story-touch-left" onclick="storyAnterior()"></div>
            <div class="story-touch-right" onclick="proximoStory()"></div>
        </div>
    </div>

    <!-- MODAL CRIAR STORY -->
    <div class="create-story-modal" id="createStoryModal">
        <h2>Criar novo Story</h2>
        <div class="upload-box" onclick="document.getElementById('storyFileInput').click()">
            <div id="uploadPlaceholder">
                <p style="font-size: 28px; text-align: center;">📷</p>
                <p style="font-size: 14px; margin-top: 8px;">Selecionar mídia</p>
            </div>
            <div id="uploadPreviewContainer" style="display: none; width: 100%; height: 100%; align-items: center; justify-content: center;"></div>
        </div>
        <input type="file" id="storyFileInput" accept="image/*,video/*" style="display: none;" onchange="handleFileSelect(event)">
        <div style="display: flex; gap: 10px;">
            <button class="btn-secondary" onclick="fecharCriarStory()">Cancelar</button>
            <button class="btn-primary" id="btnPublicarStory" onclick="publicarStorySupabase()" disabled style="opacity: 0.5;">Publicar</button>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO SUPABASE (Insira suas chaves aqui)
        const SUPABASE_URL = 'https://gnibzbnypirjrcaoibkx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_b9yvSbmWOLVJvq4AB4CLmQ_VRuzpG5T';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let storiesData = [];
        let activeUserIndex = 0;
        let activeItemIndex = 0;
        let storyAnimationFrame = null;
        let selectedFileForStory = null;

        window.addEventListener('DOMContentLoaded', () => {
            carregarStoriesSupabase();
            carregarProjetos();
        });

        // BUSCAR DADOS DO BANCO
        async function carregarStoriesSupabase() {
            try {
                // Exemplo de query na sua tabela 'stories' / 'artistas'
                const { data, error } = await _supabase
                    .from('stories')
                    .select('*, artistas(nome, avatar_url)');

                if (data && data.length > 0) {
                    storiesData = data;
                }
            } catch (err) {
                console.log('Aguardando conexão ativa do Supabase...');
            }
            renderStories();
        }

        async function carregarProjetos() {
            document.getElementById('sectionTitle').innerText = 'Projetos e Álbuns';
            const cardList = document.getElementById('cardList');
            cardList.innerHTML = '';

            const { data: projetos } = await _supabase.from('projetos').select('*');

            if (projetos && projetos.length > 0) {
                projetos.forEach(p => {
                    cardList.innerHTML += `
                        <div class="card">
                            <img src="${p.capa_url || 'https://picsum.photos/200'}" alt="${p.titulo}">
                            <div class="card-title">${p.titulo}</div>
                            <div class="card-subtitle">${p.artista_nome || 'WallStream'}</div>
                        </div>
                    `;
                });
            } else {
                cardList.innerHTML = `<p style="color: #888;">Nenhum projeto encontrado no banco de dados.</p>`;
            }
        }

        async function carregarMusicas() {
            document.getElementById('sectionTitle').innerText = 'Guias & Faixas';
            const cardList = document.getElementById('cardList');
            cardList.innerHTML = '';

            const { data: musicas } = await _supabase.from('musicas').select('*');

            if (musicas && musicas.length > 0) {
                musicas.forEach(m => {
                    cardList.innerHTML += `
                        <div class="card">
                            <img src="${m.capa_url || 'https://picsum.photos/200'}" alt="${m.titulo}">
                            <div class="card-title">${m.titulo}</div>
                            <div class="card-subtitle">Single</div>
                        </div>
                    `;
                });
            } else {
                cardList.innerHTML = `<p style="color: #888;">Nenhuma música cadastrada.</p>`;
            }
        }

        async function carregarArtistas() {
            document.getElementById('sectionTitle').innerText = 'Artistas Integrados';
            const cardList = document.getElementById('cardList');
            cardList.innerHTML = '';

            const { data: artistas } = await _supabase.from('artistas').select('*');

            if (artistas && artistas.length > 0) {
                artistas.forEach(a => {
                    cardList.innerHTML += `
                        <div class="card">
                            <img src="${a.avatar_url || 'https://picsum.photos/200'}" style="border-radius: 50%" alt="${a.nome}">
                            <div class="card-title">${a.nome}</div>
                            <div class="card-subtitle">Artista</div>
                        </div>
                    `;
                });
            } else {
                cardList.innerHTML = `<p style="color: #888;">Nenhum artista vinculado no banco.</p>`;
            }
        }

        // RENDERIZAÇÃO E INTERAÇÃO
        function renderStories() {
            const container = document.getElementById('storiesContainer');
            container.innerHTML = `
                <div class="story-ring add-story" onclick="abrirModalCriarStory()">
                    <div class="story-avatar-wrapper">
                        <img class="story-avatar" src="https://picsum.photos/100" alt="Novo Story">
                    </div>
                    <span class="story-username">+ Story</span>
                </div>
            `;

            storiesData.forEach((u, index) => {
                const ring = document.createElement('div');
                ring.className = 'story-ring unseen';
                ring.onclick = () => abrirStoryPlayer(index);
                ring.innerHTML = `
                    <div class="story-avatar-wrapper">
                        <img class="story-avatar" src="${u.artistas?.avatar_url || 'https://picsum.photos/100'}" alt="Avatar">
                    </div>
                    <span class="story-username">${u.artistas?.nome || 'Artista'}</span>
                `;
                container.appendChild(ring);
            });
        }

        async function publicarStorySupabase() {
            if (!selectedFileForStory) return;

            const file = selectedFileForStory;
            const fileName = `stories/${Date.now()}_${file.name}`;

            // 1. Upload da mídia no Supabase Storage
            const { data: storageData, error: storageErr } = await _supabase.storage
                .from('media')
                .upload(fileName, file);

            if (storageData) {
                const { data: urlData } = _supabase.storage.from('media').getPublicUrl(fileName);
                
                // 2. Registro na tabela 'stories'
                await _supabase.from('stories').insert([
                    { media_url: urlData.publicUrl, tipo: file.type.startsWith('video/') ? 'video' : 'image' }
                ]);

                fecharCriarStory();
                carregarStoriesSupabase();
            }
        }

        function abrirModalCriarStory() {
            document.getElementById('createStoryModal').classList.add('active');
        }

        function fecharCriarStory() {
            document.getElementById('createStoryModal').classList.remove('active');
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            selectedFileForStory = file;
            const btn = document.getElementById('btnPublicarStory');
            btn.disabled = false;
            btn.style.opacity = '1';
        }

        function navegarAba(btnElement, acao) {
            document.querySelectorAll("#appNav button").forEach(b => b.classList.remove("active"));
            if (btnElement) btnElement.classList.add("active");
            if (typeof acao === 'function') acao();
        }

        function abrirStoryPlayer(idx) {
            activeUserIndex = idx;
            document.getElementById('storyPlayerModal').classList.add('active');
        }

        function fecharStoryPlayer() {
            document.getElementById('storyPlayerModal').classList.remove('active');
        }
    </script>
</body>
</html>
