<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel ADM • UnderFy</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b0b0b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    padding:30px 20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:#151515;
    padding:30px;
    border-radius:20px;
    border:1px solid #222;
}

h1{
    font-size:24px;
    margin-bottom:20px;
    color:#1ed760;
}

h2{
    font-size:18px;
    margin:25px 0 15px;
    border-bottom:1px solid #222;
    padding-bottom:8px;
}

label{
    display:block;
    font-size:14px;
    color:#bbb;
    margin-bottom:6px;
}

input, select{
    width:100%;
    padding:12px;
    margin-bottom:18px;
    background:#202020;
    border:1px solid #333;
    color:#fff;
    border-radius:9px;
    outline:none;
    font:inherit;
}

input[type="file"] {
    padding: 9px;
    cursor: pointer;
}

input:focus, select:focus{
    border-color:#1ed760;
}

.checkbox-group {
    background: #202020;
    border: 1px solid #333;
    border-radius: 9px;
    padding: 12px;
    max-height: 150px;
    overflow-y: auto;
    margin-bottom: 18px;
}

.checkbox-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 14px;
    cursor: pointer;
}

.checkbox-item input {
    width: auto;
    margin: 0;
    cursor: pointer;
}

.btn{
    width:100%;
    padding:14px;
    background:#1ed760;
    color:#000;
    border:0;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
    font:inherit;
    transition: .2s;
}

.btn:hover{
    opacity: .9;
}

.back-link{
    display:inline-block;
    margin-top:20px;
    color:#888;
    text-decoration:none;
    font-size:14px;
}

.back-link:hover{
    color:#fff;
}

#loadingMsg {
    display: none;
    text-align: center;
    color: #1ed760;
    margin-bottom: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
    <a href="index.html" class="back-link">← Voltar para o site</a>
    
    <h1>Painel de Cadastro • UnderFy</h1>

    <!-- FORMULÁRIO DE ARTISTA -->
    <div id="formArtista">
        <h2>Cadastrar Novo Artista</h2>
        <label>Nome do Artista</label>
        <input type="text" id="nomeArtista" placeholder="Ex: Matuê">

        <label>Foto do Artista (Arquivo)</label>
        <input type="file" id="fotoArtistaFile" accept="image/*">

        <button class="btn" onclick="cadastrarArtista()">Cadastrar Artista</button>
    </div>

    <!-- FORMULÁRIO DE MÚSICA -->
    <div id="formMusica" style="margin-top: 40px;">
        <h2>Cadastrar Nova Guia</h2>
        <label>Nome da Música</label>
        <input type="text" id="nomeMusica" placeholder="Ex: Som de Camping #1">

        <label>Artistas Participantes (Selecione um ou mais para Feat)</label>
        <div class="checkbox-group" id="listaArtistasCheckbox">
            <span style="color:#888;font-size:13px;">Carregando artistas...</span>
        </div>

        <label>Capa da Guia (Imagem)</label>
        <input type="file" id="capaMusicaFile" accept="image/*">

        <label>Arquivo de Áudio (.mp3 / WAV)</label>
        <input type="file" id="audioMusicaFile" accept="audio/*">

        <div id="loadingMsg">Enviando arquivos e salvando... Aguarde ⏳</div>

        <button class="btn" onclick="cadastrarMusica()">Salvar Guia</button>
    </div>
</div>

<!-- SUPABASE SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://gnibzbnypirjrcaoibkx.supabase.co";
const SUPABASE_KEY = "sb_publishable_b9yvSbmWOLVJvq4AB4CLmQ_VRuzpG5T";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function checarAuth() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
        alert("Área restrita! Faça login no site principal primeiro.");
        window.location.href = "index.html";
    }
}

let artistasDisponiveis = [];

async function carregarArtistasParaSelecao() {
    await checarAuth();
    
    const { data, error } = await supabaseClient
        .from('artistas')
        .select('*')
        .order('nome', { ascending: true });

    if (error) {
        console.error("Erro ao carregar artistas:", error);
        return;
    }

    artistasDisponiveis = data || [];
    const container = document.getElementById("listaArtistasCheckbox");
    container.innerHTML = "";

    if (artistasDisponiveis.length === 0) {
        container.innerHTML = `<span style="color:#888;font-size:13px;">Nenhum artista cadastrado ainda.</span>`;
        return;
    }

    artistasDisponiveis.forEach(artista => {
        container.innerHTML += `
            <label class="checkbox-item">
                <input type="checkbox" name="artistaCheck" value="${artista.id}">
                ${artista.nome}
            </label>
        `;
    });
}

document.addEventListener('DOMContentLoaded', carregarArtistasParaSelecao);

// Função de upload direcionada para o bucket correto
async function fazerUploadArquivo(file, nomeBucket) {
    if (!file) return '';
    const nomeUnico = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
    
    const { data, error } = await supabaseClient.storage
        .from(nomeBucket)
        .upload(nomeUnico, file);

    if (error) {
        throw new Error("Erro no upload para o bucket " + nomeBucket + ": " + error.message);
    }

    const { data: urlData } = supabaseClient.storage
        .from(nomeBucket)
        .getPublicUrl(nomeUnico);

    return urlData.publicUrl;
}

// Cadastrar Artista
async function cadastrarArtista() {
    const nome = document.getElementById("nomeArtista").value.trim();
    const fotoFile = document.getElementById("fotoArtistaFile").files[0];

    if (!nome) {
        alert("Preencha o nome do artista.");
        return;
    }

    try {
        let foto_url = '';
        if (fotoFile) {
            foto_url = await fazerUploadArquivo(fotoFile, 'fotos-artistas');
        }

        const { error } = await supabaseClient
            .from('artistas')
            .insert([{ nome, foto_url }]);

        if (error) throw error;

        alert("Artista cadastrado com sucesso!");
        document.getElementById("nomeArtista").value = "";
        document.getElementById("fotoArtistaFile").value = "";
        carregarArtistasParaSelecao();
    } catch (err) {
        alert("Erro: " + err.message);
    }
}

// Cadastrar Música com Upload de Arquivo e Feats
async function cadastrarMusica() {
    const nome = document.getElementById("nomeMusica").value.trim();
    const capaFile = document.getElementById("capaMusicaFile").files[0];
    const audioFile = document.getElementById("audioMusicaFile").files[0];

    const checkboxesSelecionados = document.querySelectorAll('input[name="artistaCheck"]:checked');
    const artistasIds = Array.from(checkboxesSelecionados).map(cb => cb.value);

    if (!nome || artistasIds.length === 0) {
        alert("Preencha o nome da música e selecione pelo menos um artista.");
        return;
    }

    const loadingMsg = document.getElementById("loadingMsg");
    loadingMsg.style.display = "block";

    try {
        let capa_url = '';
        let audio_url = '';

        if (capaFile) {
            capa_url = await fazerUploadArquivo(capaFile, 'capas-musicas');
        }
        if (audioFile) {
            audio_url = await fazerUploadArquivo(audioFile, 'audios');
        }

        // 1. Insere a música
        const { data: musicaData, error: musicaError } = await supabaseClient
            .from('musicas')
            .insert([{ nome, capa_url, audio_url, plays: 0 }])
            .select()
            .single();

        if (musicaError) throw musicaError;

        const musicaId = musicaData.id;

        // 2. Insere as relações na tabela de feats (`musica_artistas`)
        const relacoesParaInserir = artistasIds.map(artistaId => ({
            musica_id: musicaId,
            artista_id: artistaId
        }));

        const { error: relError } = await supabaseClient
            .from('musica_artistas')
            .insert(relacoesParaInserir);

        if (relError) throw relError;

        alert("Guia cadastrada com sucesso!");
        
        document.getElementById("nomeMusica").value = "";
        document.getElementById("capaMusicaFile").value = "";
        document.getElementById("audioMusicaFile").value = "";
        checkboxesSelecionados.forEach(cb => cb.checked = false);

    } catch (err) {
        alert("Erro ao cadastrar guia: " + err.message);
    } finally {
        loadingMsg.style.display = "none";
    }
}
</script>

</body>
</html>
