<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel ADM • UnderFy</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b0b0b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    padding:30px 20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:#151515;
    padding:30px;
    border-radius:20px;
    border:1px solid #222;
}

h1{
    font-size:24px;
    margin-bottom:20px;
    color:#1ed760;
}

h2{
    font-size:18px;
    margin:25px 0 15px;
    border-bottom:1px solid #222;
    padding-bottom:8px;
}

label{
    display:block;
    font-size:14px;
    color:#bbb;
    margin-bottom:6px;
}

input, select{
    width:100%;
    padding:12px;
    margin-bottom:18px;
    background:#202020;
    border:1px solid #333;
    color:#fff;
    border-radius:9px;
    outline:none;
    font:inherit;
}

input:focus, select:focus{
    border-color:#1ed760;
}

/* LISTA DE CHECKBOXES PARA OS FEATS */
.checkbox-group {
    background: #202020;
    border: 1px solid #333;
    border-radius: 9px;
    padding: 12px;
    max-height: 150px;
    overflow-y: auto;
    margin-bottom: 18px;
}

.checkbox-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 14px;
    cursor: pointer;
}

.checkbox-item input {
    width: auto;
    margin: 0;
    cursor: pointer;
}

.btn{
    width:100%;
    padding:14px;
    background:#1ed760;
    color:#000;
    border:0;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
    font:inherit;
    transition: .2s;
}

.btn:hover{
    opacity: .9;
}

.back-link{
    display:inline-block;
    margin-top:20px;
    color:#888;
    text-decoration:none;
    font-size:14px;
}

.back-link:hover{
    color:#fff;
}
</style>
</head>

<body>

<div class="container">
    <a href="index.html" class="back-link">← Voltar para o site</a>
    
    <h1>Painel de Cadastro • UnderFy</h1>

    <!-- FORMULÁRIO DE ARTISTA -->
    <div id="formArtista">
        <h2>Cadastrar Novo Artista</h2>
        <label>Nome do Artista</label>
        <input type="text" id="nomeArtista" placeholder="Ex: Matuê">

        <label>Link da Foto (URL)</label>
        <input type="text" id="fotoArtista" placeholder="https://exemplo.com/foto.jpg">

        <button class="btn" onclick="cadastrarArtista()">Cadastrar Artista</button>
    </div>

    <!-- FORMULÁRIO DE MÚSICA -->
    <div id="formMusica" style="margin-top: 40px;">
        <h2>Cadastrar Nova Guia</h2>
        <label>Nome da Música</label>
        <input type="text" id="nomeMusica" placeholder="Ex: Som de Camping #1">

        <label>Artistas Participantes (Selecione um ou mais para Feat)</label>
        <div class="checkbox-group" id="listaArtistasCheckbox">
            <!-- Os artistas serão injetados aqui via JS -->
            <span style="color:#888;font-size:13px;">Carregando artistas...</span>
        </div>

        <label>Link da Capa (URL)</label>
        <input type="text" id="capaMusica" placeholder="https://exemplo.com/capa.jpg">

        <label>Link do Áudio (.mp3 / URL Direta)</label>
        <input type="text" id="audioMusica" placeholder="https://exemplo.com/audio.mp3">

        <button class="btn" onclick="cadastrarMusica()">Salvar Guia</button>
    </div>
</div>

<!-- SUPABASE SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://gnibzbnypirjrcaoibkx.supabase.co";
const SUPABASE_KEY = "sb_publishable_b9yvSbmWOLVJvq4AB4CLmQ_VRuzpG5T";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// Verifica se o admin está logado ao abrir a página
async function checarAuth() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
        alert("Área restrita! Faça login no site principal primeiro.");
        window.location.href = "index.html";
    }
}

let artistasDisponiveis = [];

async function carregarArtistasParaSelecao() {
    await checarAuth();
    
    const { data, error } = await supabaseClient
        .from('artistas')
        .select('*')
        .order('nome', { ascending: true });

    if (error) {
        console.error("Erro ao carregar artistas:", error);
        return;
    }

    artistasDisponiveis = data || [];
    const container = document.getElementById("listaArtistasCheckbox");
    container.innerHTML = "";

    if (artistasDisponiveis.length === 0) {
        container.innerHTML = `<span style="color:#888;font-size:13px;">Nenhum artista cadastrado ainda. Cadastre um acima primeiro.</span>`;
        return;
    }

    artistasDisponiveis.forEach(artista => {
        container.innerHTML += `
            <label class="checkbox-item">
                <input type="checkbox" name="artistaCheck" value="${artista.id}">
                ${artista.nome}
            </label>
        `;
    });
}

document.addEventListener('DOMContentLoaded', carregarArtistasParaSelecao);

// Cadastrar Artista
async function cadastrarArtista() {
    const nome = document.getElementById("nomeArtista").value.trim();
    const foto_url = document.getElementById("fotoArtista").value.trim();

    if (!nome) {
        alert("Preencha o nome do artista.");
        return;
    }

    const { error } = await supabaseClient
        .from('artistas')
        .insert([{ nome, foto_url }]);

    if (error) {
        alert("Erro ao cadastrar artista: " + error.message);
        return;
    }

    alert("Artista cadastrado com sucesso!");
    document.getElementById("nomeArtista").value = "";
    document.getElementById("fotoArtista").value = "";
    carregarArtistasParaSelecao(); // Atualiza a lista de checkboxes
}

// Cadastrar Música com Feat (Múltiplos Artistas)
async function cadastrarMusica() {
    const nome = document.getElementById("nomeMusica").value.trim();
    const capa_url = document.getElementById("capaMusica").value.trim();
    const audio_url = document.getElementById("audioMusica").value.trim();

    // Pega todos os checkboxes marcados
    const checkboxesSelecionados = document.querySelectorAll('input[name="artistaCheck"]:checked');
    const artistasIds = Array.from(checkboxesSelecionados).map(cb => cb.value);

    if (!nome || artistasIds.length === 0) {
        alert("Preencha o nome da música e selecione pelo menos um artista.");
        return;
    }

    // 1. Insere a música na tabela principal
    const { data: musicaData, error: musicaError } = await supabaseClient
        .from('musicas')
        .insert([{ nome, capa_url, audio_url, plays: 0 }])
        .select()
        .single();

    if (musicaError) {
        alert("Erro ao salvar música: " + musicaError.message);
        return;
    }

    const musicaId = musicaData.id;

    // 2. Insere as relações na tabela `musica_artistas` para cada artista selecionado
    const relacoesParaInserir = artistasIds.map(artistaId => ({
        musica_id: musicaId,
        artista_id: artistaId
    }));

    const { error: relError } = await supabaseClient
        .from('musica_artistas')
        .insert(relacoesParaInserir);

    if (relError) {
        alert("Erro ao associar os artistas à música: " + relError.message);
        return;
    }

    alert("Guia cadastrada com sucesso com todos os feats!");
    
    // Limpa o formulário
    document.getElementById("nomeMusica").value = "";
    document.getElementById("capaMusica").value = "";
    document.getElementById("audioMusica").value = "";
    checkboxesSelecionados.forEach(cb => cb.checked = false);
}
</script>

</body>
</html>
