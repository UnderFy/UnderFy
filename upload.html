<style>

*{

body{

.container{

h2{

}

label{
    display:block;

}

.checkbox-group{

    background:#202020;
    border:1px solid #333;

    border-radius:9px;

    padding:12px;

    max-height:150px;

    overflow-y:auto;

    margin-bottom:18px;

.checkbox-item{

    gap:10px;

}

.checkbox-item input{

    width:auto;

    margin:0;

    cursor:pointer;
}

.btn{

    width:100%;

    padding:14px;

    background:#1ed760;

    color:#000;

    border:0;

    border-radius:25px;

    font-weight:bold;

    cursor:pointer;

    font:inherit;

    transition:.2s;
}

.btn:hover{
    opacity:.9;
}

.btn:disabled{

    opacity:.5;

    cursor:not-allowed;
}

.back-link{

    display:inline-block;

    margin-top:20px;

    color:#888;

    text-decoration:none;

    font-size:14px;
}

.back-link:hover{
    color:#fff;
}

#loadingMsg{

    display:none;

    text-align:center;

    color:#1ed760;

    margin-bottom:15px;

    font-weight:bold;
}

.status{

    display:none;

    padding:12px;

    border-radius:10px;

    margin-bottom:15px;

    font-size:14px;
}

.status.success{

    display:block;

    background:#12351f;

    color:#1ed760;
}

.status.error{

    display:block;

    background:#351414;

    color:#ff6666;
}

.separador{

    margin-top:40px;

    border-top:1px solid #222;

    padding-top:25px;
}

.lista-vazia{

    text-align:center;

    color:#888;

    padding:25px 10px;

    background:#202020;

    border-radius:12px;
}

.guia-item{

    background:#202020;

    border:1px solid #303030;

    border-radius:14px;

    padding:12px;

    margin-bottom:12px;

    display:flex;

    align-items:center;

    gap:12px;
}

.guia-capa{

    width:60px;

    height:60px;

    object-fit:cover;

    border-radius:10px;

    flex-shrink:0;

    background:#292929;
}

.guia-info{

    flex:1;

}

.guia-nome{

    display:block;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.guia-plays{

    display:block;

    color:#888;

    font-size:12px;

}

.btn-excluir{

    background:#e63946;

    border:0;

    padding:10px 14px;

    border-radius:20px;

    font-weight:bold;

}

.btn-excluir:hover{

}

@media(max-width:500px){

    }

    }

</style>

<!-- =========================

========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://gnibzbnypirjrcaoibkx.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_b9yvSbmWOLVJvq4AB4CLmQ_VRuzpG5T";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   VARIÁVEIS
========================= */

let artistasDisponiveis = [];


/* =========================
   STATUS
========================= */

function mostrarStatus(
    mensagem,
    tipo
){

    const status =
        document.getElementById(
            "status"
        );


    if(!status){
        return;
    }


    status.textContent =
        mensagem;


    status.className =
        "status " + tipo;


    setTimeout(
        function(){

            status.className =
                "status";

            status.textContent =
                "";

        },
        5000
    );

}


/* =========================
   AUTENTICAÇÃO
========================= */

async function checarAuth(){

    try{

        const {
            data,
            error
        } =
            await supabaseClient
            .auth
            .getSession();


        if(error){

            console.error(
                "Erro de autenticação:",
                error
            );

            return false;

        }


        if(!data.session){

            alert(
                "Área restrita! Faça login no site principal primeiro."
            );


            window.location.href =
                "index.html";


            return false;

        }


        return true;


    }catch(error){

        console.error(
            "Erro ao verificar login:",
            error
        );


        return false;

    }

}


/* =========================
   UPLOAD DE ARQUIVO
========================= */

async function fazerUploadArquivo(
    file,
    nomeBucket
){

    if(!file){

        return "";

    }


    const nomeSeguro =
        file.name
        .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );


    const nomeUnico =
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,8) +
        "_" +
        nomeSeguro;


    const {
        data,
        error
    } =
        await supabaseClient
        .storage
        .from(nomeBucket)
        .upload(
            nomeUnico,
            file
        );


    if(error){

        throw new Error(
            "Erro no upload para o bucket " +
            nomeBucket +
            ": " +
            error.message
        );

    }


    const {
        data: urlData
    } =
        supabaseClient
        .storage
        .from(nomeBucket)
        .getPublicUrl(
            nomeUnico
        );


    return urlData.publicUrl;

}

/* =========================
   CARREGAR ARTISTAS
   PARA SELEÇÃO DAS GUIAS
========================= */

async function carregarArtistasParaSelecao(){

    const container =
        document.getElementById(
            "listaArtistasCheckbox"
        );


    if(!container){
        return;
    }


    container.innerHTML = `
        <span style="color:#888;font-size:13px;">
            Carregando artistas...
        </span>
    `;


    try{

        const {
            data,
            error
        } =
            await supabaseClient
            .from("artistas")
            .select("id,nome")
            .order(
                "nome",
                {
                    ascending:true
                }
            );


        if(error){

            throw error;

        }


        artistasDisponiveis =
            data || [];


        container.innerHTML = "";


        if(
            artistasDisponiveis.length === 0
        ){

            container.innerHTML = `
                <span style="color:#888;font-size:13px;">
                    Nenhum artista cadastrado ainda.
                </span>
            `;

            return;

        }


        artistasDisponiveis.forEach(
            function(artista){

                const label =
                    document.createElement(
                        "label"
                    );


                label.className =
                    "checkbox-item";


                const checkbox =
                    document.createElement(
                        "input"
                    );


                checkbox.type =
                    "checkbox";


                checkbox.name =
                    "artistaCheck";


                checkbox.value =
                    artista.id;


                label.appendChild(
                    checkbox
                );


                label.appendChild(
                    document.createTextNode(
                        " " + artista.nome
                    )
                );


                container.appendChild(
                    label
                );

            }
        );


    }catch(error){

        console.error(
            "Erro ao carregar artistas:",
            error
        );


        container.innerHTML = `
            <span
                style="color:#ff5555;font-size:13px;"
            >
                Erro ao carregar artistas.
            </span>
        `;

    }

}


/* =========================
   CADASTRAR ARTISTA
========================= */

async function cadastrarArtista(){

    const nome =
        document
        .getElementById(
            "nomeArtista"
        )
        .value
        .trim();


    const fotoFile =
        document
        .getElementById(
            "fotoArtistaFile"
        )
        .files[0];


    if(!nome){

        alert(
            "Preencha o nome do artista."
        );

        return;

    }


    try{

        let foto_url = "";


        if(fotoFile){

            foto_url =
                await fazerUploadArquivo(
                    fotoFile,
                    "fotos-artistas"
                );

        }


        const {
            error
        } =
            await supabaseClient
            .from("artistas")
            .insert([
                {
                    nome:
                        nome,

                    foto_url:
                        foto_url
                }
            ]);


        if(error){

            throw error;

        }


        mostrarStatus(
            "Artista cadastrado com sucesso!",
            "success"
        );


        document
        .getElementById(
            "nomeArtista"
        )
        .value = "";


        document
        .getElementById(
            "fotoArtistaFile"
        )
        .value = "";


        await carregarArtistasParaSelecao();

        await carregarArtistasADM();


    }catch(error){

        console.error(
            "Erro ao cadastrar artista:",
            error
        );


        mostrarStatus(
            "Erro ao cadastrar artista: " +
            error.message,
            "error"
        );

    }

}


/* =========================
   CADASTRAR GUIA
========================= */

async function cadastrarMusica(){

    const nome =
        document
        .getElementById(
            "nomeMusica"
        )
        .value
        .trim();


    const capaFile =
        document
        .getElementById(
            "capaMusicaFile"
        )
        .files[0];


    const audioFile =
        document
        .getElementById(
            "audioMusicaFile"
        )
        .files[0];


    const selecionados =
        document.querySelectorAll(
            'input[name="artistaCheck"]:checked'
        );


    const artistasIds =
        Array.from(
            selecionados
        ).map(
            function(checkbox){

                return checkbox.value;

            }
        );


    if(
        !nome ||
        artistasIds.length === 0
    ){

        alert(
            "Preencha o nome da música e selecione pelo menos um artista."
        );

        return;

    }


    const loadingMsg =
        document.getElementById(
            "loadingMsg"
        );


    const botao =
        document.getElementById(
            "btnSalvarGuia"
        );


    loadingMsg.style.display =
        "block";


    botao.disabled =
        true;


    try{

        let capa_url = "";

        let audio_url = "";


        /* CAPA */

        if(capaFile){

            capa_url =
                await fazerUploadArquivo(
                    capaFile,
                    "capas-musicas"
                );

        }


        /* ÁUDIO */

        if(audioFile){

            audio_url =
                await fazerUploadArquivo(
                    audioFile,
                    "audios"
                );

        }


        /* MÚSICA */

        const {
            data: musicaData,
            error: musicaError
        } =
            await supabaseClient
            .from("musicas")
            .insert([
                {
                    nome:
                        nome,

                    capa_url:
                        capa_url,

                    audio_url:
                        audio_url,

                    plays:
                        0
                }
            ])
            .select()
            .single();


        if(musicaError){

            throw musicaError;

        }


        /* RELAÇÕES */

        const relacoes =
            artistasIds.map(
                function(artistaId){

                    return {
                        musica_id:
                            musicaData.id,

                        artista_id:
                            artistaId
                    };

                }
            );


        const {
            error: relacaoError
        } =
            await supabaseClient
            .from("musica_artistas")
            .insert(
                relacoes
            );


        if(relacaoError){

            throw relacaoError;

        }


        mostrarStatus(
            "Guia cadastrada com sucesso!",
            "success"
        );


        document
        .getElementById(
            "nomeMusica"
        )
        .value = "";


        document
        .getElementById(
            "capaMusicaFile"
        )
        .value = "";


        document
        .getElementById(
            "audioMusicaFile"
        )
        .value = "";


        selecionados.forEach(
            function(checkbox){

                checkbox.checked =
                    false;

            }
        );


        await carregarGuiasADM();


    }catch(error){

        console.error(
            "Erro ao cadastrar guia:",
            error
        );


        mostrarStatus(
            "Erro ao cadastrar guia: " +
            error.message,
            "error"
        );


    }finally{

        loadingMsg.style.display =
            "none";


        botao.disabled =
            false;

    }

}

/* =========================
   CAMINHO DO ARQUIVO
   NO STORAGE
========================= */

function pegarCaminhoStorage(url){

    if(!url){
        return null;
    }

    try{

        const marcador =
            "/public/";

        const posicao =
            url.indexOf(
                marcador
            );


        if(posicao === -1){
            return null;
        }


        let caminho =
            url.substring(
                posicao +
                marcador.length
            );


        /*
         * O caminho vem como:
         *
         * bucket/arquivo.mp3
         *
         * Removemos o nome do bucket.
         */

        const partes =
            caminho.split("/");


        if(partes.length < 2){
            return null;
        }


        partes.shift();


        return partes.join("/");


    }catch(error){

        console.error(
            "Erro ao identificar arquivo:",
            error
        );


        return null;

    }

}


/* =========================
   EXCLUIR ARQUIVO DO STORAGE
========================= */

async function excluirArquivoStorage(
    url,
    bucket
){

    if(!url){
        return;
    }


    const caminho =
        pegarCaminhoStorage(
            url
        );


    if(!caminho){
        return;
    }


    try{

        const {
            error
        } =
            await supabaseClient
            .storage
            .from(bucket)
            .remove([
                caminho
            ]);


        if(error){

            console.error(
                "Erro ao apagar arquivo do Storage:",
                error
            );

        }

    }catch(error){

        console.error(
            "Erro no Storage:",
            error
        );

    }

}


/* =========================
   GERENCIAR GUIAS
========================= */

async function carregarGuiasADM(){

    const container =
        document.getElementById(
            "listaGuiasADM"
        );


    if(!container){
        return;
    }


    container.innerHTML = `
        <div class="lista-vazia">
            Carregando guias...
        </div>
    `;


    try{

        const {
            data,
            error
        } =
            await supabaseClient
            .from("musicas")
            .select(
                "id,nome,capa_url,audio_url,plays,created_at"
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            throw error;

        }


        if(
            !data ||
            data.length === 0
        ){

            container.innerHTML = `
                <div class="lista-vazia">
                    Nenhuma guia cadastrada.
                </div>
            `;

            return;

        }


        container.innerHTML = "";


        data.forEach(
            function(musica){

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "guia-item";


                const capa =
                    document.createElement(
                        "img"
                    );


                capa.className =
                    "guia-capa";


                capa.src =
                    musica.capa_url ||
                    "https://via.placeholder.com/100";


                capa.onerror =
                    function(){

                        this.src =
                            "https://via.placeholder.com/100";

                    };


                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "guia-info";


                const nome =
                    document.createElement(
                        "span"
                    );


                nome.className =
                    "guia-nome";


                nome.textContent =
                    musica.nome ||
                    "Sem nome";


                const plays =
                    document.createElement(
                        "span"
                    );


                plays.className =
                    "guia-plays";


                plays.textContent =
                    (
                        musica.plays || 0
                    ) +
                    " reproduções";


                info.appendChild(
                    nome
                );


                info.appendChild(
                    plays
                );


                const botao =
                    document.createElement(
                        "button"
                    );


                botao.className =
                    "btn-excluir";


                botao.textContent =
                    "🗑 Excluir";


                botao.onclick =
                    function(){

                        excluirGuia(
                            musica
                        );

                    };


                item.appendChild(
                    capa
                );


                item.appendChild(
                    info
                );


                item.appendChild(
                    botao
                );


                container.appendChild(
                    item
                );

            }
        );


    }catch(error){

        console.error(
            "Erro ao carregar guias:",
            error
        );


        container.innerHTML = `
            <div
                class="lista-vazia"
                style="color:#ff5555;"
            >
                Erro ao carregar guias:
                ${error.message}
            </div>
        `;

    }

}

========================= */

async function excluirGuia(

){

    const confirmar =

            musica.nome +
            "\"?\n\n" +
            "A guia e suas relações com os artistas serão removidas."
        );


    if(!confirmar){
        return;
    }


    try{

        /*
         * 1 — REMOVER RELAÇÕES
         */

        const {
            error:
                relacaoError
        } =
            await supabaseClient
            .from("musica_artistas")
            .delete()
            .eq(
                "musica_id",
                musica.id
            );


        if(relacaoError){

            throw relacaoError;

        }


        /*
         * 2 — REMOVER MÚSICA
         */

        const {
            error:
                musicaError
        } =
            await supabaseClient
            .from("musicas")
            .delete()
            .eq(
                "id",
                musica.id
            );

        }


        /*

         */

        await excluirArquivoStorage(

        );


        /*
         * 4 — REMOVER ÁUDIO
         */

        await excluirArquivoStorage(

        );

        );

        );


        mostrarStatus(
            "Erro ao excluir guia: " +
            error.message,
            "error"
        );

    }

}


/* =========================
   GERENCIAR ARTISTAS
========================= */

async function carregarArtistasADM(){

    const container =
        document.getElementById(
            "listaArtistasADM"
        );


    if(!container){
        return;
    }


    container.innerHTML = `
        <div class="lista-vazia">
            Carregando artistas...
        </div>
    `;


    try{

        const {
            data,
            error
        } =
            await supabaseClient
            .from("artistas")
            .select(
                "id,nome,foto_url"
            )
            .order(
                "nome",
                {
                    ascending:true
                }
            );


        if(error){

            throw error;

        }


        if(
            !data ||
            data.length === 0
        ){

            container.innerHTML = `
                <div class="lista-vazia">
                    Nenhum artista cadastrado.
                </div>
            `;

            return;

        }


        container.innerHTML = "";


        data.forEach(
            function(artista){

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "guia-item";


                const foto =
                    document.createElement(
                        "img"
                    );


                foto.className =
                    "guia-capa";


                foto.src =
                    artista.foto_url ||
                    "https://via.placeholder.com/100";


                foto.onerror =
                    function(){

                        this.src =
                            "https://via.placeholder.com/100";

                    };


                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "guia-info";


                const nome =
                    document.createElement(
                        "span"
                    );


                nome.className =
                    "guia-nome";


                nome.textContent =
                    artista.nome ||
                    "Sem nome";


                info.appendChild(
                    nome
                );


                const botao =
                    document.createElement(
                        "button"
                    );


                botao.className =
                    "btn-excluir";


                botao.textContent =
                    "🗑 Excluir";


                botao.onclick =
                    function(){

                        excluirArtista(
                            artista
                        );

                    };


                item.appendChild(
                    foto
                );


                item.appendChild(
                    info
                );


                item.appendChild(
                    botao
                );


                container.appendChild(
                    item
                );

            }
        );


    }catch(error){

        console.error(
            "Erro ao carregar artistas:",
            error
        );


        container.innerHTML = `
            <div
                class="lista-vazia"
                style="color:#ff5555;"
            >
                Erro ao carregar artistas:
                ${error.message}
            </div>
        `;

    }

}


/* =========================
   EXCLUIR ARTISTA
========================= */

async function excluirArtista(
    artista
){

    const confirmar =
        confirm(
            "Excluir o artista \"" +
            artista.nome +
            "\"?\n\n" +
            "Ele será removido das guias em que participa."
        );


    if(!confirmar){
        return;
    }


    try{

        /*
         * 1 — REMOVER RELAÇÕES
         */

        const {
            error:
                relacaoError
        } =
            await supabaseClient
            .from("musica_artistas")
            .delete()
            .eq(
                "artista_id",
                artista.id
            );


        if(relacaoError){

            throw relacaoError;

        }


        /*
         * 2 — REMOVER FOTO
         */

        await excluirArquivoStorage(
            artista.foto_url,
            "fotos-artistas"
        );


        /*
         * 3 — REMOVER ARTISTA
         */

        const {
            error:
                artistaError
        } =
            await supabaseClient
            .from("artistas")
            .delete()
            .eq(
                "id",
                artista.id
            );


        if(artistaError){

            throw artistaError;

        }


        mostrarStatus(
            "Artista excluído com sucesso!",
            "success"
        );


        /*
         * ATUALIZAR AS DUAS LISTAS
         */

        await carregarArtistasADM();

        await carregarArtistasParaSelecao();


    }catch(error){

        console.error(
            "Erro ao excluir artista:",
            error
        );


        mostrarStatus(
            "Erro ao excluir artista: " +
            error.message,
            "error"
        );

    }

}
