<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnderFy — Upload ADM</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #aaa;
            margin-bottom: 25px;
        }

        .card {
            background: #181818;
            padding: 22px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #ddd;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #242424;
            color: white;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #1ed760;
        }

        input[type="file"] {
            padding: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 25px;
            background: #1ed760;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        .btn-secundario {
            background: #292929;
            color: white;
            margin-top: 10px;
        }

        .btn-acao {
            width: auto;
            padding: 8px 14px;
            margin-top: 0;
            font-size: 14px;
            border-radius: 8px;
        }

        .btn-editar {
            background: #292929;
            color: white;
        }

        .btn-excluir {
            background: #421818;
            color: #ff7070;
        }

        .mensagem {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .sucesso {
            display: block;
            background: #123d24;
            color: #5cff91;
        }

        .erro {
            display: block;
            background: #421818;
            color: #ff7070;
        }

        .progresso {
            display: none;
            margin-top: 15px;
            color: #aaa;
            text-align: center;
        }

        .voltar {
            background: #292929;
            color: white;
        }

        /* Lista de Artistas ADM */
        .artista-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #202020;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            gap: 12px;
        }

        .artista-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .artista-info img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #333;
        }

        .artista-detalhes h4 {
            font-size: 15px;
            color: #fff;
        }

        .artista-detalhes p {
            font-size: 12px;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .artista-acoes {
            display: flex;
            gap: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>UnderFy ADM</h1>
    <p class="subtitulo">Gerenciamento de artistas e músicas</p>

    <!-- ARTISTA -->
    <div class="card">

        <h2 id="tituloCardArtista">👤 Adicionar artista</h2>

        <!-- Input escondido para controlar ID na edição -->
        <input type="hidden" id="artistaIdEdicao" value="">

        <label>Nome do artista</label>
        <input
            type="text"
            id="nomeArtista"
            placeholder="Ex: Novais MC"
        >

        <label>Biografia</label>
        <textarea
            id="bioArtista"
            rows="3"
            placeholder="Biografia do artista..."
        ></textarea>

        <label>Foto do artista</label>
        <input
            type="file"
            id="fotoArtista"
            accept="image/*"
        >

        <button id="btnCadastrarArtista" onclick="salvarArtista()">
            Cadastrar artista
        </button>

        <button id="btnCancelarEdicao" class="btn-secundario" style="display: none;" onclick="limparFormularioArtista()">
            Cancelar edição
        </button>

        <div id="mensagemArtista" class="mensagem"></div>

        <div id="progressoArtista" class="progresso">
            Salvando artista...
        </div>

    </div>

    <!-- LISTA DE ARTISTAS CADASTRADOS -->
    <div class="card">
        <h2>📋 Artistas cadastrados</h2>
        <div id="listaArtistasGerenciar">
            <p style="color: #777; font-size: 14px;">Carregando artistas...</p>
        </div>
    </div>


    <!-- MÚSICA -->
    <div class="card">

        <h2>🎵 Adicionar música</h2>

        <label>Nome da música</label>
        <input
            type="text"
            id="nomeMusica"
            placeholder="Ex: Sessão 01"
        >

        <label>Artista</label>
        <select id="artistaMusica">
            <option value="">Selecione um artista</option>
        </select>

        <label>Capa da música</label>
        <input
            type="file"
            id="capaMusica"
            accept="image/*"
        >

        <label>Arquivo de áudio</label>
        <input
            type="file"
            id="audioMusica"
            accept="audio/*"
        >

        <label>Descrição</label>
        <textarea
            id="descricaoMusica"
            rows="4"
            placeholder="Descrição da guia musical..."
        ></textarea>

        <button onclick="cadastrarMusica()">
            Publicar música
        </button>

        <div id="mensagemMusica" class="mensagem"></div>

        <div id="progressoMusica" class="progresso">
            Enviando arquivos...
        </div>

    </div>


    <button class="voltar" onclick="history.back()">
        ← Voltar
    </button>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO DO SUPABASE
   ===================================================== */

const SUPABASE_URL = "https://gnibzbnypirjrcaoibkx.supabase.co";
const SUPABASE_KEY = "sb_publishable_b9yvSbmWOLVJvq4AB4CLmQ_VRuzpG5T";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VERIFICAR LOGIN
   ===================================================== */

async function verificarLogin() {
    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
        alert("Você precisa estar logado como ADM.");
        window.location.href = "index.html";
        return false;
    }

    return true;
}


/* =====================================================
   CARREGAR ARTISTAS (SELECT E LISTA ADM)
   ===================================================== */

async function carregarArtistas() {
    const {
        data,
        error
    } = await supabaseClient
        .from("artistas")
        .select("*")
        .order("nome");

    if (error) {
        console.log(error);
        return;
    }

    // 1. Atualizar o <select> do card de músicas
    const select = document.getElementById("artistaMusica");
    select.innerHTML = '<option value="">Selecione um artista</option>';

    // 2. Atualizar a listagem de gerenciamento de artistas
    const listaDiv = document.getElementById("listaArtistasGerenciar");
    
    if (!data || data.length === 0) {
        listaDiv.innerHTML = '<p style="color: #777; font-size: 14px;">Nenhum artista cadastrado.</p>';
        return;
    }

    listaDiv.innerHTML = "";

    data.forEach(artista => {
        // Preencher select
        const option = document.createElement("option");
        option.value = artista.id;
        option.textContent = artista.nome;
        select.appendChild(option);

        // Preencher lista de gerenciamento
        const item = document.createElement("div");
        item.className = "artista-item";
        
        const fotoSrc = artista.foto_url || "https://via.placeholder.com/45";
        const bioTexto = artista.bio || "Sem biografia.";

        item.innerHTML = `
            <div class="artista-info">
                <img src="${fotoSrc}" alt="${artista.nome}">
                <div class="artista-detalhes">
                    <h4>${artista.nome}</h4>
                    <p>${bioTexto}</p>
                </div>
            </div>
            <div class="artista-acoes">
                <button class="btn-acao btn-editar" onclick="prepararEdicaoArtista('${artista.id}', '${encodeURIComponent(artista.nome)}', '${encodeURIComponent(artista.bio || '')}', '${artista.foto_url || ''}')">✏️</button>
                <button class="btn-acao btn-excluir" onclick="excluirArtista('${artista.id}')">🗑️</button>
            </div>
        `;
        listaDiv.appendChild(item);
    });
}


/* =====================================================
   GERAR NOME ÚNICO
   ===================================================== */

function gerarNomeArquivo(arquivo) {
    const extensao = arquivo.name.split(".").pop();
    return Date.now() + "-" +
        Math.random().toString(36).substring(2) +
        "." + extensao;
}


/* =====================================================
   CADASTRAR OU EDITAR ARTISTA
   ===================================================== */

async function salvarArtista() {
    const idEdicao = document.getElementById("artistaIdEdicao").value;
    const nome = document.getElementById("nomeArtista").value.trim();
    const bio = document.getElementById("bioArtista").value.trim();
    const arquivo = document.getElementById("fotoArtista").files[0];

    const mensagem = document.getElementById("mensagemArtista");
    const progresso = document.getElementById("progressoArtista");

    mensagem.className = "mensagem";
    mensagem.textContent = "";

    if (!nome) {
        mostrarErro(mensagem, "Digite o nome do artista.");
        return;
    }

    try {
        progresso.style.display = "block";
        let fotoURL = document.getElementById("artistaIdEdicao").dataset.fotoAtual || "";

        // Se uma nova foto foi enviada, faz o upload
        if (arquivo) {
            const nomeArquivo = gerarNomeArquivo(arquivo);
            const caminho = "artistas/" + nomeArquivo;

            const { error: uploadError } = await supabaseClient
                .storage
                .from("fotos-artistas")
                .upload(caminho, arquivo);

            if (uploadError) throw uploadError;

            const { data: urlData } = supabaseClient
                .storage
                .from("fotos-artistas")
                .getPublicUrl(caminho);

            fotoURL = urlData.publicUrl;
        }

        if (idEdicao) {
            // ATUALIZAR ARTISTA EXISTENTE
            const { error: bancoError } = await supabaseClient
                .from("artistas")
                .update({
                    nome: nome,
                    bio: bio,
                    foto_url: fotoURL
                })
                .eq("id", idEdicao);

            if (bancoError) throw bancoError;

            mostrarSucesso(mensagem, "✅ Artista atualizado com sucesso!");
        } else {
            // CADASTRAR NOVO ARTISTA
            if (!arquivo) {
                mostrarErro(mensagem, "Escolha uma foto para o novo artista.");
                progresso.style.display = "none";
                return;
            }

            const { error: bancoError } = await supabaseClient
                .from("artistas")
                .insert({
                    nome: nome,
                    bio: bio,
                    foto_url: fotoURL
                });

            if (bancoError) throw bancoError;

            mostrarSucesso(mensagem, "✅ Artista cadastrado com sucesso!");
        }

        limparFormularioArtista();
        carregarArtistas();

    } catch (erro) {
        console.error(erro);
        mostrarErro(mensagem, "Erro: " + erro.message);
    } finally {
        progresso.style.display = "none";
    }
}


/* =====================================================
   PREPARAR EDIÇÃO DE ARTISTA
   ===================================================== */

function prepararEdicaoArtista(id, nomeEncoded, bioEncoded, fotoUrl) {
    const nome = decodeURIComponent(nomeEncoded);
    const bio = decodeURIComponent(bioEncoded);

    document.getElementById("artistaIdEdicao").value = id;
    document.getElementById("artistaIdEdicao").dataset.fotoAtual = fotoUrl;
    document.getElementById("nomeArtista").value = nome;
    document.getElementById("bioArtista").value = bio === "null" ? "" : bio;

    document.getElementById("tituloCardArtista").textContent = "✏️ Editar artista";
    document.getElementById("btnCadastrarArtista").textContent = "Salvar alterações";
    document.getElementById("btnCancelarEdicao").style.display = "block";

    window.scrollTo({ top: 0, behavior: 'smooth' });
}


/* =====================================================
   LIMPAR FORMULÁRIO DE ARTISTA
   ===================================================== */

function limparFormularioArtista() {
    document.getElementById("artistaIdEdicao").value = "";
    document.getElementById("artistaIdEdicao").dataset.fotoAtual = "";
    document.getElementById("nomeArtista").value = "";
    document.getElementById("bioArtista").value = "";
    document.getElementById("fotoArtista").value = "";

    document.getElementById("tituloCardArtista").textContent = "👤 Adicionar artista";
    document.getElementById("btnCadastrarArtista").textContent = "Cadastrar artista";
    document.getElementById("btnCancelarEdicao").style.display = "none";
}


/* =====================================================
   EXCLUIR ARTISTA
   ===================================================== */

async function excluirArtista(id) {
    if (!confirm("Tem certeza que deseja excluir este artista?")) return;

    const { error } = await supabaseClient
        .from("artistas")
        .delete()
        .eq("id", id);

    if (error) {
        alert("Erro ao excluir: " + error.message);
        return;
    }

    carregarArtistas();
}


/* =====================================================
   CADASTRAR MÚSICA (Mantido do seu original)
   ===================================================== */

async function cadastrarMusica() {
    const nome = document.getElementById("nomeMusica").value.trim();
    const artista = document.getElementById("artistaMusica").value;
    const capa = document.getElementById("capaMusica").files[0];
    const audio = document.getElementById("audioMusica").files[0];
    const descricao = document.getElementById("descricaoMusica").value.trim();

    const mensagem = document.getElementById("mensagemMusica");
    const progresso = document.getElementById("progressoMusica");

    mensagem.className = "mensagem";
    mensagem.textContent = "";

    if (!nome) { mostrarErro(mensagem, "Digite o nome da música."); return; }
    if (!artista) { mostrarErro(mensagem, "Selecione um artista."); return; }
    if (!capa) { mostrarErro(mensagem, "Escolha a capa da música."); return; }
    if (!audio) { mostrarErro(mensagem, "Escolha o arquivo de áudio."); return; }

    try {
        progresso.style.display = "block";

        // UPLOAD DA CAPA
        const nomeCapa = gerarNomeArquivo(capa);
        const caminhoCapa = "capas/" + nomeCapa;
        const { error: erroCapa } = await supabaseClient.storage.from("capas-musicas").upload(caminhoCapa, capa);
        if (erroCapa) throw erroCapa;

        const { data: capaURLData } = supabaseClient.storage.from("capas-musicas").getPublicUrl(caminhoCapa);
        const capaURL = capaURLData.publicUrl;

        // UPLOAD DO ÁUDIO
        const nomeAudio = gerarNomeArquivo(audio);
        const caminhoAudio = "musicas/" + nomeAudio;
        const { error: erroAudio } = await supabaseClient.storage.from("audios").upload(caminhoAudio, audio);
        if (erroAudio) throw erroAudio;

        const { data: audioURLData } = supabaseClient.storage.from("audios").getPublicUrl(caminhoAudio);
        const audioURL = audioURLData.publicUrl;

        // SALVAR MÚSICA
        const { error: bancoError } = await supabaseClient.from("musicas").insert({
            nome: nome,
            artista_id: artista,
            capa_url: capaURL,
            audio_url: audioURL,
            descricao: descricao
        });

        if (bancoError) throw bancoError;

        mostrarSucesso(mensagem, "🎵 Música publicada com sucesso!");

        document.getElementById("nomeMusica").value = "";
        document.getElementById("artistaMusica").value = "";
        document.getElementById("capaMusica").value = "";
        document.getElementById("audioMusica").value = "";
        document.getElementById("descricaoMusica").value = "";

    } catch (erro) {
        console.error(erro);
        mostrarErro(mensagem, "Erro: " + erro.message);
    } finally {
        progresso.style.display = "none";
    }
}


/* =====================================================
   MENSAGENS
   ===================================================== */

function mostrarSucesso(elemento, texto) {
    elemento.textContent = texto;
    elemento.className = "mensagem sucesso";
}

function mostrarErro(elemento, texto) {
    elemento.textContent = texto;
    elemento.className = "mensagem erro";
}


/* =====================================================
   INICIALIZAÇÃO
   ===================================================== */

(async function() {
    const logado = await verificarLogin();
    if (!logado) return;

    await carregarArtistas();
})();

</script>

</body>
</html>
