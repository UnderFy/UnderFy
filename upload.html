<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UnderFy - Cadastros e Gerenciamento</title>
<style>
*{box-sizing:border-box; margin:0; padding:0; font-family:sans-serif;}
body{background:#0b0b0b; color:#fff; padding:20px;}

.upload-container{
    max-width:800px;
    margin:40px auto;
    background:#151515;
    border:1px solid #252525;
    border-radius:18px;
    padding:30px;
}

h1{font-size:24px; margin-bottom:8px; color:#fff;}
p.sub{color:#777; font-size:14px; margin-bottom:25px;}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    font-size:13px;
    color:#aaa;
    margin-bottom:8px;
    font-weight:bold;
}

input[type="text"], select{
    width:100%;
    background:#202020;
    border:1px solid #333;
    color:#fff;
    padding:12px;
    border-radius:10px;
    outline:none;
}

input[type="text"]:focus, select:focus{
    border-color:#1ed760;
}

input[type="file"]{
    background:#202020;
    border:1px dashed #444;
    padding:12px;
    border-radius:10px;
    width:100%;
    color:#aaa;
    cursor:pointer;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:25px;
    flex-wrap: wrap;
}

.tab-btn{
    flex:1;
    padding:12px;
    border:1px solid #333;
    background:#111;
    color:#888;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
    min-width: 130px;
    text-align: center;
}

.tab-btn.active{
    background:#1ed760;
    color:#000;
    border-color:#1ed760;
}

.form-section{
    display:none;
}

.form-section.active{
    display:block;
}

.btn-submit{
    width:100%;
    background:#1ed760;
    color:#000;
    border:0;
    padding:14px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
    font-size:16px;
    transition:.2s;
}

.btn-submit:hover{
    opacity:.9;
}

.btn-voltar{
    display:inline-block;
    margin-bottom:20px;
    color:#888;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}
.btn-voltar:hover{color:#fff;}

/* Estilos para a listagem e gerenciamento */
.manage-list{
    margin-top:20px;
    border-top:1px solid #252525;
    padding-top:20px;
}

.manage-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#1c1c1c;
    padding:12px 16px;
    border-radius:10px;
    margin-bottom:10px;
    border:1px solid #2a2a2a;
}

.manage-info{
    display:flex;
    align-items:center;
    gap:12px;
}

.manage-info img{
    width:40px;
    height:40px;
    border-radius:6px;
    object-fit:cover;
}

.manage-info span{
    font-size:14px;
    font-weight:bold;
    color:#fff;
}

.manage-actions{
    display:flex;
    gap:8px;
}

.btn-action{
    padding:6px 12px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    border:0;
}

.btn-edit{
    background:#333;
    color:#fff;
}
.btn-edit:hover{background:#444;}

.btn-delete{
    background:#e53935;
    color:#fff;
}
.btn-delete:hover{background:#d32f2f;}

#toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translate(-50%,20px);
    background:#1ed760;
    color:#000;
    padding:13px 20px;
    border-radius:25px;
    font-weight:bold;
    z-index:800;
    opacity:0;
    pointer-events:none;
    transition:.3s;
}
</style>
</head>
<body>

<div class="upload-container">
    <a href="index.html" class="btn-voltar">Voltar ao Painel ADM</a>
    
    <h1 id="tituloPagina">Novo Cadastro</h1>
    <p class="sub" id="subPagina">Adicione novas guias, artistas ou projetos ao UnderFy.</p>

    <div class="tabs">
        <button class="tab-btn active" onclick="mudarAba('guia', this)">Guia / Musica</button>
        <button class="tab-btn" onclick="mudarAba('artista', this)">Artista</button>
        <button class="tab-btn" onclick="mudarAba('projeto', this)">Projeto</button>
        <button class="tab-btn" onclick="mudarAba('gerenciar', this)" style="background:#222; border-color:#444; color:#fff;">Gerenciar Tudo</button>
    </div>

    <!-- FORMULARIO DE GUIA -->
    <div id="form-guia" class="form-section active">
        <form onsubmit="cadastrarGuia(event)">
            <input type="hidden" id="editGuiaId">
            <div class="form-group">
                <label>Nome da Guia</label>
                <input type="text" id="guiaNome" required placeholder="Ex: Trap Star">
            </div>
            <div class="form-group">
                <label>Artistas (Selecione um ou mais segurando Ctrl / Cmd)</label>
                <select id="guiaArtistas" multiple style="height:120px;" required>
                    <option value="">Carregando artistas...</option>
                </select>
                <small style="color:#555; display:block; margin-top:5px;">Certifique-se de cadastrar o artista na aba ao lado caso ele nao apareca.</small>
            </div>
            <div class="form-group">
                <label>Projetos / Albuns (Opcional - selecione para incluir esta música)</label>
                <select id="guiaProjetos" multiple style="height:90px;">
                    <option value="">Carregando projetos...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Capa da Guia (Imagem)</label>
                <input type="file" id="guiaCapa" accept="image/*">
                <small style="color:#777; display:block; margin-top:5px;" id="avisoGuiaCapa"></small>
            </div>
            <div class="form-group">
                <label>Arquivo de Audio (.mp3 / .wav)</label>
                <input type="file" id="guiaAudio" accept="audio/*">
                <small style="color:#777; display:block; margin-top:5px;" id="avisoGuiaAudio"></small>
            </div>
            <button type="submit" class="btn-submit" id="btnSalvarGuia">Salvar Guia</button>
            <button type="button" id="btnCancelarEdicaoGuia" style="display:none; width:100%; background:#333; color:#fff; border:0; padding:10px; border-radius:10px; margin-top:10px; cursor:pointer;" onclick="cancelarEdicaoGuia()">Cancelar Edicao</button>
        </form>
    </div>

    <!-- FORMULARIO DE ARTISTA -->
    <div id="form-artista" class="form-section">
        <form onsubmit="cadastrarArtista(event)">
            <input type="hidden" id="editArtistaId">
            <div class="form-group">
                <label>Nome do Artista</label>
                <input type="text" id="artistaNome" required placeholder="Ex: Novais">
            </div>
            <div class="form-group">
                <label>Foto do Artista</label>
                <input type="file" id="artistaFoto" accept="image/*">
                <small style="color:#777; display:block; margin-top:5px;" id="avisoArtistaFoto"></small>
            </div>
            <button type="submit" class="btn-submit" id="btnSalvarArtista">Salvar Artista</button>
            <button type="button" id="btnCancelarEdicaoArtista" style="display:none; width:100%; background:#333; color:#fff; border:0; padding:10px; border-radius:10px; margin-top:10px; cursor:pointer;" onclick="cancelarEdicaoArtista()">Cancelar Edicao</button>
        </form>
    </div>

    <!-- FORMULARIO DE PROJETO -->
    <div id="form-projeto" class="form-section">
        <form onsubmit="cadastrarProjeto(event)">
            <input type="hidden" id="editProjetoId">
            <div class="form-group">
                <label>Nome do Projeto / Album</label>
                <input type="text" id="projetoNome" required placeholder="Ex: Tape de Verao">
            </div>
            <div class="form-group">
                <label>Descricao</label>
                <input type="text" id="projetoDesc" placeholder="Breve resumo do projeto">
            </div>
            <div class="form-group">
                <label>Capa do Projeto (Imagem)</label>
                <input type="file" id="projetoCapa" accept="image/*">
                <small style="color:#777; display:block; margin-top:5px;" id="avisoProjetoCapa"></small>
            </div>
            <button type="submit" class="btn-submit" id="btnSalvarProjeto">Salvar Projeto</button>
            <button type="button" id="btnCancelarEdicaoProjeto" style="display:none; width:100%; background:#333; color:#fff; border:0; padding:10px; border-radius:10px; margin-top:10px; cursor:pointer;" onclick="cancelarEdicaoProjeto()">Cancelar Edicao</button>
        </form>
    </div>

    <!-- SECAO DE GERENCIAMENTO (LISTA) -->
    <div id="form-gerenciar" class="form-section">
        <div style="margin-bottom:15px; display:flex; gap:10px;">
            <button class="btn-action btn-edit activeManageTab" onclick="mudarSubGerenciar('musicas', this)" style="background:#1ed760; color:#000;">Guias / Musicas</button>
            <button class="btn-action btn-edit" onclick="mudarSubGerenciar('artistas', this)" style="background:#222; color:#fff;">Artistas</button>
            <button class="btn-action btn-edit" onclick="mudarSubGerenciar('projetos', this)" style="background:#222; color:#fff;">Projetos</button>
        </div>
        <div id="listaGerenciar" class="manage-list">
            <p style="color:#777; text-align:center;">Carregando itens...</p>
        </div>
    </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://gnibzbnypirjrcaoibkx.supabase.co";
const SUPABASE_KEY = "sb_publishable_b9yvSbmWOLVJvq4AB4CLmQ_VRuzpG5T";
const BUCKET_NAME = "underfy-files";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.addEventListener("DOMContentLoaded", () => {
    carregarArtistasSelect();
    carregarProjetosSelect();
});

let subGerenciarAtual = 'musicas';

function mudarAba(tipo, btn){
    document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

    document.getElementById('form-' + tipo).classList.add('active');
    btn.classList.add('active');

    const titulo = document.getElementById("tituloPagina");
    const sub = document.getElementById("subPagina");

    if(tipo === 'gerenciar'){
        titulo.textContent = "Gerenciar Acervo";
        sub.textContent = "Edite ou exclua guias, artistas e projetos cadastrados.";
        carregarListaGerenciar(subGerenciarAtual);
    } else {
        titulo.textContent = "Novo Cadastro";
        sub.textContent = "Adicione novas guias, artistas ou projetos ao UnderFy.";
        if(tipo === 'guia') {
            carregarArtistasSelect();
            carregarProjetosSelect();
        }
    }
}

function mudarSubGerenciar(tipo, btn){
    subGerenciarAtual = tipo;
    document.querySelectorAll('#form-gerenciar button').forEach(b => {
        b.style.background = "#222";
        b.style.color = "#fff";
    });
    btn.style.background = "#1ed760";
    btn.style.color = "#000";
    carregarListaGerenciar(tipo);
}

function mostrarToast(mensagem, erro = false){
    const toast = document.getElementById("toast");
    if(!toast) return;
    toast.textContent = mensagem;
    toast.style.background = erro ? "#e53935" : "#1ed760";
    toast.style.color = "#000";
    toast.style.opacity = "1";
    toast.style.transform = "translate(-50%,0)";
    setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translate(-50%,20px)";
    }, 4000);
}

async function carregarArtistasSelect(){
    const select = document.getElementById("guiaArtistas");
    const { data, error } = await supabaseClient.from("artistas").select("*").order("nome");
    
    if(error){
        select.innerHTML = '<option value="">Erro ao carregar artistas</option>';
        return;
    }

    if(!data || data.length === 0){
        select.innerHTML = '<option value="">Nenhum artista cadastrado</option>';
        return;
    }

    select.innerHTML = data.map(a => `<option value="${a.id}">${a.nome}</option>`).join("");
}

async function carregarProjetosSelect(){
    const select = document.getElementById("guiaProjetos");
    const { data, error } = await supabaseClient.from("projetos").select("*").order("nome");
    
    if(error){
        select.innerHTML = '<option value="">Erro ao carregar projetos</option>';
        return;
    }

    if(!data || data.length === 0){
        select.innerHTML = '<option value="">Nenhum projeto cadastrado</option>';
        return;
    }

    select.innerHTML = data.map(p => `<option value="${p.id}">${p.nome}</option>`).join("");
}

async function enviarParaStorage(file, pasta){
    const nomeUnico = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
    const caminho = `${pasta}/${nomeUnico}`;

    const { data, error } = await supabaseClient.storage
        .from(BUCKET_NAME)
        .upload(caminho, file);

    if(error){
        if(error.message.includes("Bucket not found") || error.message.includes("not found")){
            throw new Error("Erro: O bucket 'underfy-files' nao foi encontrado no Supabase. Crie-o na aba Storage.");
        }
        throw new Error("Erro no upload: " + error.message);
    }

    const { data: urlData } = supabaseClient.storage
        .from(BUCKET_NAME)
        .getPublicUrl(caminho);

    return urlData.publicUrl;
}

/* ================================
   CADASTRAR E EDITAR ARTISTA
================================ */
async function cadastrarArtista(e){
    e.preventDefault();
    const btn = document.getElementById("btnSalvarArtista");
    btn.disabled = true;
    btn.textContent = "Salvando...";

    try {
        const id = document.getElementById("editArtistaId").value;
        const nome = document.getElementById("artistaNome").value.trim();
        const fotoFile = document.getElementById("artistaFoto").files[0];

        let foto_url = null;
        if(fotoFile){
            mostrarToast("Enviando foto...");
            foto_url = await enviarParaStorage(fotoFile, "artistas");
        }

        if(id){
            let dadosAtualizar = { nome };
            if(foto_url) dadosAtualizar.foto_url = foto_url;

            const { error } = await supabaseClient.from("artistas").update(dadosAtualizar).eq("id", id);
            if(error) throw error;
            mostrarToast("Artista atualizado com sucesso!");
            cancelarEdicaoArtista();
        } else {
            if(!foto_url) throw new Error("Selecione uma foto para o artista.");
            const { error } = await supabaseClient.from("artistas").insert([{ nome, foto_url }]);
            if(error) throw error;
            mostrarToast("Artista cadastrado com sucesso!");
            e.target.reset();
        }
        carregarArtistasSelect();
    } catch(err) {
        console.error(err);
        mostrarToast(err.message, true);
    } finally {
        btn.disabled = false;
        btn.textContent = id ? "Atualizar Artista" : "Salvar Artista";
    }
}

function cancelarEdicaoArtista(){
    document.getElementById("editArtistaId").value = "";
    document.getElementById("artistaNome").value = "";
    document.getElementById("artistaFoto").value = "";
    document.getElementById("avisoArtistaFoto").textContent = "";
    document.getElementById("btnSalvarArtista").textContent = "Salvar Artista";
    document.getElementById("btnCancelarEdicaoArtista").style.display = "none";
}

/* ================================
   CADASTRAR E EDITAR GUIA
================================ */
async function cadastrarGuia(e){
    e.preventDefault();
    const btn = document.getElementById("btnSalvarGuia");
    btn.disabled = true;
    btn.textContent = "Salvando...";

    try {
        const id = document.getElementById("editGuiaId").value;
        const nome = document.getElementById("guiaNome").value.trim();
        
        const artistasSelect = document.getElementById("guiaArtistas");
        const artistasIds = Array.from(artistasSelect.selectedOptions).map(opt => opt.value);
        if(artistasIds.length === 0 || !artistasIds[0]) throw new Error("Selecione pelo menos um artista.");

        const projetosSelect = document.getElementById("guiaProjetos");
        const projetosIds = Array.from(projetosSelect.selectedOptions).map(opt => opt.value).filter(val => val !== "");

        const capaFile = document.getElementById("guiaCapa").files[0];
        const audioFile = document.getElementById("guiaAudio").files[0];

        let capa_url = null;
        let audio_url = null;

        if(capaFile){
            mostrarToast("Enviando capa...");
            capa_url = await enviarParaStorage(capaFile, "capas");
        }
        if(audioFile){
            mostrarToast("Enviando audio...");
            audio_url = await enviarParaStorage(audioFile, "audios");
        }

        let musicaId = id;

        if(id){
            let dadosMusica = { nome };
            if(capa_url) dadosMusica.capa_url = capa_url;
            if(audio_url) dadosMusica.audio_url = audio_url;

            const { error: errM } = await supabaseClient.from("musicas").update(dadosMusica).eq("id", id);
            if(errM) throw errM;

            await supabaseClient.from("musica_artistas").delete().eq("musica_id", id);
            await supabaseClient.from("projeto_musicas").delete().eq("musica_id", id);

            mostrarToast("Guia atualizada com sucesso!");
        } else {
            if(!capa_url || !audio_url) throw new Error("Capa e audio obrigatorios para nova guia.");
            const { data: musicaData, error: musicaError } = await supabaseClient
                .from("musicas")
                .insert([{ nome, capa_url, audio_url, plays: 0 }])
                .select()
                .single();

            if(musicaError) throw musicaError;
            musicaId = musicaData.id;

            mostrarToast("Guia cadastrada com sucesso!");
            e.target.reset();
        }

        const relArtistas = artistasIds.map(artistaId => ({ musica_id: musicaId, artista_id: artistaId }));
        const { error: relError } = await supabaseClient.from("musica_artistas").insert(relArtistas);
        if(relError) throw relError;

        if(projetosIds.length > 0){
            const relProjetos = projetosIds.map(projetoId => ({ projeto_id: projetoId, musica_id: musicaId }));
            const { error: projRelError } = await supabaseClient.from("projeto_musicas").insert(relProjetos);
            if(projRelError) throw projRelError;
        }

        if(id) cancelarEdicaoGuia();
    } catch(err) {
        console.error(err);
        mostrarToast(err.message, true);
    } finally {
        btn.disabled = false;
        btn.textContent = id ? "Atualizar Guia" : "Salvar Guia";
    }
}

function cancelarEdicaoGuia(){
    document.getElementById("editGuiaId").value = "";
    document.getElementById("guiaNome").value = "";
    document.getElementById("guiaArtistas").selectedIndex = -1;
    document.getElementById("guiaProjetos").selectedIndex = -1;
    document.getElementById("guiaCapa").value = "";
    document.getElementById("guiaAudio").value = "";
    document.getElementById("avisoGuiaCapa").textContent = "";
    document.getElementById("avisoGuiaAudio").textContent = "";
    document.getElementById("btnSalvarGuia").textContent = "Salvar Guia";
    document.getElementById("btnCancelarEdicaoGuia").style.display = "none";
}

/* ================================
   CADASTRAR E EDITAR PROJETO
================================ */
async function cadastrarProjeto(e){
    e.preventDefault();
    const btn = document.getElementById("btnSalvarProjeto");
    btn.disabled = true;
    btn.textContent = "Salvando...";

    try {
        const id = document.getElementById("editProjetoId").value;
        const nome = document.getElementById("projetoNome").value.trim();
        const descricao = document.getElementById("projetoDesc").value.trim();
        const capaFile = document.getElementById("projetoCapa").files[0];

        let capa_url = null;
        if(capaFile){
            mostrarToast("Enviando capa do projeto...");
            capa_url = await enviarParaStorage(capaFile, "projetos");
        }

        if(id){
            let dadosProj = { nome, descricao };
            if(capa_url) dadosProj.capa_url = capa_url;

            const { error } = await supabaseClient.from("projetos").update(dadosProj).eq("id", id);
            if(error) throw error;
            mostrarToast("Projeto atualizado com sucesso!");
            cancelarEdicaoProjeto();
        } else {
            if(!capa_url) throw new Error("Capa obrigatoria para novo projeto.");
            const { error } = await supabaseClient.from("projetos").insert([{ nome, descricao, capa_url }]);
            if(error) throw error;
            mostrarToast("Projeto cadastrado com sucesso!");
            e.target.reset();
        }
        carregarProjetosSelect();
    } catch(err) {
        console.error(err);
        mostrarToast(err.message, true);
    } finally {
        btn.disabled = false;
        btn.textContent = id ? "Atualizar Projeto" : "Salvar Projeto";
    }
}

function cancelarEdicaoProjeto(){
    document.getElementById("editProjetoId").value = "";
    document.getElementById("projetoNome").value = "";
    document.getElementById("projetoDesc").value = "";
    document.getElementById("projetoCapa").value = "";
    document.getElementById("avisoProjetoCapa").textContent = "";
    document.getElementById("btnSalvarProjeto").textContent = "Salvar Projeto";
    document.getElementById("btnCancelarEdicaoProjeto").style.display = "none";
}

/* ================================
   GERENCIAR / LISTAR / EXCLUIR
================================ */
async function carregarListaGerenciar(tipo){
    const container = document.getElementById("listaGerenciar");
    container.innerHTML = '<p style="color:#777; text-align:center;">Carregando...</p>';

    let tabela = tipo === 'musicas' ? 'musicas' : tipo === 'artistas' ? 'artistas' : 'projetos';
    const { data, error } = await supabaseClient.from(tabela).select("*").order("id", { ascending: false });

    if(error){
        container.innerHTML = '<p style="color:#e53935; text-align:center;">Erro ao carregar dados.</p>';
        return;
    }

    if(!data || data.length === 0){
        container.innerHTML = '<p style="color:#777; text-align:center;">Nenhum registro encontrado.</p>';
        return;
    }

    container.innerHTML = data.map(item => {
        let imagem = item.capa_url || item.foto_url || 'https://via.placeholder.com/40';
        let nome = item.nome;
        return `
            <div class="manage-item">
                <div class="manage-info">
                    <img src="${imagem}" alt="">
                    <span>${nome}</span>
                </div>
                <div class="manage-actions">
                    <button class="btn-action btn-edit" onclick="prepararEdicao('${tipo}', '${item.id}')">Editar</button>
                    <button class="btn-action btn-delete" onclick="excluirItem('${tipo}', '${item.id}')">Excluir</button>
                </div>
            </div>
        `;
    }).join("");
}

async function excluirItem(tipo, id){
    if(!confirm("Tem certeza que deseja excluir este item?")) return;

    let tabela = tipo === 'musicas' ? 'musicas' : tipo === 'artistas' ? 'artistas' : 'projetos';
    
    if(tipo === 'musicas'){
        await supabaseClient.from("musica_artistas").delete().eq("musica_id", id);
        await supabaseClient.from("projeto_musicas").delete().eq("musica_id", id);
    } else if(tipo === 'projetos'){
        await supabaseClient.from("projeto_musicas").delete().eq("projeto_id", id);
    } else if(tipo === 'artistas'){
        await supabaseClient.from("musica_artistas").delete().eq("artista_id", id);
    }

    const { error } = await supabaseClient.from(tabela).delete().eq("id", id);
    if(error){
        mostrarToast("Erro ao excluir item.", true);
        return;
    }

    mostrarToast("Item excluido com sucesso!");
    carregarListaGerenciar(tipo);
    if(tipo === 'artistas') carregarArtistasSelect();
    if(tipo === 'projetos') carregarProjetosSelect();
}

async function prepararEdicao(tipo, id){
    if(tipo === 'artistas'){
        const { data, error } = await supabaseClient.from("artistas").select("*").eq("id", id).single();
        if(error) return mostrarToast("Erro ao carregar artista.", true);

        mudarAba('artista', document.querySelectorAll('.tab-btn')[1]);
        document.getElementById("editArtistaId").value = data.id;
        document.getElementById("artistaNome").value = data.nome;
        document.getElementById("avisoArtistaFoto").textContent = "Deixe em branco caso nao queira alterar a foto atual.";
        document.getElementById("btnSalvarArtista").textContent = "Atualizar Artista";
        document.getElementById("btnCancelarEdicaoArtista").style.display = "block";
    } 
    else if(tipo === 'musicas'){
        const { data, error } = await supabaseClient.from("musicas").select("*").eq("id", id).single();
        if(error) return mostrarToast("Erro ao carregar guia.", true);

        const { data: relArtistas } = await supabaseClient.from("musica_artistas").select("artista_id").eq("musica_id", id);
        const { data: relProjetos } = await supabaseClient.from("projeto_musicas").select("projeto_id").eq("musica_id", id);

        mudarAba('guia', document.querySelectorAll('.tab-btn')[0]);
        document.getElementById("editGuiaId").value = data.id;
        document.getElementById("guiaNome").value = data.nome;

        await carregarArtistasSelect();
        await carregarProjetosSelect();

        const selectArtistas = document.getElementById("guiaArtistas");
        const artistasIds = relArtistas ? relArtistas.map(r => r.artista_id) : [];
        Array.from(selectArtistas.options).forEach(opt => {
            if(artistasIds.includes(opt.value)) opt.selected = true;
        });

        const selectProjetos = document.getElementById("guiaProjetos");
        const projetosIds = relProjetos ? relProjetos.map(r => r.projeto_id) : [];
        Array.from(selectProjetos.options).forEach(opt => {
            if(projetosIds.includes(opt.value)) opt.selected = true;
        });

        document.getElementById("avisoGuiaCapa").textContent = "Deixe em branco caso nao queira alterar a capa.";
        document.getElementById("avisoGuiaAudio").textContent = "Deixe em branco caso nao queira alterar o audio.";
        document.getElementById("btnSalvarGuia").textContent = "Atualizar Guia";
        document.getElementById("btnCancelarEdicaoGuia").style.display = "block";
    }
    else if(tipo === 'projetos'){
        const { data, error } = await supabaseClient.from("projetos").select("*").eq("id", id).single();
        if(error) return mostrarToast("Erro ao carregar projeto.", true);

        mudarAba('projeto', document.querySelectorAll('.tab-btn')[2]);
        document.getElementById("editProjetoId").value = data.id;
        document.getElementById("projetoNome").value = data.nome;
        document.getElementById("projetoDesc").value = data.descricao || "";
        document.getElementById("avisoProjetoCapa").textContent = "Deixe em branco caso nao queira alterar a capa.";
        document.getElementById("btnSalvarProjeto").textContent = "Atualizar Projeto";
        document.getElementById("btnCancelarEdicaoProjeto").style.display = "block";
    }
}
</script>
