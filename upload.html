<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta

<title>Painel ADM • UnderFy</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b0b0b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    padding:30px 20px;
}

.container{
    max-width:650px;
    margin:auto;
    background:#151515;
    padding:30px;
    border-radius:20px;
    border:1px solid #222;
}

h1{
    font-size:24px;
    margin-bottom:20px;
    color:#1ed760;
}

h2{
    font-size:18px;
    margin:25px 0 15px;
    border-bottom:1px solid #222;
    padding-bottom:8px;
}

label{
    display:block;
    font-size:14px;
    color:#bbb;
    margin-bottom:6px;
}

input,
select{

    width:100%;

    padding:12px;

    margin-bottom:18px;

    background:#202020;

    border:1px solid #333;

    color:#fff;

    border-radius:9px;

    outline:none;

    font:inherit;

}

input[type="file"]{

    padding:9px;

    cursor:pointer;

}

input:focus,
select:focus{

    border-color:#1ed760;

}

.checkbox-group{

    background:#202020;

    border:1px solid #333;

    border-radius:9px;

    padding:12px;

    max-height:150px;

    overflow-y:auto;

    margin-bottom:18px;

}

.checkbox-item{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:8px;

    font-size:14px;

    cursor:pointer;

}

.checkbox-item input{

    width:auto;

    margin:0;

    cursor:pointer;

}

.btn{

    width:100%;

    padding:14px;

    background:#1ed760;

    color:#000;

    border:0;

    border-radius:25px;

    font-weight:bold;

    cursor:pointer;

    font:inherit;

    transition:.2s;

}

.btn:hover{

    opacity:.9;

}

.btn:disabled{

    opacity:.5;

    cursor:not-allowed;

}

.back-link{

    display:inline-block;

    margin-top:20px;

    color:#888;

    text-decoration:none;

    font-size:14px;

}

.back-link:hover{

    color:#fff;

}

#loadingMsg{

    display:none;

    text-align:center;

    color:#1ed760;

    margin-bottom:15px;

    font-weight:bold;

}

.status{

    display:none;

    padding:12px;

    border-radius:10px;

    margin-bottom:15px;

    font-size:14px;

}

.status.success{

    display:block;

    background:#12351f;

    color:#1ed760;

}

.status.error{

    display:block;

    background:#351414;

    color:#ff6666;

}


/* GUIAS */

.guia-item{

    background:#202020;

    border:1px solid #303030;

    border-radius:14px;

    padding:12px;

    margin-bottom:12px;

    display:flex;

    align-items:center;

    gap:12px;

}

.guia-capa{

    width:60px;

    height:60px;

    object-fit:cover;

    border-radius:10px;

    flex-shrink:0;

    background:#292929;

}

.guia-info{

    flex:1;

    min-width:0;

}

.guia-nome{

    display:block;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.guia-plays{

    display:block;

    color:#888;

    font-size:12px;

    margin-top:5px;

}

.btn-excluir{

    background:#e63946;

    color:#fff;

    border:0;

    padding:10px 14px;

    border-radius:20px;

    font-weight:bold;

    cursor:pointer;

    flex-shrink:0;

}

.btn-excluir:hover{

    background:#ff4d5a;

}

.lista-vazia{

    text-align:center;

    color:#888;

    padding:25px 10px;

    background:#202020;

    border-radius:12px;

}

.separador{

    margin-top:40px;

    border-top:1px solid #222;

    padding-top:25px;

}


/* MOBILE */

@media(max-width:500px){

    body{

        padding:15px 10px;

    }

    .container{

        padding:20px 15px;

    }

    .guia-item{

        padding:10px;

    }

    .guia-capa{

        width:52px;

        height:52px;

    }

    .btn-excluir{

        padding:8px 10px;

        font-size:12px;

    }

}

</style>

</head>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://gnibzbnypirjrcaoibkx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_b9yvSbmWOLVJvq4AB4CLmQ_VRuzpG5T";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let artistasDisponiveis = [];


/* ================================
   VERIFICAR LOGIN
================================ */

async function checarAuth(){

    const {
        data: {
            session
        }
    } =
        await supabaseClient
        .auth
        .getSession();


    if(!session){

        alert(
            "Área restrita! Faça login no site principal primeiro."
        );

        window.location.href =
            "index.html";

        return false;

    }

    return true;

}


/* ================================
   CARREGAR ARTISTAS
================================ */

async function carregarArtistasParaSelecao(){

    const autorizado =
        await checarAuth();


    if(!autorizado){

        return;

    }


    const {
        data,
        error
    } =
        await supabaseClient
        .from("artistas")
        .select("*")
        .order(
            "nome",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "Erro ao carregar artistas:",
            error
        );

        document.getElementById(
            "listaArtistasCheckbox"
        ).innerHTML = `

            <span style="color:#ff5555;font-size:13px;">
                Erro ao carregar artistas.
            </span>

        `;

        return;

    }


    artistasDisponiveis =
        data || [];


    const container =
        document.getElementById(
            "listaArtistasCheckbox"
        );


    container.innerHTML = "";


    if(
        artistasDisponiveis.length === 0
    ){

        container.innerHTML = `

            <span style="color:#888;font-size:13px;">
                Nenhum artista cadastrado ainda.
            </span>

        `;

        return;

    }


    artistasDisponiveis.forEach(
        function(artista){

            const label =
                document.createElement(
                    "label"
                );

            label.className =
                "checkbox-item";


            const checkbox =
                document.createElement(
                    "input"
                );

            checkbox.type =
                "checkbox";

            checkbox.name =
                "artistaCheck";

            checkbox.value =
                artista.id;


            label.appendChild(
                checkbox
            );


            label.appendChild(
                document.createTextNode(
                    " " + artista.nome
                )
            );


            container.appendChild(
                label
            );

        }
    );

}


/* ================================
   UPLOAD DE ARQUIVO
================================ */

async function fazerUploadArquivo(
    file,
    nomeBucket
){

    if(!file){

        return "";

    }


    const nomeSeguro =
        file.name
        .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );


    const nomeUnico =
        Date.now() +
        "_" +
        Math.random()
        .toString(36)
        .substring(2,8) +
        "_" +
        nomeSeguro;


    const {
        data,
        error
    } =
        await supabaseClient
        .storage
        .from(nomeBucket)
        .upload(
            nomeUnico,
            file
        );


    if(error){

        throw new Error(
            "Erro no upload para o bucket " +
            nomeBucket +
            ": " +
            error.message
        );

    }


    const {
        data:urlData
    } =
        supabaseClient
        .storage
        .from(nomeBucket)
        .getPublicUrl(
            nomeUnico
        );


    return urlData.publicUrl;

}


/* ================================
   MOSTRAR STATUS
================================ */

function mostrarStatus(
    mensagem,
    tipo
){

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        mensagem;


    status.className =
        "status " + tipo;


    setTimeout(
        function(){

            status.className =
                "status";

        },
        5000
    );

}

/* ================================
   CADASTRAR ARTISTA
================================ */

async function cadastrarArtista(){

    const nome =
        document.getElementById(
            "nomeArtista"
        ).value.trim();

    const fotoFile =
        document.getElementById(
            "fotoArtistaFile"
        ).files[0];


    if(!nome){

        alert(
            "Preencha o nome do artista."
        );

        return;

    }


    try{

        let foto_url = "";


        if(fotoFile){

            foto_url =
                await fazerUploadArquivo(
                    fotoFile,
                    "fotos-artistas"
                );

        }


        const {
            error
        } =
            await supabaseClient
            .from("artistas")
            .insert([
                {
                    nome: nome,
                    foto_url: foto_url
                }
            ]);


        if(error){

            throw error;

        }


        mostrarStatus(
            "Artista cadastrado com sucesso!",
            "success"
        );


        document.getElementById(
            "nomeArtista"
        ).value = "";


        document.getElementById(
            "fotoArtistaFile"
        ).value = "";


        carregarArtistasParaSelecao();


    }catch(error){

        console.error(error);

        mostrarStatus(
            "Erro ao cadastrar artista: " +
            error.message,
            "error"
        );

    }

}


/* ================================
   CADASTRAR GUIA
================================ */

async function cadastrarMusica(){

    const nome =
        document.getElementById(
            "nomeMusica"
        ).value.trim();


    const capaFile =
        document.getElementById(
            "capaMusicaFile"
        ).files[0];


    const audioFile =
        document.getElementById(
            "audioMusicaFile"
        ).files[0];


    const checkboxesSelecionados =
        document.querySelectorAll(
            'input[name="artistaCheck"]:checked'
        );


    const artistasIds =
        Array.from(
            checkboxesSelecionados
        ).map(
            function(cb){
                return cb.value;
            }
        );


    if(
        !nome ||
        artistasIds.length === 0
    ){

        alert(
            "Preencha o nome da música e selecione pelo menos um artista."
        );

        return;

    }


    const loadingMsg =
        document.getElementById(
            "loadingMsg"
        );


    const botao =
        document.getElementById(
            "btnSalvarGuia"
        );


    loadingMsg.style.display =
        "block";


    botao.disabled =
        true;


    let capa_url = "";

    let audio_url = "";


    try{

        /* CAPA */

        if(capaFile){

            capa_url =
                await fazerUploadArquivo(
                    capaFile,
                    "capas-musicas"
                );

        }


        /* ÁUDIO */

        if(audioFile){

            audio_url =
                await fazerUploadArquivo(
                    audioFile,
                    "audios"
                );

        }


        /* CRIAR MÚSICA */

        const {
            data: musicaData,
            error: musicaError
        } =
            await supabaseClient
            .from("musicas")
            .insert([
                {
                    nome: nome,
                    capa_url: capa_url,
                    audio_url: audio_url,
                    plays: 0
                }
            ])
            .select()
            .single();


        if(musicaError){

            throw musicaError;

        }


        const musicaId =
            musicaData.id;


        /* CRIAR RELAÇÕES */

        const relacoesParaInserir =
            artistasIds.map(
                function(artistaId){

                    return {
                        musica_id: musicaId,
                        artista_id: artistaId
                    };

                }
            );


        const {
            error: relError
        } =
            await supabaseClient
            .from("musica_artistas")
            .insert(
                relacoesParaInserir
            );


        if(relError){

            throw relError;

        }


        mostrarStatus(
            "Guia cadastrada com sucesso!",
            "success"
        );


        document.getElementById(
            "nomeMusica"
        ).value = "";


        document.getElementById(
            "capaMusicaFile"
        ).value = "";


        document.getElementById(
            "audioMusicaFile"
        ).value = "";


        checkboxesSelecionados.forEach(
            function(cb){

                cb.checked = false;

            }
        );


        /* ATUALIZA A LISTA */

        carregarGuiasADM();


    }catch(error){

        console.error(
            "Erro ao cadastrar guia:",
            error
        );


        mostrarStatus(
            "Erro ao cadastrar guia: " +
            error.message,
            "error"
        );


    }finally{

        loadingMsg.style.display =
            "none";

        botao.disabled =
            false;

    }

}


/* ================================
   CADASTRAR PROJETO
================================ */

    const descricao =

/* ================================
   PEGAR CAMINHO DO ARQUIVO
================================ */

function pegarCaminhoStorage(url){

    if(!url){
        return null;
    }

    try{

        const partes =
            url.split("/public/");

        if(partes.length < 2){
            return null;
        }

        const caminhoCompleto =
            partes[1];

        const partesCaminho =
            caminhoCompleto.split("/");

        if(partesCaminho.length < 2){
            return null;
        }

        partesCaminho.shift();

        return partesCaminho.join("/");

    }catch(error){

        console.error(
            "Erro ao identificar arquivo:",
            error
        );

        return null;

    }

}


/* ================================
   EXCLUIR ARQUIVO DO STORAGE
================================ */

async function excluirArquivoStorage(
    url,
    bucket
){

    const caminho =
        pegarCaminhoStorage(url);

    if(!caminho){
        return;
    }

    const {
        error
    } =
        await supabaseClient
        .storage
        .from(bucket)
        .remove([
            caminho
        ]);

    if(error){

        console.error(
            "Erro ao apagar arquivo:",
            error
        );

    }

}


/* ================================
   CARREGAR GUIAS DO ADM
================================ */

async function carregarGuiasADM(){

    const container =
        document.getElementById(
            "listaGuiasADM"
        );


    container.innerHTML = `

        <div class="lista-vazia">
            Carregando guias...
        </div>

    `;


    try{

        const {
            data,
            error
        } =
            await supabaseClient
    .from("musicas")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            throw error;

        }


        if(!data || data.length === 0){

            container.innerHTML = `

                <div class="lista-vazia">
                    Nenhuma guia cadastrada.
                </div>

            `;

            return;

        }


        container.innerHTML = "";


        data.forEach(
            function(musica){

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "guia-item";


                const capa =
                    document.createElement(
                        "img"
                    );


                capa.className =
                    "guia-capa";


                capa.src =
                    musica.capa_url ||
                    "https://via.placeholder.com/100";


                capa.onerror =
                    function(){

                        this.src =
                            "https://via.placeholder.com/100";

                    };


                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "guia-info";


                const nome =
                    document.createElement(
                        "span"
                    );


                nome.className =
                    "guia-nome";


                nome.textContent =
                    musica.nome ||
                    "Sem nome";


                const plays =
                    document.createElement(
                        "span"
                    );


                plays.className =
                    "guia-plays";


                plays.textContent =
                    (
                        musica.plays || 0
                    ) +
                    " reproduções";


                info.appendChild(
                    nome
                );

                info.appendChild(
                    plays
                );


                const botao =
                    document.createElement(
                        "button"
                    );


                botao.className =
                    "btn-excluir";


                botao.textContent =
                    "🗑 Excluir";


                botao.onclick =
                    function(){

                        excluirGuia(
                            musica
                        );

                    };


                item.appendChild(
                    capa
                );

                item.appendChild(
                    info
                );

                item.appendChild(
                    botao
                );


                container.appendChild(
                    item
                );

            }
        );


    }catch(error){

        console.error(
            "Erro ao carregar guias:",
            error
        );


        container.innerHTML = `

            <div class="lista-vazia"
                 style="color:#ff5555;">

                Erro ao carregar as guias.

            </div>

        `;

    }

}


/* ================================
   EXCLUIR GUIA
================================ */

async function excluirGuia(
    musica
){

    const confirmar =
        confirm(

            "Excluir esta guia?\n\n" +

            musica.nome +

            "\n\n" +

            "A música, os vínculos com os artistas " +
            "e os arquivos enviados serão removidos."

        );


    if(!confirmar){

        return;

    }


    try{

        /*
         * PRIMEIRO:
         * apagar relações
         */

        const {
            error:
                relacaoError
        } =
            await supabaseClient
            .from("musica_artistas")
            .delete()
            .eq(
                "musica_id",
                musica.id
            );


        if(relacaoError){

            throw relacaoError;

        }


        /*
         * SEGUNDO:
         * apagar registro da música
         */

        const {
            error:
                musicaError
        } =
            await supabaseClient
            .from("musicas")
            .delete()
            .eq(
                "id",
                musica.id
            );


        if(musicaError){

            throw musicaError;

        }


        /*
         * TERCEIRO:
         * apagar capa
         */

        if(musica.capa_url){

            await excluirArquivoStorage(
                musica.capa_url,
                "capas-musicas"
            );

        }


        /*
         * QUARTO:
         * apagar áudio
         */

        if(musica.audio_url){

            await excluirArquivoStorage(
                musica.audio_url,
                "audios"
            );

        }


        mostrarStatus(
            "Guia excluída com sucesso!",
            "success"
        );


        carregarGuiasADM();


    }catch(error){

        console.error(
            "Erro ao excluir guia:",
            error
        );


        mostrarStatus(

            "Erro ao excluir guia: " +
            error.message,

            "error"

        );

    }

}

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        const autorizado =
            await checarAuth();


        if(!autorizado){

            return;

        }


        carregarArtistasParaSelecao();

        carregarGuiasADM();

    }
);

</script>
