<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UnderFy - Cadastros</title>
<style>
/* ================================
   ESTILOS DO PAINEL DE CADASTRO
================================ */
*{box-sizing:border-box; margin:0; padding:0; font-family:sans-serif;}
body{background:#0b0b0b; color:#fff; padding:20px;}

.upload-container{
    max-width:600px;
    margin:40px auto;
    background:#151515;
    border:1px solid #252525;
    border-radius:18px;
    padding:30px;
}

h1{font-size:24px; margin-bottom:8px; color:#fff;}
p.sub{color:#777; font-size:14px; margin-bottom:25px;}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    font-size:13px;
    color:#aaa;
    margin-bottom:8px;
    font-weight:bold;
}

input[type="text"], select{
    width:100%;
    background:#202020;
    border:1px solid #333;
    color:#fff;
    padding:12px;
    border-radius:10px;
    outline:none;
}

input[type="text"]:focus, select:focus{
    border-color:#1ed760;
}

input[type="file"]{
    background:#202020;
    border:1px dashed #444;
    padding:12px;
    border-radius:10px;
    width:100%;
    color:#aaa;
    cursor:pointer;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

.tab-btn{
    flex:1;
    padding:12px;
    border:1px solid #333;
    background:#111;
    color:#888;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.tab-btn.active{
    background:#1ed760;
    color:#000;
    border-color:#1ed760;
}

.form-section{
    display:none;
}

.form-section.active{
    display:block;
}

.btn-submit{
    width:100%;
    background:#1ed760;
    color:#000;
    border:0;
    padding:14px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
    font-size:16px;
    transition:.2s;
}

.btn-submit:hover{
    opacity:.9;
}

.btn-voltar{
    display:inline-block;
    margin-bottom:20px;
    color:#888;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}
.btn-voltar:hover{color:#fff;}

/* Toast */
#toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translate(-50%,20px);
    background:#1ed760;
    color:#000;
    padding:13px 20px;
    border-radius:25px;
    font-weight:bold;
    z-index:800;
    opacity:0;
    pointer-events:none;
    transition:.3s;
}
</style>
</head>
<body>

<div class="upload-container">
    <a href="index.html" class="btn-voltar">← Voltar ao Painel ADM</a>
    
    <h1>Novo Cadastro</h1>
    <p class="sub">Adicione novas guias, artistas ou projetos ao UnderFy.</p>

    <!-- Abas para alternar o tipo de cadastro -->
    <div class="tabs">
        <button class="tab-btn active" onclick="mudarAba('guia', this)">🎵 Guia / Música</button>
        <button class="tab-btn" onclick="mudarAba('artista', this)">🎤 Artista</button>
        <button class="tab-btn" onclick="mudarAba('projeto', this)">💿 Projeto</button>
    </div>

    <!-- FORMULÁRIO DE GUIA -->
    <div id="form-guia" class="form-section active">
        <form onsubmit="cadastrarGuia(event)">
            <div class="form-group">
                <label>Nome da Guia</label>
                <input type="text" id="guiaNome" required placeholder="Ex: Trap Star">
            </div>
            <div class="form-group">
                <label>Artista Principal / Participações</label>
                <select id="guiaArtista" required>
                    <option value="">Carregando artistas...</option>
                </select>
                <small style="color:#555; display:block; margin-top:5px;">Certifique-se de cadastrar o artista na aba ao lado caso ele não apareça.</small>
            </div>
            <div class="form-group">
                <label>Capa da Guia (Imagem)</label>
                <input type="file" id="guiaCapa" accept="image/*" required>
            </div>
            <div class="form-group">
                <label>Arquivo de Áudio (.mp3 / .wav)</label>
                <input type="file" id="guiaAudio" accept="audio/*" required>
            </div>
            <button type="submit" class="btn-submit" id="btnSalvarGuia">Salvar Guia</button>
        </form>
    </div>

    <!-- FORMULÁRIO DE ARTISTA -->
    <div id="form-artista" class="form-section">
        <form onsubmit="cadastrarArtista(event)">
            <div class="form-group">
                <label>Nome do Artista</label>
                <input type="text" id="artistaNome" required placeholder="Ex: Novais">
            </div>
            <div class="form-group">
                <label>Foto do Artista</label>
                <input type="file" id="artistaFoto" accept="image/*" required>
            </div>
            <button type="submit" class="btn-submit" id="btnSalvarArtista">Salvar Artista</button>
        </form>
    </div>

    <!-- FORMULÁRIO DE PROJETO -->
    <div id="form-projeto" class="form-section">
        <form onsubmit="cadastrarProjeto(event)">
            <div class="form-group">
                <label>Nome do Projeto / Álbum</label>
                <input type="text" id="projetoNome" required placeholder="Ex: Tape de Verão">
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <input type="text" id="projetoDesc" placeholder="Breve resumo do projeto">
            </div>
            <div class="form-group">
                <label>Capa do Projeto (Imagem)</label>
                <input type="file" id="projetoCapa" accept="image/*" required>
            </div>
            <button type="submit" class="btn-submit" id="btnSalvarProjeto">Salvar Projeto</button>
        </form>
    </div>
</div>

<div id="toast"></div>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://gnibzbnypirjrcaoibkx.supabase.co";
const SUPABASE_KEY = "sb_publishable_b9yvSbmWOLVJvq4AB4CLmQ_VRuzpG5T";
const BUCKET_NAME = "underfy-files"; // Nome padronizado do bucket

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.addEventListener("DOMContentLoaded", () => {
    carregarArtistasSelect();
});

function mudarAba(tipo, btn){
    document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

    document.getElementById('form-' + tipo).classList.add('active');
    btn.classList.add('active');
}

function mostrarToast(mensagem, erro = false){
    const toast = document.getElementById("toast");
    if(!toast) return;
    toast.textContent = mensagem;
    toast.style.background = erro ? "#e53935" : "#1ed760";
    toast.style.color = "#000";
    toast.style.opacity = "1";
    toast.style.transform = "translate(-50%,0)";
    setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translate(-50%,20px)";
    }, 4000);
}

async function carregarArtistasSelect(){
    const select = document.getElementById("guiaArtista");
    const { data, error } = await supabaseClient.from("artistas").select("*").order("nome");
    
    if(error){
        select.innerHTML = '<option value="">Erro ao carregar artistas</option>';
        return;
    }

    if(!data || data.length === 0){
        select.innerHTML = '<option value="">Nenhum artista cadastrado</option>';
        return;
    }

    select.innerHTML = '<option value="">Selecione o artista...</option>' + data.map(a => `<option value="${a.id}">${a.nome}</option>`).join("");
}

/* ================================
   FUNÇÃO DE UPLOAD PARA O STORAGE
================================ */
async function enviarParaStorage(file, pasta){
    const nomeUnico = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
    const caminho = `${pasta}/${nomeUnico}`;

    const { data, error } = await supabaseClient.storage
        .from(BUCKET_NAME)
        .upload(caminho, file);

    if(error){
        if(error.message.includes("Bucket not found") || error.message.includes("not found")){
            throw new Error("Erro: O bucket 'underfy-files' não foi encontrado no Supabase. Crie-o na aba Storage.");
        }
        throw new Error("Erro no upload: " + error.message);
    }

    const { data: urlData } = supabaseClient.storage
        .from(BUCKET_NAME)
        .getPublicUrl(caminho);

    return urlData.publicUrl;
}

/* ================================
   CADASTRAR ARTISTA
================================ */
async function cadastrarArtista(e){
    e.preventDefault();
    const btn = document.getElementById("btnSalvarArtista");
    btn.disabled = true;
    btn.textContent = "Cadastrando...";

    try {
        const nome = document.getElementById("artistaNome").value.trim();
        const fotoFile = document.getElementById("artistaFoto").files[0];

        mostrarToast("Enviando foto...");
        const foto_url = await enviarParaStorage(fotoFile, "artistas");

        const { error } = await supabaseClient.from("artistas").insert([{ nome, foto_url }]);
        if(error) throw error;

        mostrarToast("Artista cadastrado com sucesso!");
        e.target.reset();
        carregarArtistasSelect();
    } catch(err) {
        console.error(err);
        mostrarToast(err.message, true);
    } finally {
        btn.disabled = false;
        btn.textContent = "Salvar Artista";
    }
}

/* ================================
   CADASTRAR GUIA
================================ */
async function cadastrarGuia(e){
    e.preventDefault();
    const btn = document.getElementById("btnSalvarGuia");
    btn.disabled = true;
    btn.textContent = "Enviando arquivos...";

    try {
        const nome = document.getElementById("guiaNome").value.trim();
        const artistaId = document.getElementById("guiaArtista").value;
        const capaFile = document.getElementById("guiaCapa").files[0];
        const audioFile = document.getElementById("guiaAudio").files[0];

        mostrarToast("Enviando capa e áudio...");
        const capa_url = await enviarParaStorage(capaFile, "capas");
        const audio_url = await enviarParaStorage(audioFile, "audios");

        // 1. Insere a música
        const { data: musicaData, error: musicaError } = await supabaseClient
            .from("musicas")
            .insert([{ nome, capa_url, audio_url, plays: 0 }])
            .select()
            .single();

        if(musicaError) throw musicaError;

        // 2. Insere a relação na tabela 'musica_artistas'
        const { error: relError } = await supabaseClient
            .from("musica_artistas")
            .insert([{ musica_id: musicaData.id, artista_id: artistaId }]);

        if(relError) throw relError;

        mostrarToast("Guia cadastrada com sucesso!");
        e.target.reset();
    } catch(err) {
        console.error(err);
        mostrarToast(err.message, true);
    } finally {
        btn.disabled = false;
        btn.textContent = "Salvar Guia";
    }
}

/* ================================
   CADASTRAR PROJETO
================================ */
async function cadastrarProjeto(e){
    e.preventDefault();
    const btn = document.getElementById("btnSalvarProjeto");
    btn.disabled = true;
    btn.textContent = "Cadastrando...";

    try {
        const nome = document.getElementById("projetoNome").value.trim();
        const descricao = document.getElementById("projetoDesc").value.trim();
        const capaFile = document.getElementById("projetoCapa").files[0];

        mostrarToast("Enviando capa do projeto...");
        const capa_url = await enviarParaStorage(capaFile, "projetos");

        const { error } = await supabaseClient.from("projetos").insert([{ nome, descricao, capa_url }]);
        if(error) throw error;

        mostrarToast("Projeto cadastrado com sucesso!");
        e.target.reset();
    } catch(err) {
        console.error(err);
        mostrarToast(err.message, true);
    } finally {
        btn.disabled = false;
        btn.textContent = "Salvar Projeto";
    }
}
</script>

</body>
</html>
