<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist do Artista • UnderFy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b0b0b;color:#fff;font-family:Arial,Helvetica,sans-serif;padding-bottom:140px;}
.container{width:90%;max-width:900px;margin:auto;padding-top:30px;}
.back-link{display:inline-block;margin-bottom:20px;color:#888;text-decoration:none;font-size:14px;}
.back-link:hover{color:#fff;}

.artist-header{
    display:flex;
    align-items:center;
    gap:25px;
    background:linear-gradient(135deg,#171717,#063d20);
    padding:30px;
    border-radius:20px;
    margin-bottom:30px;
}
.artist-header img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid #1ed760;
}
.artist-info h1{font-size:32px;margin-bottom:8px;}
.artist-info p{color:#aaa;font-size:15px;}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:18px;
}
.card{
    background:#151515;
    padding:14px;
    border-radius:15px;
}
.cover{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    border-radius:10px;
    background:#252525;
}
.card h3{margin-top:12px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card p{color:#999;margin-top:5px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-plays{color:#1ed760;font-size:12px;margin-top:4px;font-weight:bold;}
.play{
    margin-top:12px;width:100%;border:0;background:#1ed760;color:#000;
    padding:10px;border-radius:20px;font-weight:bold;cursor:pointer;
}

/* PLAYER AVANÇADO */
.player{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:#171717;border-top:1px solid #292929;
    padding:14px 5%;display:none;flex-direction:column;gap:10px;
}
.player-top{display:flex;align-items:center;gap:15px;}
.player-top img{width:50px;height:50px;object-fit:cover;border-radius:7px;}
.player-info{flex:1;min-width:0;}
.player-info strong, .player-info span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.player-info span{color:#999;font-size:13px;margin-top:3px;}

.player-controls{display:flex;align-items:center;justify-content:space-between;gap:15px;}
.player-buttons{display:flex;align-items:center;gap:15px;}
.ctrl-btn{background:none;border:0;color:#aaa;font-size:18px;cursor:pointer;transition:.2s;}
.ctrl-btn:hover, .ctrl-btn.active{color:#1ed760;}
.play-pause-btn{background:#1ed760;color:#000;border:0;width:36px;height:36px;border-radius:50%;font-size:15px;font-weight:bold;display:flex;align-items:center;justify-content:center;}
audio{width:100%;height:35px;}

.empty{color:#888;text-align:center;padding:30px 10px;grid-column:1/-1;}

@media(max-width:600px){
    .artist-header{flex-direction:column;text-align:center;}
    .grid{grid-template-columns:repeat(2,1fr);gap:12px;}
}
</style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← Voltar para o início</a>

    <div class="artist-header" id="cabecalhoArtista">
        <div class="empty">Carregando artista...</div>
    </div>

    <h2 style="margin-bottom: 18px; font-size: 20px;">🎧 Guias e Participações</h2>

    <div class="grid" id="listaMusicasArtista">
        <div class="empty">Carregando guias...</div>
    </div>
</div>

<!-- PLAYER -->
<div class="player" id="player">
    <div class="player-top">
        <img id="playerCapa" src="">
        <div class="player-info">
            <strong id="playerMusica">Música</strong>
            <span id="playerArtista">Artista</span>
        </div>
    </div>
    <div class="player-controls">
        <div class="player-buttons">
            <button class="ctrl-btn" id="btnShuffle" onclick="toggleShuffle()" title="Modo Aleatório">🔀</button>
            <button class="ctrl-btn" onclick="tocarAnterior()" title="Anterior">⏮</button>
            <button class="play-pause-btn" id="btnPlayPause" onclick="pausarRetomar()">⏸</button>
            <button class="ctrl-btn" onclick="tocarProxima()" title="Próxima">⏭</button>
            <button class="ctrl-btn" id="btnRepeat" onclick="toggleRepeat()" title="Repetir">🔁</button>
        </div>
        <audio id="audio" controls></audio>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://gnibzbnypirjrcaoibkx.supabase.co";
const SUPABASE_KEY = "sb_publishable_b9yvSbmWOLVJvq4AB4CLmQ_VRuzpG5T";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const urlParams = new URLSearchParams(window.location.search);
const nomeArtistaParam = urlParams.get('nome');

let minhasMusicas = [];
let musicaAtualIndex = -1;
let modoShuffle = false;
let modoRepeat = false;

async function carregarPaginaArtista() {
    if (!nomeArtistaParam) {
        window.location.href = "index.html";
        return;
    }

    try {
        const { data: artistaData, error: errArtista } = await supabaseClient
            .from('artistas')
            .select('*')
            .ilike('nome', nomeArtistaParam)
            .single();

        if (errArtista || !artistaData) {
            document.getElementById("cabecalhoArtista").innerHTML = `<div class="empty">Artista não encontrado.</div>`;
            return;
        }

        document.getElementById("cabecalhoArtista").innerHTML = `
            <img src="${artistaData.foto_url || 'https://via.placeholder.com/500'}" onerror="this.src='https://via.placeholder.com/500'">
            <div class="artist-info">
                <h1>${artistaData.nome}</h1>
                <p>Playlist oficial de guias e participações no UnderFy</p>
            </div>
        `;

        const { data: dadosMusicas } = await supabaseClient.from('musicas').select('*');
        const { data: dadosRelacao } = await supabaseClient.from('musica_artistas').select('*');
        const { data: artistasCache } = await supabaseClient.from('artistas').select('*');

        const musicasFormatadas = (dadosMusicas || []).map(m => {
            const relsDaMusica = (dadosRelacao || []).filter(r => r.musica_id === m.id);
            const objsArtistas = relsDaMusica.map(r => artistasCache.find(a => a.id === r.artista_id)).filter(Boolean);
            const artistasNomes = objsArtistas.length > 0 ? objsArtistas.map(a => a.nome) : ['Desconhecido'];

            let textoArtistaFormatado = artistasNomes[0];
            if (artistasNomes.length > 1) {
                textoArtistaFormatado += ` feat. ${artistasNomes.slice(1).join(', ')}`;
            }

            return {
                id: m.id,
                nome: m.nome,
                artistas: artistasNomes,
                artistaFormatado: textoArtistaFormatado,
                capa: m.capa_url || 'https://via.placeholder.com/500',
                audio: m.audio_url || '',
                plays: m.plays || 0
            };
        });

        minhasMusicas = musicasFormatadas.filter(m => m.artistas.includes(artistaData.nome));
        
        const container = document.getElementById("listaMusicasArtista");
        container.innerHTML = "";

        if (minhasMusicas.length === 0) {
            container.innerHTML = `<div class="empty">Este artista ainda não possui guias cadastradas.</div>`;
            return;
        }

        minhasMusicas.forEach((musica, index) => {
            container.innerHTML += `
            <div class="card">
                <img class="cover" src="${musica.capa}" onerror="this.src='https://via.placeholder.com/500'">
                <h3>${musica.nome}</h3>
                <p>${musica.artistaFormatado}</p>
                <div class="card-plays">▶ ${musica.plays} reprodução(ões)</div>
                <button class="play" onclick="tocarMusicaPorIndex(${index})">
                    ▶ Ouvir guia
                </button>
            </div>
            `;
        });

        const audio = document.getElementById("audio");
        audio.addEventListener('ended', lidarFimDaMusica);

    } catch (err) {
        console.error("Erro:", err);
    }
}

async function tocarMusicaPorIndex(index) {
    if (index < 0 || index >= minhasMusicas.length) return;
    musicaAtualIndex = index;
    const musica = minhasMusicas[musicaAtualIndex];

    document.getElementById("player").style.display = "flex";
    document.getElementById("playerMusica").textContent = musica.nome;
    document.getElementById("playerArtista").textContent = musica.artistaFormatado;
    document.getElementById("playerCapa").src = musica.capa;
    
    const audio = document.getElementById("audio");
    if (!musica.audio) {
        alert("Áudio não cadastrado.");
        return;
    }

    audio.src = musica.audio;
    audio.play();
    document.getElementById("btnPlayPause").textContent = "⏸";

    musica.plays += 1;
    try {
        await supabaseClient.from('musicas').update({ plays: musica.plays }).eq('id', musica.id);
    } catch(err) {}
}

function pausarRetomar() {
    const audio = document.getElementById("audio");
    const btn = document.getElementById("btnPlayPause");
    if (audio.paused) {
        audio.play();
        btn.textContent = "⏸";
    } else {
        audio.pause();
        btn.textContent = "▶";
    }
}

function tocarProxima() {
    if (minhasMusicas.length === 0) return;
    let proximoIndex;
    if (modoShuffle) {
        proximoIndex = Math.floor(Math.random() * minhasMusicas.length);
    } else {
        proximoIndex = (musicaAtualIndex + 1) % minhasMusicas.length;
    }
    tocarMusicaPorIndex(proximoIndex);
}

function tocarAnterior() {
    if (minhasMusicas.length === 0) return;
    let anteriorIndex = (musicaAtualIndex - 1 + minhasMusicas.length) % minhasMusicas.length;
    tocarMusicaPorIndex(anteriorIndex);
}

function lidarFimDaMusica() {
    if (modoRepeat) {
        const audio = document.getElementById("audio");
        audio.currentTime = 0;
        audio.play();
    } else {
        tocarProxima();
    }
}

function toggleShuffle() {
    modoShuffle = !modoShuffle;
    const btn = document.getElementById("btnShuffle");
    if (modoShuffle) btn.classList.add("active");
    else btn.classList.remove("active");
}

function toggleRepeat() {
    modoRepeat = !modoRepeat;
    const btn = document.getElementById("btnRepeat");
    if (modoRepeat) {
        btn.classList.add("active");
        btn.style.color = "#1ed760";
    } else {
        btn.classList.remove("active");
        btn.style.color = "#aaa";
    }
}

document.addEventListener('DOMContentLoaded', carregarPaginaArtista);
</script>

</body>
</html>
